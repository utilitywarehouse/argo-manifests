apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: data-export-customer-support-accounts
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      customer-support account export

  labels:
    workflows.argoproj.io/creator: qe
    data.uw.systems/system: customer-support-accounts
    data.uw.systems/capability: data-export
spec:
  schedules:
    - "0 2 * * *"
  timezone: Europe/London
  suspend: true # manual-only until a schedule is intentionally enabled
  concurrencyPolicy: Forbid
  workflowSpec:
    serviceAccountName: workflow-step-executor
    workflowMetadata:
      labels:
        data.uw.systems/system: customer-support-accounts
        data.uw.systems/capability: data-export
    workflowTemplateRef:
      name: step-data-orchestrator-runner
    arguments:
      parameters:
        - { name: mode, value: export }
        - { name: run-type, value: RUN_TYPE_EXPORT }
        - { name: system-key, value: customer_support_accounts }
        - { name: label, value: customer-support-accounts-export }
        - { name: adapter-driver, value: elasticsearch }
        - { name: image-pull-secret, value: docker-registry-key }
        - { name: adapter-dsn, value: "http://elasticsearch:9200" }
        - { name: entities, value: "account_v4" }

        # `id`, not `accountId` — account_v4 has no accountId, and not
        # `id.keyword` either: it is already a keyword, which is why a terms
        # query on the raw field matches. Both mistakes export nothing and say
        # nothing.
        - { name: key-field, value: "id" }

        # An allow-list, not an exclusion: a field added upstream stays out of
        # the export until somebody decides it belongs, which is the safe
        # direction for a source holding customer records — and the only thing
        # standing between this and a support-notes column if the workflow is
        # ever pointed at an environment holding real customers.
        #
        # Everything account_v4 actually carries, so the export is enough to
        # seed an environment from: identity, the account name and number, the
        # correspondence address and email, the staff flag, and dates of birth.
        #
        # Two are left out.
        # `comment` is 1.9M free-text support notes.
        # `account_holders.*` is mapped but empty
        - {
            name: fields,
            value: "id,number,name,is_staff,correspondence_email,correspondence_address.*,date_of_birth_1,date_of_birth_2",
          }

        # Mandatory alongside `fields`, not an optimisation. Without it the
        # adapter also writes a `document` column holding the whole _source and
        # the list above becomes decoration — everything excluded travels to S3
        # inside it. With it, the search asks Elasticsearch only for the listed
        # paths, so what is not exported is never read.
        - { name: skip-document, value: "true" }
