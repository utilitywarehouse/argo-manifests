apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: data-export-customer-support-accounts
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      customer-support account export

  labels:
    workflows.argoproj.io/creator: qe
    data.uw.systems/system: customer-support-accounts
    data.uw.systems/capability: data-export
spec:
  schedules:
    - "0 2 * * *"
  timezone: Europe/London
  suspend: true # manual-only until a schedule is intentionally enabled
  concurrencyPolicy: Forbid
  workflowSpec:
    serviceAccountName: workflow-step-executor
    workflowMetadata:
      labels:
        data.uw.systems/system: customer-support-accounts
        data.uw.systems/capability: data-export
    workflowTemplateRef:
      name: step-data-orchestrator-runner
    arguments:
      parameters:
        - { name: mode, value: export }
        - { name: run-type, value: RUN_TYPE_EXPORT }
        - { name: system-key, value: customer_support_accounts }
        - { name: label, value: customer-support-accounts-export }
        - { name: adapter-driver, value: elasticsearch }
        - { name: image-pull-secret, value: docker-registry-key }
        - { name: adapter-dsn, value: "http://elasticsearch:9200" }
        - { name: entities, value: "account_v4" }

        # `id`, not `accountId`: account_v4 has no accountId. Not `id.keyword`
        # either — it is already a keyword. Either mistake exports nothing.
        - { name: key-field, value: "id" }

        # An allow-list, so a field added upstream stays out until someone
        # decides it belongs. Everything account_v4 carries except `comment`
        # (1.9M free-text support notes) and `account_holders.*` (mapped, empty).
        #
        # Not `id`: the key field is always column 0 and the driver skips it when
        # matching, so listing it fails the export as an unmatched pattern.
        - {
            name: fields,
            value: "number,name,is_staff,correspondence_email,correspondence_address.*,date_of_birth_1,date_of_birth_2",
          }

        # Required with `fields`, not an optimisation: otherwise the adapter also
        # writes a `document` column holding the whole _source, and everything
        # excluded above travels to S3 inside it.
        - { name: skip-document, value: "true" }
