apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-executor-remote-namespace
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: qe
    workflows.argoproj.io/invocation: reference-only
spec:
  templates:
    # FIXME: data only travels IN as values substituted into job-template, never as a
    # file — Argo mounts artifacts onto THIS pod, while the Job runs in another cluster
    # with no Argo executor or artifact-repo creds. So multi-line data has to be inlined
    # and breaks the Job manifest's YAML, capping callers at one row (see the FIXMEs in
    # step-billing-set-invoice-number / step-billing-produce-fwf). Fix in exec-kube:
    # take an input artifact here, project it as a ConfigMap in the target namespace and
    # volumeMount it into the Job's containers, owner-referenced to the Job for GC. Also
    # needs configmaps create/delete on the job-executor Role
    # (system/namespaced/workflow/modules/job-executor/sa.yaml), and is ~1MiB-capped.
    - name: execute-job
      inputs:
        parameters:
          # cluster-name is the single key that resolves everything 1:1: the CA cert
          # (cluster-ca-certs/<cluster-name>-ca.crt), the token
          # (job-executor-tokens/<cluster-name>-<namespace>) and the API server URL
          # (cluster-servers/<cluster-name>, see CLUSTER_SERVER below).
          - name: cluster-name
          - name: target-namespace
          # The ONLY thing that names the Job: exec-kube creates
          # `<job-name>-<workflow.uid[:8]>` and rebuilds ObjectMeta from scratch, so a
          # `metadata:` in job-template below is parsed and discarded. The uid suffix
          # is identical for every step of one run, so job-name must be unique across
          # EVERY execute-job call a workflow makes into the same cluster+namespace —
          # including calls made by templates it composes. Reusing one means the second
          # Job creates while the first is still being torn down:
          #   failed to create job: object is being deleted: jobs.batch "x" already exists
          # Name it after the WORK, never the namespace (the namespace is what
          # collides). DNS-1123 slug, <= 54 chars. See docs/template-naming.md.
          - name: job-name
          - name: job-template
          - name: timeout
            value: "5m"
          - name: teardown
            value: "true"
          - name: log-level
            value: "info"
      outputs:
        artifacts:
          - name: result
            path: /tmp/result.txt
            archive:
              none: {}
          - name: logs
            path: /tmp/logs.txt
            archive:
              none: {}
        parameters:
          - name: result
            valueFrom:
              path: /tmp/result.txt
      volumes:
        - name: job-executor-tokens
          secret:
            secretName: job-executor-tokens
        - name: cluster-ca-certs
          configMap:
            name: cluster-ca-certs
      container:
        image: registry.uw.systems/dev-enablement/exec-kube:main
        args: [run]
        env:
          - name: CLUSTER_NAME
            value: "{{inputs.parameters.cluster-name}}"
          # Resolved from the per-environment cluster-servers ConfigMap by cluster-name;
          # Argo substitutes {{inputs.parameters.cluster-name}} into the key before submit.
          - name: CLUSTER_SERVER
            valueFrom:
              configMapKeyRef:
                name: cluster-servers
                key: "{{inputs.parameters.cluster-name}}"
          - name: NAMESPACE
            value: "{{inputs.parameters.target-namespace}}"
          - name: JOB_TEMPLATE
            value: "{{inputs.parameters.job-template}}"
          - name: WORKFLOW_NAME
            value: "{{workflow.name}}"
          - name: WORKFLOW_UID
            value: "{{workflow.uid}}"
          # exec-kube's --workflow-step-name, which is what it prefixes the Job name
          # with. Passed explicitly rather than taken from the calling step's name:
          # the step name is the namespace-labelled node the UI graph wants, and
          # several templates legitimately share one.
          - name: WORKFLOW_STEP_NAME
            value: "{{inputs.parameters.job-name}}"
          - name: TIMEOUT
            value: "{{inputs.parameters.timeout}}"
          - name: TEARDOWN
            value: "{{inputs.parameters.teardown}}"
          - name: LOG_LEVEL
            value: "{{inputs.parameters.log-level}}"
          - name: TOKENS_PATH
            value: /secrets/tokens
          - name: CERTS_PATH
            value: /certs
          - name: RESULT_PATH
            value: /tmp/result.txt
          - name: LOGS_PATH
            value: /tmp/logs.txt
        volumeMounts:
          - name: job-executor-tokens
            mountPath: /secrets/tokens
          - name: cluster-ca-certs
            mountPath: /certs
