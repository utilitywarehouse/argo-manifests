apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-executor-remote-namespace
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: qe
    workflows.argoproj.io/invocation: reference-only
spec:
  templates:
    # FIXME: data travels IN only as values substituted into job-template, never as a
    # file — Argo mounts artifacts onto THIS pod, while the Job runs in another cluster
    # with no Argo executor or artifact-repo creds. Multi-line data inlined this way
    # breaks the Job manifest's YAML, capping callers at one row (see the FIXMEs in
    # step-billing-set-invoice-number / step-billing-produce-fwf). Fix in exec-kube:
    # take an input artifact here, project it as a ConfigMap in the target namespace,
    # volumeMounted into the Job's containers and owner-referenced to the Job for GC.
    # Needs configmaps create/delete on the job-executor Role
    # (system/namespaced/workflow/modules/job-executor/sa.yaml); ~1MiB cap.
    - name: execute-job
      inputs:
        parameters:
          # Resolves everything 1:1: the CA cert (cluster-ca-certs/<name>-ca.crt), the
          # token (job-executor-tokens/<name>-<namespace>) and the API server URL
          # (cluster-servers/<name>).
          - name: cluster-name
          - name: target-namespace
          # The ONLY thing that names the Job: exec-kube creates
          # `argo-<job-name>-<workflow.uid[:8]>` and rebuilds ObjectMeta from scratch,
          # so a `metadata:` in job-template is parsed and discarded. The uid suffix is
          # identical for every step of one run, so job-name must be unique across EVERY
          # execute-job call a workflow makes into the same cluster+namespace, composed
          # templates included. Reusing one gives:
          #   failed to create job: object is being deleted: jobs.batch "x" already exists
          # Name it after the WORK, never the namespace. DNS-1123 slug, <= 49 chars.
          # See docs/template-naming.md.
          - name: job-name
          - name: job-template
          # The FAILURE deadline: reaching it fails the step. Keep it the real
          # ceiling and use detach-after to stop watching without failing.
          - name: timeout
            value: "5m"
          # Stop watching after this long and exit 0, leaving the Job running and
          # skipping teardown. Empty watches to completion. Must be less than
          # timeout, or exec-kube rejects it at startup. The caller needs its own
          # gate on the work landing; `result` is empty when this fires.
          - name: detach-after
            value: ""
          - name: teardown
            value: "true"
          - name: log-level
            value: "info"
      outputs:
        artifacts:
          - name: result
            path: /tmp/result.txt
            globalName: "{{inputs.parameters.job-name}}"
            archive:
              none: {}
          - name: logs
            path: /tmp/logs.txt
            archive:
              none: {}
        parameters:
          - name: result
            valueFrom:
              path: /tmp/result.txt
      volumes:
        - name: job-executor-tokens
          secret:
            secretName: job-executor-tokens
        - name: cluster-ca-certs
          configMap:
            name: cluster-ca-certs
      container:
        image: registry.uw.systems/dev-enablement/exec-kube:main
        args: [run]
        env:
          - name: CLUSTER_NAME
            value: "{{inputs.parameters.cluster-name}}"
          # Keyed by cluster-name, substituted into the key before submit.
          - name: CLUSTER_SERVER
            valueFrom:
              configMapKeyRef:
                name: cluster-servers
                key: "{{inputs.parameters.cluster-name}}"
          - name: NAMESPACE
            value: "{{inputs.parameters.target-namespace}}"
          - name: JOB_TEMPLATE
            value: "{{inputs.parameters.job-template}}"
          - name: WORKFLOW_NAME
            value: "{{workflow.name}}"
          - name: WORKFLOW_UID
            value: "{{workflow.uid}}"
          # exec-kube's --workflow-step-name, its Job-name prefix. Explicit rather
          # than the calling step's name, which is namespace-labelled for the UI
          # graph and shared by several templates.
          - name: WORKFLOW_STEP_NAME
            value: "argo-{{inputs.parameters.job-name}}"
          - name: TIMEOUT
            value: "{{inputs.parameters.timeout}}"
          - name: DETACH_AFTER
            value: "{{inputs.parameters.detach-after}}"
          - name: TEARDOWN
            value: "{{inputs.parameters.teardown}}"
          - name: LOG_LEVEL
            value: "{{inputs.parameters.log-level}}"
          - name: TOKENS_PATH
            value: /secrets/tokens
          - name: CERTS_PATH
            value: /certs
          - name: RESULT_PATH
            value: /tmp/result.txt
          - name: LOGS_PATH
            value: /tmp/logs.txt
        volumeMounts:
          - name: job-executor-tokens
            mountPath: /secrets/tokens
          - name: cluster-ca-certs
            mountPath: /certs
