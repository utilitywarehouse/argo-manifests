# =============================================================================
# grpc-call — one gRPC request against a service in another namespace
# =============================================================================
# A one-pod Job running the `call-grpc` executor, dispatched via
# step-executor-remote-namespace. Descriptors come from server reflection, so no
# .proto files travel with it. HTTP twin: step-http-call — same parameters,
# predicates and auth.
#
# Predicates are expr over `response.{status, ok, headers, body, messages, raw}`
# (status 0 on OK, body the last message, messages all of a server-streaming
# call):
#
#   success-expr  poll until true                 (omit for a fire-once call)
#   failure-expr  bail early when true            (poll mode only)
#   assert        assert once, no polling         (excludes success-expr)
#   result-expr   capture a value -> step `result`
#
# With `assert` unset the call still requires response.ok.
#
# ⚠️ POLLING DOES NOT RETRY ERRORS. success-expr re-issues only on a RESPONSE
# that fails the predicate; a non-OK status is an error and the executor exits.
# "Busy, ask again" is `retry-on`: re-makes a FAILED call whose error or body
# matches that substring. Never fires for a call that is merely slow.
#
# address-from-pod dials a Running pod's IP for targets with no Service
# (billing-processor, by design). Needs `pods list` on the runner-sa.
#
# AUTH, composable: `use-iam` (machine principal from the Job pod's SA, needs
# iam-machine-api reachable by runner-sa); `token` (user principal, a parameter
# not a Secret because it is ephemeral, and it WINS `authorization`). The
# executor merges both and never logs the token.
#
# THREE CLOCKS, and only the middle one is safe to shorten:
#
#   timeout       how long the CALL may take; bounds the executor and, +2m, the
#                 Job. ⚠️ NEVER cut this to stop waiting — it cancels the RPC,
#                 and a server tying its work to the client context
#                 (billing-processor does) throws the work away with it.
#   watch-window  how long WE watch. On expiry exec-kube stops streaming and
#                 exits ZERO, leaving the Job running and skipping teardown.
#                 Empty watches to completion.
#   failure       reaching `timeout` while still watching.
#
# Set watch-window only where the caller has its own gate on the work landing
# (see step-energy-reprocess-bills: `send` detaches, `await` is the gate). It
# needs no `continueOn`, and a REAL failure inside the window still fails the
# caller. `heartbeat` keeps a long block distinguishable from a hang.
#
# Reference-only: consumed via templateRef.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-grpc-call
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI. One gRPC request/poll against a service,
      dispatched as a Job into its namespace. Consumed via templateRef.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: qe
    workflows.argoproj.io/invocation: reference-only
spec:
  entrypoint: call
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: op-name } # names the Job; unique across the whole run
      - { name: method } # fully-qualified, e.g. pkg.Service/Method
      - { name: address, value: "" } # e.g. billing-orchestrator:8090
      - { name: payload, value: "" } # request body as JSON; empty => empty message
      - { name: success-expr, value: "" } # poll until true; empty => fire once
      - { name: failure-expr, value: "" } # bail early when true; poll mode only
      - { name: assert, value: "" } # assert-once alternative to success-expr
      - { name: assert-message, value: "" } # failure message; {expr} segments interpolated
      - { name: result-expr, value: "" } # value to capture -> step `result` output
      - { name: address-from-pod, value: "" } # label selector, e.g. app=billing-processor
      - { name: address-port, value: "8090" } # port to dial on the resolved pod
      - { name: retry-on, value: "" } # substring in the output meaning "busy, re-ask"
      - { name: attempts, value: "1" } # total tries, retry-on matches only
      - { name: retry-wait, value: "60" } # seconds between attempts
      - { name: use-iam, value: "false" }
      - { name: token, value: "" }
      - { name: extra-headers, value: "" } # comma-separated `name: value`
      - { name: cluster-name, value: dev-merit }
      - { name: target-namespace } # no default: this template has no domain
      # call-grpc-image is a template input only (below): pinned by the
      # image-versions ConfigMap, not settable from the UI.
      - { name: plaintext, value: "true" } # false for a TLS endpoint
      - { name: wait-for-ready, value: "true" } # wait for reflection to answer first
      - { name: runner-sa, value: default } # pod identity in the target ns
      - { name: image-pull-secret, value: dockerhub-key } # must exist in target ns
      - { name: log-level, value: info }
      - { name: timeout, value: 5m } # how long the CALL may take
      - { name: watch-window, value: "" } # how long WE watch; empty => to completion
      - { name: heartbeat, value: 30s } # progress line while the call blocks; 0s to silence
      - { name: poll-interval, value: 5s } # gap between polls; poll mode only
      - { name: job-ttl, value: 24h } # keep finished Job for debug, then GC

  templates:
    - name: call
      inputs:
        parameters:
          - { name: op-name }
          - { name: method }
          - { name: address, value: "" }
          - { name: payload, value: "" }
          - { name: success-expr, value: "" }
          - { name: failure-expr, value: "" }
          - { name: assert, value: "" }
          - { name: assert-message, value: "" }
          - { name: result-expr, value: "" }
          - { name: address-from-pod, value: "" }
          - { name: address-port, value: "8090" }
          - { name: retry-on, value: "" }
          - { name: attempts, value: "1" }
          - { name: retry-wait, value: "60" }
          - { name: use-iam, value: "false" }
          - { name: token, value: "" }
          - { name: extra-headers, value: "" }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace }
          - {
              name: call-grpc-image,
              value: "registry.uw.systems/dev-enablement/call-grpc:main",
            }
          - { name: plaintext, value: "true" }
          - { name: wait-for-ready, value: "true" }
          - { name: runner-sa, value: default }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: log-level, value: info }
          - { name: timeout, value: 5m }
          - { name: watch-window, value: "" }
          - { name: heartbeat, value: 30s }
          - { name: poll-interval, value: 5s }
          - { name: job-ttl, value: 24h }
      outputs:
        # The Job's captured value (RESULT_EXPR -> ARGO_RESULT_OUTPUT).
        parameters:
          - name: result
            valueFrom:
              parameter: "{{steps.call.outputs.parameters.result}}"
      steps:
        # Not namespace-named as domain templates are: this one cannot know it.
        - - name: call
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                # The call's timeout +2m, matching activeDeadlineSeconds below, so
                # exec-kube outlives the call it watches. The 's' sits outside the
                # tag: expr yields an integer, YAML makes it a duration string.
                - name: timeout
                  value: "{{=int(duration(inputs.parameters['timeout']).Seconds()) + 120}}s"
                - {
                    name: detach-after,
                    value: "{{inputs.parameters.watch-window}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                # op-name is the ONLY discriminator: job_names.rego rejects a
                # job-name built from two parameters.
                - {
                    name: job-name,
                    value: "grpc-call-{{inputs.parameters.op-name}}",
                  }
                # Job manifest as a string, substituted before exec-kube creates
                # it. No `metadata:` — exec-kube discards it and uses job-name.
                # No shell: every caller value arrives as an env var in a |- block
                # scalar a quote cannot close. See docs/template-naming.md.
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['timeout']).Seconds()) + 120}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          serviceAccountName: {{inputs.parameters.runner-sa}}
                          imagePullSecrets:
                            - name: {{inputs.parameters.image-pull-secret}}
                          restartPolicy: Never
                          containers:
                            - name: call
                              image: {{inputs.parameters.call-grpc-image}}
                              imagePullPolicy: Always
                              command: ["/app/executor"]
                              env:
                                - name: ADDRESS
                                  value: |-
                                    {{inputs.parameters.address}}
                                - name: ADDRESS_FROM_POD
                                  value: |-
                                    {{inputs.parameters.address-from-pod}}
                                - name: ADDRESS_PORT
                                  value: |-
                                    {{inputs.parameters.address-port}}
                                - name: METHOD
                                  value: |-
                                    {{inputs.parameters.method}}
                                - name: PAYLOAD
                                  value: |-
                                    {{inputs.parameters.payload}}
                                - name: SUCCESS_EXPR
                                  value: |-
                                    {{inputs.parameters.success-expr}}
                                - name: FAILURE_EXPR
                                  value: |-
                                    {{inputs.parameters.failure-expr}}
                                - name: ASSERT
                                  value: |-
                                    {{inputs.parameters.assert}}
                                - name: ASSERT_MESSAGE
                                  value: |-
                                    {{inputs.parameters.assert-message}}
                                - name: RESULT_EXPR
                                  value: |-
                                    {{inputs.parameters.result-expr}}
                                - { name: RESULT_PATH, value: /tmp/result }
                                # Only when asked for: with result-expr empty the
                                # executor would capture the whole response body.
                                - { name: RESULT_MARKER, value: "{{=inputs.parameters['result-expr'] != '' ? 'true' : 'false'}}" }
                                - name: RETRY_ON
                                  value: |-
                                    {{inputs.parameters.retry-on}}
                                - name: ATTEMPTS
                                  value: |-
                                    {{inputs.parameters.attempts}}
                                - name: RETRY_WAIT
                                  value: |-
                                    {{inputs.parameters.retry-wait}}
                                - { name: HEARTBEAT, value: "{{=int(duration(inputs.parameters['heartbeat']).Seconds())}}" }
                                # Machine principal: rides a dial interceptor as
                                # `uw.iam.machine` metadata on every RPC, reflection
                                # included — never goes near HEADERS.
                                - { name: IAM, value: "{{inputs.parameters.use-iam}}" }
                                # User principal; merged into HEADERS as
                                # `authorization: Bearer <token>`, never logged.
                                - name: TOKEN
                                  value: |-
                                    {{inputs.parameters.token}}
                                # The executor merges TOKEN in — nothing to assemble here.
                                - name: HEADERS
                                  value: |-
                                    {{inputs.parameters.extra-headers}}
                                - { name: PLAINTEXT, value: "{{inputs.parameters.plaintext}}" }
                                - { name: WAIT_FOR_READY, value: "{{inputs.parameters.wait-for-ready}}" }
                                - { name: TIMEOUT, value: "{{=int(duration(inputs.parameters['timeout']).Seconds())}}" }
                                - { name: POLL_INTERVAL, value: "{{=int(duration(inputs.parameters['poll-interval']).Seconds())}}" }
                                - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }
