# =============================================================================
# grpc-call — one gRPC request against a service in another namespace
# =============================================================================
# A one-pod Job running the `call-grpc` executor, dispatched via
# step-executor-remote-namespace into the namespace where the target runs.
# Descriptors come from server reflection, so no .proto files travel with it.
# The HTTP twin is step-http-call: same parameters, same predicates, same auth.
#
# Predicates are expr over `response.{status, ok, headers, body, messages, raw}`
# (status 0 on OK, body the last message, messages all of a server-streaming
# call):
#
#   success-expr  poll the method until true      (omit for a fire-once call)
#   failure-expr  bail early when true            (poll mode only)
#   assert        assert once, no polling         (excludes success-expr)
#   result-expr   capture a value -> step `result`
#
# With `assert` unset the call still requires response.ok.
#
# ⚠️ POLLING DOES NOT RETRY ERRORS. success-expr re-issues the call only on a
# RESPONSE that fails the predicate; a non-OK gRPC status is an error and the
# executor exits on it. "Busy, ask again" cannot be a predicate — that is what
# `retry-on` is for, which greps the executor's output and re-runs it.
#
# address-from-pod dials a Running pod's IP for targets with no Service at all
# (billing-processor, by design). Needs `pods list` on the runner-sa.
#
# AUTH, composable: `use-iam` for a machine principal minted from the Job pod's
# ServiceAccount (needs iam-machine-api reachable by the runner-sa); `token` for
# a user principal, kept a parameter not a Secret because it is ephemeral, and
# assembled in-shell so it never lands in the rendered manifest; neither if the
# target authenticates no-one.
#
# TWO CLOCKS. `timeout` is how long the CALL may take — it bounds the executor
# and, +2m, the Job. `watch-timeout` is how long WE watch; empty means `timeout`.
# Setting it shorter is how a caller stops watching a method that blocks for the
# whole job it kicks off: exec-kube stops streaming and exits non-zero without
# reaching teardown, so nothing is deleted or cancelled and the call finishes on
# its own clock. Pair with `continueOn: {failed: true}` so the caller stays green
# (step-energy-reprocess-bills' `send`), and only where the caller has its own
# gate on the work landing — past the watch window that gate is the only verdict.
# The gate is never this template's business; it can be any step at all.
#
# ⚠️ Shorten watch-timeout, NEVER timeout. Cutting `timeout` makes call-grpc
# cancel the RPC, and a server that ties its work to the client's context
# (billing-processor does) throws the work away with it.
#
# Reference-only: consumed via templateRef.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-grpc-call
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI. One gRPC request/poll against a service,
      dispatched as a Job into its namespace. Consumed via templateRef.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: qe
    workflows.argoproj.io/invocation: reference-only
spec:
  entrypoint: call
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: op-name } # names the Job; unique across the whole run
      - { name: method } # fully-qualified, e.g. pkg.Service/Method
      - { name: address, value: "" } # e.g. billing-orchestrator:8090
      - { name: payload, value: "" } # request body as JSON; empty => empty message
      - { name: success-expr, value: "" } # poll until true; empty => fire once
      - { name: failure-expr, value: "" } # bail early when true; poll mode only
      - { name: assert, value: "" } # assert-once alternative to success-expr
      - { name: assert-message, value: "" } # failure message; {expr} segments interpolated
      - { name: result-expr, value: "" } # value to capture -> step `result` output
      - { name: address-from-pod, value: "" } # label selector, e.g. app=billing-processor
      - { name: address-port, value: "8090" } # port to dial on the resolved pod
      - { name: retry-on, value: "" } # substring in the output meaning "busy, re-ask"
      - { name: attempts, value: "1" } # total tries, retry-on matches only
      - { name: retry-wait, value: "60" } # seconds between attempts
      - { name: use-iam, value: "false" }
      - { name: token, value: "" }
      - { name: extra-headers, value: "" } # comma-separated `name: value`
      - { name: cluster-name, value: dev-merit }
      - { name: target-namespace } # no default: this template has no domain
      # call-grpc-image is a template input only (below): pinned by the
      # image-versions ConfigMap, not settable from the UI.
      - { name: plaintext, value: "true" } # false for a TLS endpoint
      - { name: wait-for-ready, value: "true" } # wait for reflection to answer first
      - { name: runner-sa, value: default } # pod identity in the target ns
      - { name: image-pull-secret, value: dockerhub-key } # must exist in target ns
      - { name: log-level, value: info }
      - { name: timeout, value: 5m } # how long the CALL may take
      - { name: watch-timeout, value: "" } # how long WE watch it; empty => timeout
      - { name: poll-interval, value: 5s } # gap between polls; poll mode only
      - { name: job-ttl, value: 24h } # keep finished Job for debug, then GC

  templates:
    - name: call
      inputs:
        parameters:
          - { name: op-name }
          - { name: method }
          - { name: address, value: "" }
          - { name: payload, value: "" }
          - { name: success-expr, value: "" }
          - { name: failure-expr, value: "" }
          - { name: assert, value: "" }
          - { name: assert-message, value: "" }
          - { name: result-expr, value: "" }
          - { name: address-from-pod, value: "" }
          - { name: address-port, value: "8090" }
          - { name: retry-on, value: "" }
          - { name: attempts, value: "1" }
          - { name: retry-wait, value: "60" }
          - { name: use-iam, value: "false" }
          - { name: token, value: "" }
          - { name: extra-headers, value: "" }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace }
          - {
              name: call-grpc-image,
              value: "registry.uw.systems/dev-enablement/call-grpc:main",
            }
          - { name: plaintext, value: "true" }
          - { name: wait-for-ready, value: "true" }
          - { name: runner-sa, value: default }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: log-level, value: info }
          - { name: timeout, value: 5m }
          - { name: watch-timeout, value: "" }
          - { name: poll-interval, value: 5s }
          - { name: job-ttl, value: 24h }
      outputs:
        # The Job's captured value (RESULT_EXPR -> ARGO_RESULT_OUTPUT), so
        # callers can thread ids between stages.
        parameters:
          - name: result
            valueFrom:
              parameter: "{{steps.call.outputs.parameters.result}}"
      steps:
        # Not named for the namespace, as domain templates are — this one cannot
        # know it. The caller's own step name carries that.
        - - name: call
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                # How long exec-kube streams the logs, NOT how long the call may
                # take — see TWO CLOCKS in the header.
                - name: timeout
                  value: "{{=inputs.parameters['watch-timeout'] == '' ? inputs.parameters['timeout'] : inputs.parameters['watch-timeout']}}"
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                # op-name is the ONLY discriminator: job_names.rego rejects a
                # job-name built from two parameters, since the shared half then
                # repeats across calls to this template.
                - {
                    name: job-name,
                    value: "grpc-call-{{inputs.parameters.op-name}}",
                  }
                # Job manifest as a string; Argo substitutes before exec-kube
                # creates it. No `metadata:` — exec-kube discards it and names the
                # Job from job-name above.
                #
                # The shell body carries no {{...}} of its own: everything it
                # branches on arrives as an env var, which keeps interpolated
                # values in |- block scalars where a quote cannot break the
                # manifest. See docs/template-naming.md.
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['timeout']).Seconds()) + 120}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          serviceAccountName: {{inputs.parameters.runner-sa}}
                          imagePullSecrets:
                            - name: {{inputs.parameters.image-pull-secret}}
                          restartPolicy: Never
                          containers:
                            - name: call
                              image: {{inputs.parameters.call-grpc-image}}
                              imagePullPolicy: Always
                              command: [sh, -c]
                              args:
                                - |
                                  set -eu
                                  # No Service: dial a Running pod's IP. wget, not curl (not in
                                  # the image); SSL_CERT_FILE, not --ca-certificate; and the
                                  # trailing cut drops Calico's /32.
                                  if [ -n "${POD_SELECTOR:-}" ]; then
                                    SA=/var/run/secrets/kubernetes.io/serviceaccount
                                    ip=$(SSL_CERT_FILE=$SA/ca.crt wget -qO- --header="Authorization: Bearer $(cat $SA/token)" \
                                      "https://kubernetes.default.svc/api/v1/namespaces/$(cat $SA/namespace)/pods?labelSelector=${POD_SELECTOR}&fieldSelector=status.phase%3DRunning" \
                                      | tr ',' '\n' | grep '"podIP"' | head -1 | cut -d'"' -f4 | cut -d/ -f1)
                                    [ -n "$ip" ] || { echo "no Running pod matching ${POD_SELECTOR}"; exit 1; }
                                    export ADDRESS="$ip:${ADDRESS_PORT}"
                                    echo "resolved ${POD_SELECTOR} to $ADDRESS"
                                  fi
                                  # Only when supplied: an empty token must not send a bare
                                  # "Bearer " at a target that authenticates no-one.
                                  if [ -n "${TOKEN:-}" ]; then
                                    export HEADERS="authorization: Bearer ${TOKEN}${EXTRA_HEADERS:+,$EXTRA_HEADERS}"
                                  elif [ -n "${EXTRA_HEADERS:-}" ]; then
                                    export HEADERS="$EXTRA_HEADERS"
                                  fi
                                  i=1
                                  while :; do
                                    # Redirected, not piped: `if cmd | tee` tests tee's exit
                                    # status, so every failure would read as a success.
                                    if /app/executor >/tmp/run.log 2>&1; then cat /tmp/run.log; break; fi
                                    cat /tmp/run.log
                                    { [ -n "${RETRY_ON:-}" ] && grep -qi "$RETRY_ON" /tmp/run.log; } || exit 1
                                    i=$((i+1))
                                    if [ "$i" -gt "${ATTEMPTS:-1}" ]; then
                                      echo "still matching \"$RETRY_ON\" after $ATTEMPTS attempt(s); giving up"
                                      exit 1
                                    fi
                                    echo "matched \"$RETRY_ON\"; retrying in ${RETRY_WAIT}s (attempt $i/$ATTEMPTS)"
                                    sleep "$RETRY_WAIT"
                                  done
                                  # Only when asked for: with RESULT_EXPR empty the executor
                                  # writes the whole body, which can be multi-line and would
                                  # corrupt the result capture.
                                  if [ -n "${RESULT_EXPR:-}" ]; then
                                    echo "ARGO_RESULT_OUTPUT=$(cat /tmp/result 2>/dev/null || true)"
                                  fi
                              env:
                                - { name: ADDRESS, value: "{{inputs.parameters.address}}" }
                                - { name: METHOD, value: "{{inputs.parameters.method}}" }
                                - name: PAYLOAD
                                  value: |-
                                    {{inputs.parameters.payload}}
                                - name: SUCCESS_EXPR
                                  value: |-
                                    {{inputs.parameters.success-expr}}
                                - name: FAILURE_EXPR
                                  value: |-
                                    {{inputs.parameters.failure-expr}}
                                - name: ASSERT
                                  value: |-
                                    {{inputs.parameters.assert}}
                                - name: ASSERT_MESSAGE
                                  value: |-
                                    {{inputs.parameters.assert-message}}
                                - name: RESULT_EXPR
                                  value: |-
                                    {{inputs.parameters.result-expr}}
                                - { name: RESULT_PATH, value: /tmp/result }
                                - name: POD_SELECTOR
                                  value: |-
                                    {{inputs.parameters.address-from-pod}}
                                - { name: ADDRESS_PORT, value: "{{inputs.parameters.address-port}}" }
                                - name: RETRY_ON
                                  value: |-
                                    {{inputs.parameters.retry-on}}
                                - { name: ATTEMPTS, value: "{{inputs.parameters.attempts}}" }
                                - { name: RETRY_WAIT, value: "{{inputs.parameters.retry-wait}}" }
                                - { name: IAM, value: "{{inputs.parameters.use-iam}}" }
                                # Short-lived, submitter-supplied bearer token (not a Secret).
                                - { name: TOKEN, value: "{{inputs.parameters.token}}" }
                                - name: EXTRA_HEADERS
                                  value: |-
                                    {{inputs.parameters.extra-headers}}
                                - { name: PLAINTEXT, value: "{{inputs.parameters.plaintext}}" }
                                - { name: WAIT_FOR_READY, value: "{{inputs.parameters.wait-for-ready}}" }
                                - { name: TIMEOUT, value: "{{=int(duration(inputs.parameters['timeout']).Seconds())}}" }
                                - { name: POLL_INTERVAL, value: "{{=int(duration(inputs.parameters['poll-interval']).Seconds())}}" }
                                - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }
