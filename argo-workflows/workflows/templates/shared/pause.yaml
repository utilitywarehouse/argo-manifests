# =============================================================================
# pause — a human checkpoint any workflow can drop between two steps
# =============================================================================
# Argo suspends the workflow until someone resumes it from the UI or CLI. What
# makes this more than a bare `suspend: {}` is that the node says what it is
# waiting for:
#
#   message   REQUIRED. What to verify before resuming, in the caller's words.
#             Shows on the node's INPUTS panel, so the operator reads it on the
#             node they are about to resume rather than in the template source.
#   approve   Defaulted to yes, supplied at resume. The resume dialog renders its
#             description and its yes/no enum, so a decision is recorded rather
#             than a button clicked, and it lands in the node's outputs for the
#             archive. Callers do not pass it.
#
# ⚠️ `approve` is RECORDED, NOT ENFORCED — nothing reads it, so answering "no"
# still lets the workflow continue. To make "no" actually stop the next step:
#
#   when: "{{steps.<pause-step>.outputs.parameters.approve}} == yes"
#
# GATING THE PAUSE ITSELF is this template's business, not the caller's: pass
# `active`, never a `when:`. It defaults to true, and `attended` fires it as
# well, so a workflow hands its own validation-mode straight through without
# translating it. Anything else skips, and the outputs below fall back to their defaults.
#
# The suspend sits in its own template so the gate can skip it, which nests a
# node under each pause: resume the inner `suspend`, not the `pause` parent.
#
# Reference-only: consumed via templateRef.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-pause
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI. Suspend until a human resumes, showing what to
      verify and prompting for a yes/no decision. Skipped when the caller's
      `active` input is not true. Consumed via templateRef.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: qe
    workflows.argoproj.io/invocation: reference-only
spec:
  templates:
    - name: pause
      inputs:
        parameters:
          - name: message
            description: What to verify before resuming this workflow
          - name: active
            description: >-
              The caller's own condition for this checkpoint. true or attended
              fires it; anything else skips it.
            default: "true"
      steps:
        - - name: suspend
            template: suspend
            # `attended` is accepted alongside `true` so a workflow can hand its
            # validation-mode straight through without translating it.
            when: >-
              {{inputs.parameters.active}} == true ||
              {{inputs.parameters.active}} == attended
            arguments:
              parameters:
                - { name: message, value: "{{inputs.parameters.message}}" }
      outputs:
        parameters:
          - name: message
            valueFrom:
              parameter: "{{steps.suspend.outputs.parameters.message}}"
              default: "{{inputs.parameters.message}}"
          - name: approve
            valueFrom:
              parameter: "{{steps.suspend.outputs.parameters.approve}}"
              default: "yes"

    - name: suspend
      inputs:
        parameters:
          - name: message
            description: What to verify before resuming this workflow
          - name: approve
            description: >-
              Resume only once the checks in this node's `message` input pass.
              Pick no to record that they did not.
            default: "yes"
            enum: ["yes", "no"]
      suspend: {}
      outputs:
        parameters:
          - name: message
            valueFrom:
              supplied: {}
            default: "{{inputs.parameters.message}}"
          - name: approve
            valueFrom:
              supplied: {}
            default: "yes"
            enum: ["yes", "no"]
