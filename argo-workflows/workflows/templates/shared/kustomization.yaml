apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - executor-remote-namespace.yaml
  - data-orchestrator-runner.yaml
  - healthcheck-namespace.yaml

# ---------------------------------------------------------------------------
# Image pins for the shared/ package templates. Each package (shared, billing,
# energy, account, test) owns a <pkg>-image-versions ConfigMap + its own
# replacements, co-located with the templates it pins — kustomize cannot share a
# generated ConfigMap across sibling packages, so there is no single global list.
#
# These are Argo template-INPUT params (never spec.arguments, so not UI-settable)
# and can't be pinned by kustomize's `images:` transformer — they are Argo
# `{{...}}` expressions inside a Job heredoc, not resolvable image fields (the
# lone exception, exec-kube, IS a real container.image and is replaced as such).
#
# Bump a tag here; per-environment overrides go in the environment overlay.
# ---------------------------------------------------------------------------
configMapGenerator:
  - name: shared-image-versions
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
    literals:
      - data-orchestrator=registry.uw.systems/dev-enablement/data-orchestrator:5c9063aa3d12e0482d7cd37c368950e750377868
      - data-adapter=registry.uw.systems/dev-enablement/data-adapter:5c9063aa3d12e0482d7cd37c368950e750377868
      - call-grpc=registry.uw.systems/dev-enablement/call-grpc:35ab89428d1770946eb2c0e766cfd2790dbc0495
      - exec-kube=registry.uw.systems/dev-enablement/exec-kube:chore-redesign-wkflw-data-prop
generatorOptions:
  disableNameSuffixHash: true

# Replacements pin the images used by THIS package's templates only. kustomize
# cannot share a generated ConfigMap across sibling packages, so each package
# owns its own pins + replacements (query-pg is likewise pinned in energy/ and
# account/). Uniform target: `spec.templates.*.inputs.parameters.[name=<x>-image].value`.
replacements:
  - source:
      {
        kind: ConfigMap,
        name: shared-image-versions,
        fieldPath: data.data-orchestrator,
      }
    targets:
      - select: { kind: WorkflowTemplate, name: step-data-orchestrator-runner }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=orchestrator-image].value
  - source:
      {
        kind: ConfigMap,
        name: shared-image-versions,
        fieldPath: data.data-adapter,
      }
    targets:
      - select: { kind: WorkflowTemplate, name: step-data-orchestrator-runner }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=adapter-image].value
  - source:
      { kind: ConfigMap, name: shared-image-versions, fieldPath: data.call-grpc }
    targets:
      - select: { kind: WorkflowTemplate, name: step-data-orchestrator-runner }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=call-grpc-image].value
  - source:
      { kind: ConfigMap, name: shared-image-versions, fieldPath: data.exec-kube }
    targets:
      - select: { kind: WorkflowTemplate, name: step-executor-remote-namespace }
        fieldPaths:
          - spec.templates.*.container.image
      - select: { kind: WorkflowTemplate, name: step-healthcheck-namespace }
        fieldPaths:
          - spec.templates.*.container.image
