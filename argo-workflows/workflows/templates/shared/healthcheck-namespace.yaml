# =============================================================================
# step-healthcheck-namespace — fail unless every (selected) pod in a namespace is
# healthy. A reusable gate to decide when it is safe to run workflows/steps
# against a namespace.
# =============================================================================
# Runs exec-kube in `healthcheck` mode. exec-kube connects to the TARGET cluster
# via cluster-name (token from job-executor-tokens/<cluster>-<namespace> + CA from
# cluster-ca-certs) — the same connection it uses to dispatch remote Jobs — and
# lists pods directly. No remote Job is dispatched and no kubectl binary is
# involved; the health rules run natively in the executor.
#
# A pod is UNHEALTHY when:
#   - phase is not Running/Succeeded (Pending, Failed, Unknown — catches
#     ImagePullBackOff/unschedulable/etc.), OR
#   - it is Running but any container reports ready=false (catches
#     CrashLoopBackOff and other waiting/terminated container states).
# Succeeded pods (completed Job pods) are treated as healthy and ignored.
#
# By default pods OWNED BY A Job/CronJob are skipped entirely — one-shot Job
# pods (backups, *-db-init, *-create-index, es-curator, ...) legitimately end
# up Failed/Succeeded and are noise for a service-health gate. Set
# include-job-pods=true to gate on them too.
#
# Selection (precedence): label-selector > services > whole namespace.
#   - label-selector : raw selector, e.g. "app in (billing-api,billing-worker)"
#                      or "app.kubernetes.io/part-of=billing"
#   - services       : comma list, e.g. "billing-api,billing-worker" — expanded
#                      to "<service-label-key> in (...)"
#   - (both empty)   : every pod in the namespace
#
# exec-kube authenticates to the target cluster as argo-workflow-job-executor,
# which already has pods get/list/watch there.
#
# Reference-only: consumed via templateRef (also submittable standalone for a
# manual check).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-healthcheck-namespace
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Fails unless every selected pod in the target namespace is healthy
      (no CrashLoopBackOff / not-ready / pending). Consumed via templateRef.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: qe
    workflows.argoproj.io/invocation: standalone
spec:
  entrypoint: check
  arguments:
    parameters:
      - { name: cluster-name }
      - { name: target-namespace }
      # selection — precedence label-selector > services > whole namespace
      - { name: label-selector, value: "" }
      - { name: services, value: "" }
      - { name: service-label-key, value: app }
      - { name: include-job-pods, value: "false" }
  templates:
    - name: check
      inputs:
        parameters:
          - { name: cluster-name }
          - { name: target-namespace }
          - { name: label-selector, value: "" }
          - { name: services, value: "" }
          - { name: service-label-key, value: app }
          - { name: include-job-pods, value: "false" }
          - { name: log-level, value: info }
          - { name: timeout, value: 3m }
      outputs:
        artifacts:
          - name: result
            path: /tmp/result.txt
            archive:
              none: {}
          - name: logs
            path: /tmp/logs.txt
            archive:
              none: {}
        parameters:
          - name: result
            valueFrom:
              path: /tmp/result.txt
      volumes:
        - name: job-executor-tokens
          secret:
            secretName: job-executor-tokens
        - name: cluster-ca-certs
          configMap:
            name: cluster-ca-certs
      container:
        image: registry.uw.systems/dev-enablement/exec-kube:main
        args: [healthcheck]
        env:
          - name: CLUSTER_NAME
            value: "{{inputs.parameters.cluster-name}}"
          # Resolved from the per-environment cluster-servers ConfigMap by cluster-name;
          # Argo substitutes {{inputs.parameters.cluster-name}} into the key before submit.
          - name: CLUSTER_SERVER
            valueFrom:
              configMapKeyRef:
                name: cluster-servers
                key: "{{inputs.parameters.cluster-name}}"
          - name: NAMESPACE
            value: "{{inputs.parameters.target-namespace}}"
          - name: LABEL_SELECTOR
            value: "{{inputs.parameters.label-selector}}"
          - name: SERVICES
            value: "{{inputs.parameters.services}}"
          - name: SERVICE_LABEL_KEY
            value: "{{inputs.parameters.service-label-key}}"
          - name: INCLUDE_JOB_PODS
            value: "{{inputs.parameters.include-job-pods}}"
          - name: LOG_LEVEL
            value: "{{inputs.parameters.log-level}}"
          - name: TIMEOUT
            value: "{{inputs.parameters.timeout}}"
          - name: TOKENS_PATH
            value: /secrets/tokens
          - name: CERTS_PATH
            value: /certs
          - name: RESULT_PATH
            value: /tmp/result.txt
          - name: LOGS_PATH
            value: /tmp/logs.txt
        volumeMounts:
          - name: job-executor-tokens
            mountPath: /secrets/tokens
          - name: cluster-ca-certs
            mountPath: /certs
