apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - shared/
  - billing/
  - energy/
  - account/
  - finance/
  - ledgers/
  - test/

# Image tags are pinned per package: each subdirectory (shared/, billing/,
# energy/, account/, finance/, ledgers/, test/) owns a <pkg>-image-versions
# ConfigMap and replaces the images used by its own templates. Nothing to
# replace at this level.
