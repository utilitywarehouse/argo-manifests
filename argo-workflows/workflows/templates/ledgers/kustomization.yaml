apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ledger-snapshot.yaml

# ---------------------------------------------------------------------------
# Image pins for the ledgers/ package templates. query-pg is a dev-enablement
# executor used by energy/, account/, billing/ and now here; since kustomize
# can't share a generated ConfigMap across sibling packages, it is pinned in
# each (keep them in sync). See shared/kustomization.yaml for the per-package
# rationale.
# ---------------------------------------------------------------------------
configMapGenerator:
  - name: ledgers-image-versions
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
    literals:
      - query-pg=registry.uw.systems/dev-enablement/query-pg:80b1439b0c21d5ae40fc7c600a89f142fe2274d9
generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      {
        kind: ConfigMap,
        name: ledgers-image-versions,
        fieldPath: data.query-pg,
      }
    targets:
      - select: { kind: WorkflowTemplate, name: step-ledgers-ledger-snapshot }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=query-pg-image].value
