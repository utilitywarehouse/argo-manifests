# ledger-snapshot — dump the accounts' ledgers, and judge them. `phase` names the
# remote Job, which must differ per dispatch.
#
# Seven tables, one UNION ALL. Each row is {_table, account_id, bill_entry, row},
# `row` being the source row as jsonb — so a table gaining a column changes
# nothing here. account_id is a top-level column too: ORDER BY needs a real one.
#
# ⚠️ ::text on the uuids. pgx returns a bare `uuid` as [16]byte, which the ndjson
# writer prints as [146,37,46,…]. to_jsonb() converts server-side, so only the
# top-level column needs the cast.
#
# `bill_entry` is the point of the run: a ledger_entry of type `entry-type`
# ('bill' after a commit, 'payment' after a collection) created at or after
# `since`, narrowed to one invoice when invoice-number is given. The other
# entries a commit writes (budget_plan_payment, budget_plan_charges_and_usage)
# land alongside it and do NOT satisfy it.
#
# EVERY account, not the first. Both predicates count accounts against the
# `_account` rows — one per account asked for, from the ids CTE rather than the
# tables, so an account with no ledger at all is counted rather than absent.
#
# THIS STEP FAILS. Every account must hold a ledger, asserted on both phases, and
# after commit a bill entry, waited for. A bill that never reaches the ledger is
# a failed bill run, not a finding.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-ledgers-ledger-snapshot
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Read-only. Dumps the accounts' ledgers, balances, entries, service splits
      and any rejections from ledgers-rds. Fails unless every account has a
      ledger, and after commit a 'bill' entry created since `since`.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: standalone
    data.uw.systems/system: ledgers
    data.uw.systems/capability: bill-run
spec:
  entrypoint: snapshot
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: account-ids } # account-platform UUID(s), comma-joined
      - name: phase
        value: "manual"
        enum: ["manual", "before", "after"]
      - { name: wait-for-entry, value: 0s } # wait this long for an entry newer than `since`, then dump regardless
      - { name: since, value: "1970-01-01T00:00:00Z" }
      - { name: invoice-number, value: "" } # source_reference of the bill entry; empty => any
      - { name: cluster-name, value: dev-merit }
      - { name: target-namespace, value: ledgers }

  templates:
    - name: snapshot
      inputs:
        parameters:
          - { name: account-ids }
          - { name: phase, value: manual }
          - { name: wait-for-entry, value: 0s }
          - { name: since, value: "1970-01-01T00:00:00Z" }
          - { name: entry-type, value: bill } # the ledger_entry type to wait for: bill after a commit, payment after a collection
          - { name: invoice-number, value: "" } # narrows the entry to one invoice; empty => any
          # One Secret holds the whole DSN; its password makes query-pg skip
          # RDS IAM.
          - { name: dsn-secret, value: rds-readonly }
          - { name: dsn-key, value: dsn }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: ledgers }
          # Named so the conditionals below stay legible.
          - name: ledger-expr # every account has a ledger — asserted pre-commit
            value: "len(uniq(map(filter(rows, ._table == 'ledger'), .account_id))) == len(filter(rows, ._table == '_account'))"
          - name: bill-expr # every account has its `entry-type` entry — waited for post-commit
            value: "len(uniq(map(filter(rows, .bill_entry), .account_id))) == len(filter(rows, ._table == '_account'))"
          - { name: poll-interval, value: "20" }
          - { name: heartbeat, value: "60" }
          - { name: log-level, value: info }
          # The Job's deadline is the wait plus this buffer.
          - { name: job-buffer, value: 5m }
          - { name: job-ttl, value: 24h }
      steps:
        - - name: ledgers
            templateRef: { name: step-query, template: pg }
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - {
                    name: job-name,
                    value: "ledger-snapshot-{{inputs.parameters.phase}}",
                  }
                - {
                    name: dsn-secret,
                    value: "{{inputs.parameters.dsn-secret}}",
                  }
                - { name: dsn-key, value: "{{inputs.parameters.dsn-key}}" }
                # Only the un-polled phase asserts: the driver skips --assert in
                # poll mode, where the bill entry implies a ledger anyway.
                - name: assert
                  value: "{{=inputs.parameters['wait-for-entry'] == '0s' ? inputs.parameters['ledger-expr'] : ''}}"
                - name: assert-message
                  value: >-
                    the ledger does not hold what this run requires: every
                    account needs a ledger, and a
                    '{{inputs.parameters.entry-type}}' entry created since
                    `since`. {rowCount} rows dumped — read the _account rows
                    with no ledger or no such entry beside them.
                - { name: format, value: ndjson }
                - { name: output, value: /tmp/snap.ndjson }
                # The dump is the result, emitted once after the poll settles.
                - { name: result-expr, value: "rows" }
                # Only a non-zero wait polls; a zero timeout would expire before
                # the first query, so both follow wait-for-entry. A wait that runs
                # out fails: the bill never reached the ledger.
                - name: success-expr
                  value: "{{=inputs.parameters['wait-for-entry'] == '0s' ? '' : inputs.parameters['bill-expr']}}"
                - {
                    name: poll-interval,
                    value: "{{inputs.parameters.poll-interval}}",
                  }
                - { name: heartbeat, value: "{{inputs.parameters.heartbeat}}" }
                - name: timeout
                  value: "{{=inputs.parameters['wait-for-entry'] == '0s' ? '5m' : inputs.parameters['wait-for-entry']}}"
                - name: job-active-deadline
                  value: "{{=string(duration(inputs.parameters['wait-for-entry'] == '0s' ? '5m' : inputs.parameters['wait-for-entry']) + duration(inputs.parameters['job-buffer']))}}"
                - { name: job-ttl, value: "{{inputs.parameters.job-ttl}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - name: query
                  value: >-
                    WITH ids AS (SELECT btrim(x)::uuid AS account_id FROM
                    unnest(string_to_array('{{inputs.parameters.account-ids}}', ',')) AS t(x)),
                    since AS (SELECT '{{inputs.parameters.since}}'::timestamptz AS ts)
                    SELECT '_account' AS _table, i.account_id::text AS account_id,
                    false AS bill_entry, to_jsonb(i) AS row
                    FROM ids i
                    UNION ALL
                    SELECT 'ledger', l.account_id::text,
                    false, to_jsonb(l)
                    FROM public.ledger l JOIN ids i ON i.account_id = l.account_id
                    UNION ALL
                    SELECT 'ledger_balance', l.account_id::text, false, to_jsonb(lb)
                    FROM public.ledger_balance lb
                    JOIN public.ledger l ON l.id = lb.ledger_id
                    JOIN ids i ON i.account_id = l.account_id
                    UNION ALL
                    SELECT 'ledger_entry', l.account_id::text,
                    le.type = '{{inputs.parameters.entry-type}}' AND le.created_at >= (SELECT ts FROM since)
                    AND ('{{inputs.parameters.invoice-number}}' = ''
                    OR le.source_reference = '{{inputs.parameters.invoice-number}}'),
                    to_jsonb(le)
                    FROM public.ledger_entry le
                    JOIN public.ledger l ON l.id = le.ledger_id
                    JOIN ids i ON i.account_id = l.account_id
                    UNION ALL
                    SELECT 'service_split_ledger', l.account_id::text, false, to_jsonb(sl)
                    FROM public.service_split_ledger sl
                    JOIN public.ledger_entry le ON le.id = sl.ledger_entry_id
                    JOIN public.ledger l ON l.id = le.ledger_id
                    JOIN ids i ON i.account_id = l.account_id
                    UNION ALL
                    SELECT 'rejected_entry', re.account_id::text, false, to_jsonb(re)
                    FROM public.rejected_entry re JOIN ids i ON i.account_id = re.account_id
                    UNION ALL
                    SELECT 'ledger_creation_failure', f.account_id::text, false, to_jsonb(f)
                    FROM public.ledger_creation_failure f JOIN ids i ON i.account_id = f.account_id
                    ORDER BY 2, 1
