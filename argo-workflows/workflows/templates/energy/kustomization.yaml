apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - assert-bills-processed.yaml
  - reprocess-bills.yaml
  - resolve-energy-service-identifiers.yaml

# ---------------------------------------------------------------------------
# One pin, for reprocess-bills — the only template here still dispatching its own
# Job. The rest query through step-query, which owns the pin in shared/. Keep
# this tag in step with shared/: kustomize cannot share a generated ConfigMap
# across sibling packages.
# ---------------------------------------------------------------------------
configMapGenerator:
  - name: energy-image-versions
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
    literals:
      - query-pg=registry.uw.systems/dev-enablement/query-pg:main
generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      { kind: ConfigMap, name: energy-image-versions, fieldPath: data.query-pg }
    targets:
      # The wildcard passes over the templates with no such param rather than
      # failing on them.
      - select: { kind: WorkflowTemplate, name: step-energy-reprocess-bills }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=query-pg-image].value
