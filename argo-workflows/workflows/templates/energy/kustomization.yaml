apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - assert-bills-processed.yaml
  - reprocess-bills.yaml
  - resolve-energy-service-identifiers.yaml

# ---------------------------------------------------------------------------
# Image pins for the energy/ package templates. query-pg is a dev-enablement
# executor used by both energy/ and account/; since kustomize can't share a
# generated ConfigMap across sibling packages, it is pinned in each (keep the
# two in sync). See shared/kustomization.yaml for the per-package rationale.
# ---------------------------------------------------------------------------
configMapGenerator:
  - name: energy-image-versions
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
    literals:
      - query-pg=registry.uw.systems/dev-enablement/query-pg:35583c85d23d9fcbefc816f52c0ba92cef39ad6a
      - call-grpc=registry.uw.systems/dev-enablement/call-grpc:main
generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      { kind: ConfigMap, name: energy-image-versions, fieldPath: data.query-pg }
    targets:
      - select:
          { kind: WorkflowTemplate, name: step-energy-assert-bills-processed }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=query-pg-image].value
      - select:
          {
            kind: WorkflowTemplate,
            name: step-energy-resolve-service-identifiers,
          }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=query-pg-image].value
      # Only two of this one's four templates query; the wildcard passes over the
      # composite and the gRPC trigger rather than failing on them.
      - select: { kind: WorkflowTemplate, name: step-energy-reprocess-bills }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=query-pg-image].value
  - source:
      {
        kind: ConfigMap,
        name: energy-image-versions,
        fieldPath: data.call-grpc,
      }
    targets:
      - select: { kind: WorkflowTemplate, name: step-energy-reprocess-bills }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=call-grpc-image].value
