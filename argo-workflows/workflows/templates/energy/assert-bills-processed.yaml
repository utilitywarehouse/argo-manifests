# =============================================================================
# assert-bills-processed — the energy data for these bills, in billing_adapter_db
# =============================================================================
# Two gates over public.billing_period_accounts:
#
#   check-adapter-blobs  the account set, before anything is re-sent. Every
#                        period, so damage outside this run still shows.
#   assert               this run's own data, after the re-send. Scoped.
#
# SCOPE IS A PRECEDENCE — first one set wins, not a combination, not a range. One
# SQL CASE, matching reprocess-bills' exactly: judging rows a re-send never
# touched fails a run whose own bill is fine.
#
#   gentrack-bill-numbers  no such column — the number sits inside file_name
#                          (BillJ40000010621_1.json), hence `position(num in
#                          file_name) > 0`, not equality and not LIKE (`_` is a
#                          wildcard)
#   bill-period            one month of the BLOB's bill_period_from, a month
#                          behind the bill-run month
#   neither                the latest bill period per account
#
# `assert` reads only processed_at, so it cannot see a reset that deleted
# billing's energy rows and left these blobs processed. step-billing-account-state
# checks that, against the destination.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-energy-assert-bills-processed
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      `check-adapter-blobs` fails an account with no blobs, blobs the adapter
      cannot process, or periods left unprocessed outside the run's scope.
      `assert` fails unless every row in scope is processed. Scope is a
      precedence: named gentrack bill numbers, else one bill period, else the
      latest period per account.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: energy
    workflows.argoproj.io/invocation: standalone
    data.uw.systems/system: energy-billing
spec:
  entrypoint: assert
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: external-account-number } # gentrack account number(s), comma-separated (e.g. J20000032681,J20000041234)
      - { name: gentrack-bill-numbers, value: "" } # gentrack bill number(s), comma-separated (e.g. J40000010621); wins over bill-period
      - { name: bill-period, value: "" } # YYYY-MM of the BLOB's bill_period_from; empty => the latest period per account
      - { name: cluster-name } # which cluster the energy RDS is reachable from
      - { name: target-namespace }
  templates:
    # assert — the verdict. Fails unless something is in scope and all of it is
    # processed and clean.
    - name: assert
      inputs:
        parameters:
          - { name: external-account-number }
          - { name: gentrack-bill-numbers, value: "" }
          - { name: bill-period, value: "" }
          - {
              name: connection-string,
              value: "postgres://billing_adapter_role@energy-rds.c4jv4shioc7c.eu-west-1.rds.amazonaws.com:5432/billing_adapter_db?sslmode=require",
            }
          - { name: db-type, value: postgres }
          - { name: cluster-name }
          - { name: target-namespace }
          - { name: runner-sa, value: billing-adapter-rds-user }
          - { name: log-level, value: info }
          - { name: timeout, value: 5m }
          - { name: job-active-deadline, value: 7m }
          - { name: job-ttl, value: 24h }
      steps:
        - - name: energy-billing
            templateRef: { name: step-query, template: pg }
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: job-name, value: assert-bills-processed }
                - {
                    name: connection-string,
                    value: "{{inputs.parameters.connection-string}}",
                  }
                - { name: db-type, value: "{{inputs.parameters.db-type}}" }
                - { name: vault-sidecar, value: "true" }
                - { name: runner-sa, value: "{{inputs.parameters.runner-sa}}" }
                - { name: format, value: csv }
                - { name: output, value: /tmp/out.csv }
                # Named columns: the predicate reads the row by field, so nothing
                # depends on the order they come back in.
                - name: query
                  value: >-
                    SELECT count(*) AS total,
                    count(*) FILTER (WHERE processed_at IS NULL) AS unprocessed,
                    count(*) FILTER (WHERE nullif(btrim(validation_issues), '') IS NOT NULL) AS invalid,
                    count(*) FILTER (WHERE nullif(btrim(processing_issues), '') IS NOT NULL) AS failed
                    FROM public.billing_period_accounts
                    WHERE external_account_number IN (SELECT btrim(x) FROM
                    unnest(string_to_array('{{inputs.parameters.external-account-number}}', ',')) AS t(x))
                    AND CASE
                    WHEN '{{inputs.parameters.gentrack-bill-numbers}}' <> '' THEN EXISTS
                    (SELECT 1 FROM unnest(string_to_array('{{inputs.parameters.gentrack-bill-numbers}}', ','))
                    AS b(num) WHERE position(btrim(b.num) in file_name) > 0)
                    WHEN '{{inputs.parameters.bill-period}}' <> '' THEN
                    bill_period_from >= to_date('{{inputs.parameters.bill-period}}', 'YYYY-MM')
                    AND bill_period_from < (to_date('{{inputs.parameters.bill-period}}', 'YYYY-MM') + interval '1 month')
                    ELSE (external_account_number, bill_period_from) IN
                    (SELECT external_account_number, max(bill_period_from)
                    FROM public.billing_period_accounts
                    WHERE external_account_number IN (SELECT btrim(x) FROM
                    unnest(string_to_array('{{inputs.parameters.external-account-number}}', ',')) AS t(x))
                    GROUP BY external_account_number)
                    END
                # The terminal state a re-send leaves. Processed but carrying
                # issues is not a success.
                - name: assert
                  value: >-
                    row.total > 0 && row.unprocessed == 0 &&
                    row.invalid == 0 && row.failed == 0
                # Both ways it fails: nothing in scope, or something in scope not
                # processed.
                - name: assert-message
                  value: "{row.total == 0 ? 'nothing in scope for [{{inputs.parameters.external-account-number}}] — no bills to process' : 'the re-send did not settle clean for [{{inputs.parameters.external-account-number}}]: ' + string(row.unprocessed) + ' of ' + string(row.total) + ' unprocessed, ' + string(row.invalid) + ' with validation_issues, ' + string(row.failed) + ' with processing_issues'}"
                - { name: result-expr, value: "'processed'" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - {
                    name: job-active-deadline,
                    value: "{{inputs.parameters.job-active-deadline}}",
                  }
                - { name: job-ttl, value: "{{inputs.parameters.job-ttl}}" }

    # check-adapter-blobs — the gate on the account set. Every period the account
    # has, each row flagged in_scope. Runs before reprocess-bills clears
    # processed_at.
    #
    # Unprocessed IN scope is not damage: a first bill has a blob waiting, and a
    # re-bill is about to clear processed_at. `assert` judges that, afterwards.
    # No rows at all is damage — nothing has ever been ingested.
    - name: check-adapter-blobs
      inputs:
        parameters:
          - { name: external-account-number }
          - { name: gentrack-bill-numbers, value: "" }
          - { name: bill-period, value: "" }
          - {
              name: connection-string,
              value: "postgres://billing_adapter_role@energy-rds.c4jv4shioc7c.eu-west-1.rds.amazonaws.com:5432/billing_adapter_db?sslmode=require",
            }
          - { name: db-type, value: postgres }
          - { name: cluster-name }
          - { name: target-namespace }
          - { name: runner-sa, value: billing-adapter-rds-user }
          - { name: log-level, value: info }
          - { name: timeout, value: 5m }
          - { name: job-active-deadline, value: 7m }
          - { name: job-ttl, value: 24h }
      steps:
        - - name: energy-billing
            templateRef: { name: step-query, template: pg }
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: job-name, value: check-adapter-blobs }
                - {
                    name: connection-string,
                    value: "{{inputs.parameters.connection-string}}",
                  }
                - { name: db-type, value: "{{inputs.parameters.db-type}}" }
                - { name: vault-sidecar, value: "true" }
                - { name: runner-sa, value: "{{inputs.parameters.runner-sa}}" }
                - { name: format, value: ndjson }
                - { name: output, value: /tmp/bpa.ndjson }
                - { name: result-expr, value: "rows" }
                - name: query
                  value: >-
                    SELECT bpa.*, (CASE
                    WHEN '{{inputs.parameters.gentrack-bill-numbers}}' <> '' THEN EXISTS
                    (SELECT 1 FROM unnest(string_to_array('{{inputs.parameters.gentrack-bill-numbers}}', ','))
                    AS b(num) WHERE position(btrim(b.num) in file_name) > 0)
                    WHEN '{{inputs.parameters.bill-period}}' <> '' THEN
                    bill_period_from >= to_date('{{inputs.parameters.bill-period}}', 'YYYY-MM')
                    AND bill_period_from < (to_date('{{inputs.parameters.bill-period}}', 'YYYY-MM') + interval '1 month')
                    ELSE (external_account_number, bill_period_from) IN
                    (SELECT external_account_number, max(bill_period_from)
                    FROM public.billing_period_accounts
                    WHERE external_account_number IN (SELECT btrim(x) FROM
                    unnest(string_to_array('{{inputs.parameters.external-account-number}}', ',')) AS t(x))
                    GROUP BY external_account_number)
                    END) AS in_scope
                    FROM public.billing_period_accounts bpa
                    WHERE external_account_number IN (SELECT btrim(x) FROM
                    unnest(string_to_array('{{inputs.parameters.external-account-number}}', ',')) AS t(x))
                    ORDER BY bill_period_from, external_account_number
                # Out of scope only. An in-scope blob carrying issues is exactly
                # what reprocess-bills clears and re-sends, so failing here would
                # block the repair `assert` then judges.
                - name: assert
                  value: >-
                    any(rows, .in_scope) &&
                    !any(rows, !.in_scope && .processed_at == nil) &&
                    !any(rows, !.in_scope && .validation_issues != nil && .validation_issues != '') &&
                    !any(rows, !.in_scope && .processing_issues != nil && .processing_issues != '')
                - name: assert-message
                  value: "account [{{inputs.parameters.external-account-number}}]: {empty ? 'no billing_period_accounts rows at all — nothing has ever been ingested' : (!any(rows, .in_scope) ? 'nothing in this run scope — the account has blobs, but none for the period being billed' : 'standing damage outside this run scope — ' + string(len(filter(rows, !.in_scope && .processed_at == nil))) + ' unprocessed, ' + string(len(filter(rows, !.in_scope && .validation_issues != nil && .validation_issues != ''))) + ' with validation_issues, ' + string(len(filter(rows, !.in_scope && .processing_issues != nil && .processing_issues != ''))) + ' with processing_issues')}"
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - {
                    name: job-active-deadline,
                    value: "{{inputs.parameters.job-active-deadline}}",
                  }
                - { name: job-ttl, value: "{{inputs.parameters.job-ttl}}" }
