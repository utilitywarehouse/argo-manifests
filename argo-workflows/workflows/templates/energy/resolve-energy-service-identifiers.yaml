# =============================================================================
# step-energy-resolve-service-identifiers — customer account_id → the account's
# energy supplies, from energy-platform `service_snapshot`
# =============================================================================
#   in : account-id  (customer_account_id, uuid; one or comma-separated many)
#   out: identifiers — a JSON ARRAY of supply rows, as both an artifact and a
#        parameter. Row shape:
#          {"supply_type","mpxn","gentrack_account_number","gentrack_account_id",
#           "gentrack_agreement_id","gentrack_customer_id"}
#
# ⚠️ A JSON ARRAY, not ndjson: `result-expr: rows` captures the row set as one
# value. A downstream `select` needs `format: json`; with the default `ndjson` it
# parses nothing and returns empty, silently.
#
# Consumers pick fields with the `select` executor (expr over `rows`) — e.g. the
# distinct gentrack numbers for a fan-out:
#   uniq(map(filter(rows, .gentrack_account_number != nil), .gentrack_account_number))
# account_id is the input, not repeated per row. An account with no matching
# supplies yields an empty result; consumers decide what that means. See
# docs/data-flow.md.
#
# Reference-only: the energy stage of the account pipeline, consumed via
# templateRef by the flow-test-account-select orchestrator.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-energy-resolve-service-identifiers
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI (read-only). customer account_id → the account's
      energy-service supplies from service_snapshot, as a JSON array. Consumed
      via templateRef.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: energy
    workflows.argoproj.io/invocation: reference-only
    data.uw.systems/system: energy-service
spec:
  entrypoint: resolve
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: account-id } # customer_account_id (uuid); one, or comma-separated many (IN (...))
      # Filter to a billing platform; empty selects all platforms.
      - { name: billing-platform, value: ENERGY_BILLING_PLATFORM_GENTRACK }
      # dispatch + connection (CockroachDB cert auth)
      - { name: energy-service-cluster-name, value: dev-merit }
      - { name: energy-service-namespace, value: energy-platform }
      - {
          name: service-connection-string,
          value: "postgres://root@cockroachdb-proxy-moist.energy-platform.svc:26257/services?sslmode=verify-full",
        }
      - { name: service-runner-sa, value: default }
      - { name: ca-secret, value: ca.auth.keys.energy-platform } # → CA_AUTH_KEY
      - { name: ca-auth-key, value: moist.auth.key } # key within ca-secret
      - { name: ca-config, value: ca.config.energy-platform } # CA profile + endpoint
      - { name: ca-profile-key, value: ca.node.profile } # → CA_PROFILE
      - { name: ca-address-key, value: ca.endpoint } # → CA_ADDRESS
      # common
      - { name: image-pull-secret, value: dockerhub-key }
      - { name: log-level, value: info }
      - { name: timeout, value: 3m }
      - { name: job-active-deadline, value: 5m }
      - { name: job-ttl, value: 24h }
      - { name: teardown, value: "true" } # false leaves the remote Job for inspection; job-ttl still GCs it
  templates:
    - name: resolve
      inputs:
        parameters:
          - { name: account-id }
          - { name: billing-platform, value: ENERGY_BILLING_PLATFORM_GENTRACK }
          - { name: energy-service-cluster-name, value: dev-merit }
          - { name: energy-service-namespace, value: energy-platform }
          - {
              name: service-connection-string,
              value: "postgres://root@cockroachdb-proxy-moist.energy-platform.svc:26257/services?sslmode=verify-full",
            }
          - { name: service-runner-sa, value: default }
          - { name: ca-secret, value: ca.auth.keys.energy-platform }
          - { name: ca-auth-key, value: moist.auth.key }
          - { name: ca-config, value: ca.config.energy-platform }
          - { name: ca-profile-key, value: ca.node.profile }
          - { name: ca-address-key, value: ca.endpoint }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: log-level, value: info }
          - { name: timeout, value: 3m }
          - { name: job-active-deadline, value: 5m }
          - { name: job-ttl, value: 24h }
          - { name: teardown, value: "true" }
      outputs:
        # Artifact for a `select` step to mount; the parameter mirror is for the
        # handful-of-supplies case.
        artifacts:
          - name: identifiers
            from: "{{steps.energy-platform.outputs.artifacts.result}}"
        parameters:
          - name: identifiers
            valueFrom:
              parameter: "{{steps.energy-platform.outputs.parameters.result}}"
      steps:
        # No shell: `>-` folds the SQL to one line, and the rows are both the
        # captured result and the artifact a downstream `select` pulls.
        - - name: energy-platform
            templateRef: { name: step-query, template: pg }
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.energy-service-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.energy-service-namespace}}",
                  }
                - { name: job-name, value: resolve-service-identifiers }
                - name: query
                  value: >-
                    SELECT s.supply_type, s.mpxn, s.gentrack_account_number,
                    s.gentrack_account_id, s.gentrack_agreement_id,
                    s.gentrack_customer_id
                    FROM service_snapshot s
                    WHERE s.customer_account_id IN (SELECT unnest(string_to_array('{{inputs.parameters.account-id}}', ',')))
                    AND s.energy_billing_platform = '{{inputs.parameters.billing-platform}}'
                - { name: format, value: ndjson }
                - { name: output, value: /tmp/out.ndjson }
                - { name: result-expr, value: "rows" }
                - { name: db-type, value: cockroachdb }
                - {
                    name: connection-string,
                    value: "{{inputs.parameters.service-connection-string}}",
                  }
                - { name: ca-secret, value: "{{inputs.parameters.ca-secret}}" }
                - {
                    name: ca-auth-key,
                    value: "{{inputs.parameters.ca-auth-key}}",
                  }
                - { name: ca-config, value: "{{inputs.parameters.ca-config}}" }
                - {
                    name: ca-address-key,
                    value: "{{inputs.parameters.ca-address-key}}",
                  }
                - {
                    name: ca-profile-key,
                    value: "{{inputs.parameters.ca-profile-key}}",
                  }
                - {
                    name: runner-sa,
                    value: "{{inputs.parameters.service-runner-sa}}",
                  }
                - {
                    name: image-pull-secret,
                    value: "{{inputs.parameters.image-pull-secret}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - {
                    name: job-active-deadline,
                    value: "{{inputs.parameters.job-active-deadline}}",
                  }
                - { name: job-ttl, value: "{{inputs.parameters.job-ttl}}" }
                - { name: teardown, value: "{{inputs.parameters.teardown}}" }
