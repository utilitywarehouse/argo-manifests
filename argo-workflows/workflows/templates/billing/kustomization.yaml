apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - billing-graphql-call.yaml
  - await-segment-state.yaml
  - produce-fwf.yaml
  - bill-run.yaml
  - bill-account.yaml

# ---------------------------------------------------------------------------
# Image pins for the billing/ package templates. call-http and upload-s3 are
# dev-enablement executors; select is the dev-enablement `select` executor used
# by bill-account to pull the gentrack number; fabricate-migrated-fwf is a
# billing business image — all are used only by billing templates, so all are
# pinned here. See shared/kustomization.yaml for the per-package layout rationale.
# ---------------------------------------------------------------------------
configMapGenerator:
  - name: billing-image-versions
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
    literals:
      - call-http=registry.uw.systems/dev-enablement/call-http:35ab89428d1770946eb2c0e766cfd2790dbc0495
      - fwf=registry.uw.systems/billing/fabricate-migrated-fwf:chore-mono-script-classification
      - upload-s3=registry.uw.systems/dev-enablement/upload-s3:main
      - select=registry.uw.systems/dev-enablement/select:main
generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      {
        kind: ConfigMap,
        name: billing-image-versions,
        fieldPath: data.call-http,
      }
    targets:
      - select: { kind: WorkflowTemplate, name: step-billing-graphql-call }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=call-http-image].value
  - source:
      { kind: ConfigMap, name: billing-image-versions, fieldPath: data.fwf }
    targets:
      - select: { kind: WorkflowTemplate, name: step-billing-produce-fwf }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=fwf-image].value
  - source:
      {
        kind: ConfigMap,
        name: billing-image-versions,
        fieldPath: data.upload-s3,
      }
    targets:
      - select: { kind: WorkflowTemplate, name: step-billing-produce-fwf }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=upload-s3-image].value
  - source:
      { kind: ConfigMap, name: billing-image-versions, fieldPath: data.select }
    targets:
      - select: { kind: WorkflowTemplate, name: step-billing-bill-account }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=select-image].value
