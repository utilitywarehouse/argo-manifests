apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - produce-fwf.yaml
  - bill-run.yaml
  - bill-account.yaml
  - set-invoice-number.yaml
  - set-billing-preferences.yaml
  - reset.yaml
  - account-state.yaml
  - transaction-log-snapshot.yaml
  - check-one-liner.yaml

# ---------------------------------------------------------------------------
# Image pins for the billing/ package templates.
# ---------------------------------------------------------------------------
configMapGenerator:
  - name: billing-image-versions
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
    literals:
      - fwf=registry.uw.systems/billing/fwf:chore-mono-script-classification
      - bill-run=registry.uw.systems/billing/bill-run:chore-mono-script-classification
      - reset=registry.uw.systems/billing/reset:chore-mono-script-classification
      - set-invoice-number=registry.uw.systems/billing/set-invoice-number:chore-mono-script-classification
      - upload-s3=registry.uw.systems/dev-enablement/upload-s3:main
      - select=registry.uw.systems/dev-enablement/select:main
      - query-pg=registry.uw.systems/dev-enablement/query-pg:chore-impl-caller-pattern-on-queriers
generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      { kind: ConfigMap, name: billing-image-versions, fieldPath: data.fwf }
    targets:
      - select: { kind: WorkflowTemplate, name: step-billing-produce-fwf }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=fwf-image].value
  - source:
      {
        kind: ConfigMap,
        name: billing-image-versions,
        fieldPath: data.bill-run,
      }
    targets:
      - select: { kind: WorkflowTemplate, name: step-billing-bill-run }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=bill-run-image].value
  - source:
      { kind: ConfigMap, name: billing-image-versions, fieldPath: data.reset }
    targets:
      - select: { kind: WorkflowTemplate, name: step-billing-reset }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=reset-image].value
  - source:
      {
        kind: ConfigMap,
        name: billing-image-versions,
        fieldPath: data.upload-s3,
      }
    targets:
      - select: { kind: WorkflowTemplate, name: step-billing-produce-fwf }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=upload-s3-image].value
  - source:
      { kind: ConfigMap, name: billing-image-versions, fieldPath: data.select }
    targets:
      - select: { kind: WorkflowTemplate, name: step-billing-bill-account }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=select-image].value
  - source:
      {
        kind: ConfigMap,
        name: billing-image-versions,
        fieldPath: data.query-pg,
      }
    targets:
      - select: { kind: WorkflowTemplate, name: step-billing-account-state }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=query-pg-image].value
  - source:
      {
        kind: ConfigMap,
        name: billing-image-versions,
        fieldPath: data.set-invoice-number,
      }
    targets:
      - select:
          { kind: WorkflowTemplate, name: step-billing-set-invoice-number }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=set-invoice-number-image].value
