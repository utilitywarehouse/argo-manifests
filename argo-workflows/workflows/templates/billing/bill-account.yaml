# =============================================================================
# bill-account - by uw account number
# =============================================================================
# Given a customer account number and a short-lived token, derive everything
# and run the pipeline to completion:
#
#   resolve-account              account-number → account_id
#        │
#   resolve-service-identifiers  account_id → the energy supplies (ndjson)
#        │
#   select-gentrack              → gentrack_account_numbers, comma-joined
#        │
#   check-rebill                 read-only: reset needed? energy data missing?
#        │
#   snapshot                     verify only: what the adapter holds first
#        │
#   reset                        destructive: clear the last bill run
#        │
#   reprocess-bills              re-open the blobs, re-send them, wait
#        │
#   assert-bills-processed       the energy data arrived, else fail
#        │
#   set-invoice-number           plan the number, apply it to both stores
#        │  the plan  'accountNumber<TAB>invoiceNumber<TAB>state'
#   PAUSE                        last boundary before the bucket
#        │
#   produce-fwf                  fabricate → validate → upload
#        │  segment name  (minted by the fabricate tool)
#   PAUSE                        uploaded, not registered — no segment yet
#        │
#   register                     POST the file to the s3-uploader
#        │
#   PAUSE                        segment exists, nothing billed yet
#        │
#   bill-run                     Create → Bill → Commit → Export → Fulfil
#                                  ├─ either side of Commit: the ledger and
#                                  │  BigQuery's committed transaction log
#                                  └─ after Export: the finance one-liner file
#
# VERIFY. Two kinds of run share this pipeline: one that just produces a bill,
# and one that produces a bill to watch what the other systems do with it.
# `verify` is which, and it is false by default — the bill is identical either
# way, so seven extra remote Jobs and a wait on the ledger are a choice.
#
# On, it snapshots the adapter's blobs before anything is re-sent, then (inside
# bill-run) the ledger and BigQuery's transaction log either side of Commit and
# the finance one-liner export after it. Every one is a snapshot, not a check:
# none can fail on what it finds, so leaving verify on cannot turn a run red over
# the bill. Billing's own energy rows need no verify gate — check-rebill logs them
# on every run.
#
# There is no "this account should be untouched" mode. check-rebill knows what
# billing holds, but that is a fact about billing-rds and the adapter's blobs are
# another store it does not imply — a blob exists without a bill ever having been
# produced.
#
# Pauses. All four are step-pause. The three above are unconditional — they
# suspend on dry runs too, so a rehearsal walks the same gates as a real bill.
# The fourth is bill-run's own, before the irreversible Commit, gated on
# validation-mode.
#
# The gentrack numbers scope reprocess-bills and the assert. produce-fwf,
# register and bill-run key on the submitted UW account number: one account
# maps to several gentrack numbers, and the FWF and its segment are per UW
# account.
#
# Rebill. Two decisions, taken at check-rebill from the account's own state:
#
#   committed bill for the period?  energy rows for it?  reset  reprocess
#   no                              yes                  no     no
#   no                              no                   no     YES
#   yes                             either               YES    YES
#
# Only a committed bill number earns a reset: it can be neither reused nor
# deleted, and reset is destructive and NOT period-aware, so it deletes every
# bill the account has. Reprocess only re-sends, so it also runs when billing
# holds no energy data for the period — which is what a reset leaves behind (the
# energy rows deleted, the blobs still marked processed, so nothing re-sends
# them) and what a half-finished earlier run leaves behind. Nothing else catches
# it: assert-bills-processed reads processed_at, in another database, which a
# reset never clears.
#
#   auto (default)  apply the table
#   force           run both regardless
#   off             fail at check-rebill if either is due — a read-only preflight
#
# gentrack-bill-numbers is scope, never a trigger: it narrows which blobs a
# re-send re-opens, and never decides whether one happens.
#
# Periods. bill-period is the bill-run month M; the bill covers [M-1, M),
# because the composition engine subtracts a month from the bill-run date.
# check-rebill resolves both from that one input — M for produce-fwf, M-1 for
# the bill_number lookup, the blobs to re-send and the assert — so an empty
# bill-period cannot resolve to one month in one step and another elsewhere.
#
# The invoice number is produced before produce-fwf consumes it. dry-run gates
# its two writes exactly as it gates the upload, register and bill-run.
#
# Reference-only: wrapped by the flow-billing-bill-account.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-billing-bill-account
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI (use the flow-billing-bill-account artefact). Bill
      one account from its account number: resolve → assert → produce-fwf →
      register → bill-run, with a dry-run that stops after fabricate.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: reference-only
    data.uw.systems/system: billing
    data.uw.systems/capability: bill-run
spec:
  entrypoint: main
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: account-numbers } # UW customer account number(s), comma-separated; the same logic bills one or many
      - { name: token, value: "" } # short-lived bearer token supplied by the submitter
      - { name: validation-mode, value: attended } # attended pauses before Commit
      - { name: dry-run, value: "true" } # true => plan + fabricate + validate only; no deletes, mongo writes, upload, register or bill-run
      - { name: bill-period, value: "" } # YYYY-MM bill-RUN month; empty => current month. The bill covers the month BEFORE it
      - { name: rebill, value: auto } # auto => reset only if a committed bill blocks the period, reprocess also when billing has no energy data for it; force | off
      - { name: gentrack-bill-numbers, value: "" } # gentrack bill number(s) to re-send, comma-separated (e.g. J40000010621); empty => the period being billed
      - { name: engineer-visit, value: "false" }
      - { name: verify, value: "false" } # true => also observe the other systems (baselines, ledger snapshots, BigQuery, the finance export)
      - { name: log-level, value: info } # one level for the whole pipeline; reaches every dispatched tool
  templates:
    - name: main
      inputs:
        parameters:
          - { name: account-numbers }
          - { name: token, value: "" }
          - { name: validation-mode, value: attended }
          - { name: dry-run, value: "false" }
          - { name: bill-period, value: "" }
          - { name: rebill, value: auto }
          - { name: gentrack-bill-numbers, value: "" }
          - { name: engineer-visit, value: "false" }
          - { name: verify, value: "false" }
          - { name: log-level, value: info }
          - { name: account-cluster-name, value: dev-aws }
          - { name: account-namespace, value: account-platform }
          - { name: energy-service-cluster-name, value: dev-merit }
          - { name: energy-service-namespace, value: energy-platform }
          - { name: assert-cluster-name, value: dev-merit }
          - { name: assert-namespace, value: energy-billing }
          # invoice-preferences + bills mongos (the plan, and the lastinvoiceid write)
          - { name: customer-billing-cluster-name, value: dev-aws }
          - { name: customer-billing-namespace, value: customer-billing }
          # the FWF, the eTag write, register and bill-run
          - { name: billing-cluster-name, value: dev-merit }
          - { name: billing-namespace, value: billing }
          # the account's ledger — the baseline below and bill-run's post-commit check
          - { name: ledgers-namespace, value: ledgers }
          - {
              name: billing-graphql-endpoint,
              value: "http://billing-graphql:8080/graphql",
            }
          - {
              name: uploader-endpoint,
              value: "http://billing-bill-extracts-s3-uploader:80/api/2.0/fwf",
            }
          - { name: teardown, value: "true" }
      steps:
        # 1) ACCOUNT: account-number → account_id
        - - name: resolve-account
            templateRef:
              { name: step-account-resolve-account, template: resolve }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-number,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - {
                    name: account-cluster-name,
                    value: "{{inputs.parameters.account-cluster-name}}",
                  }
                - {
                    name: account-namespace,
                    value: "{{inputs.parameters.account-namespace}}",
                  }
                - { name: teardown, value: "{{inputs.parameters.teardown}}" }

        # 2) ENERGY: account_id → the account's supplies as a flat ndjson artifact
        - - name: resolve-service-identifiers
            templateRef:
              {
                name: step-energy-resolve-service-identifiers,
                template: resolve,
              }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-id,
                    value: "{{steps.resolve-account.outputs.parameters.account-id}}",
                  }
                - {
                    name: energy-service-cluster-name,
                    value: "{{inputs.parameters.energy-service-cluster-name}}",
                  }
                - {
                    name: energy-service-namespace,
                    value: "{{inputs.parameters.energy-service-namespace}}",
                  }
                - { name: teardown, value: "{{inputs.parameters.teardown}}" }

        # 3) SELECT: ALL the account's distinct gentrack_account_numbers, comma-joined
        #    into one scalar (e.g. "J20000032681,J20000041234") — consumed only by the
        #    assert below as a SQL IN list (produce-fwf keys on the UW account, not these).
        - - name: select-gentrack
            template: select
            arguments:
              artifacts:
                - {
                    name: input,
                    from: "{{steps.resolve-service-identifiers.outputs.artifacts.identifiers}}",
                  }
              parameters:
                - name: expr
                  value: 'join(uniq(map(filter(rows, .gentrack_account_number != nil), .gentrack_account_number)), ",")'
                - { name: output-format, value: lines } # emit the comma-joined scalar
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

        # 4) CHECK: read-only. Is a committed bill holding the period being billed,
        #    and does billing hold its energy data? Also logs every
        #    energy_platform_services row the account has, before anything moves.
        - - name: check-rebill
            templateRef: { name: step-billing-account-state, template: check }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-numbers,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - {
                    name: account-ids,
                    value: "{{steps.resolve-account.outputs.parameters.account-id}}",
                  }
                - {
                    name: bill-period,
                    value: "{{inputs.parameters.bill-period}}",
                  }
                - { name: rebill, value: "{{inputs.parameters.rebill}}" }
                - {
                    name: gentrack-bill-numbers,
                    value: "{{inputs.parameters.gentrack-bill-numbers}}",
                  }

        # 4b) SNAPSHOT (verify only): what the adapter holds before anything is re-sent.
        #     Here and not later because reprocess-bills clears processed_at — after it
        #     the "before" is gone. The ledger's own before/after lives in bill-run,
        #     either side of the Commit that moves it.
        #
        #     Billing's side needs no step: check-rebill above logs every
        #     energy_platform_services row on every run, verify or not.
        #
        #     Does not assert. See the header. Same scope precedence as the assert below.
        - - name: adapter-blobs-snapshot
            when: "{{inputs.parameters.verify}} == true"
            templateRef:
              { name: step-energy-assert-bills-processed, template: snapshot }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: external-account-number,
                    value: "{{steps.select-gentrack.outputs.parameters.result}}",
                  }
                - {
                    name: gentrack-bill-numbers,
                    value: "{{inputs.parameters.gentrack-bill-numbers}}",
                  }
                - {
                    name: bill-period,
                    value: "{{steps.check-rebill.outputs.parameters.blob-period}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.assert-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.assert-namespace}}",
                  }

        # 5) RESET: clear what a previous bill run left, so these accounts can be billed
        #    again. Both stores in parallel from dev-merit/billing; dry-run reports row
        #    counts instead of deleting.
        #
        #    Gated on do-reset alone: reset is not period-aware, so only a committed bill
        #    number holding the period — which can be neither reused nor deleted — is
        #    worth deleting every bill the account has for.
        - - name: reset-bills-for-account
            when: "{{steps.check-rebill.outputs.parameters.do-reset}} == true"
            templateRef:
              { name: step-billing-reset, template: reset-bills-for-account }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-numbers,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - { name: dry-run, value: "{{inputs.parameters.dry-run}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.billing-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.billing-namespace}}",
                  }

        # 6) REPROCESS: re-open the adapter's blobs and have it send them again, so
        #    billing holds the period's energy data. Minutes, not seconds: the RPC has no
        #    per-account form and walks every migrated account.
        #
        #    Runs when the reset above has just deleted that data, and also when
        #    check-rebill found billing holding none — the state a half-finished earlier
        #    run leaves, which the assert below cannot see.
        #
        #    Scope: gentrack-bill-numbers wins when given; otherwise blob-period, the
        #    period the bill will carry — bill-period shifted back a month by
        #    check-rebill, not the bill-run month itself.
        - - name: reprocess-bills
            when: "{{steps.check-rebill.outputs.parameters.do-reprocess}} == true"
            templateRef:
              { name: step-energy-reprocess-bills, template: reprocess }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: external-account-number,
                    value: "{{steps.select-gentrack.outputs.parameters.result}}",
                  }
                - {
                    name: gentrack-bill-numbers,
                    value: "{{inputs.parameters.gentrack-bill-numbers}}",
                  }
                - {
                    name: bill-period,
                    value: "{{steps.check-rebill.outputs.parameters.blob-period}}",
                  }
                - { name: token, value: "{{inputs.parameters.token}}" }
                - { name: dry-run, value: "{{inputs.parameters.dry-run}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.assert-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.assert-namespace}}",
                  }

        # 7) ASSERT: the energy data for the period reached the adapter, else fail. Runs
        #    whether or not reprocess did — on a first bill it is the only thing between
        #    an unprocessed blob and a bill with no energy lines.
        #
        #    Same scope precedence as reprocess above, so it judges the rows that were
        #    actually re-sent: named numbers, else blob-period. An older period holding
        #    an unprocessable blob is not a reason to refuse to bill this one.
        #
        #    It reads processed_at only, so it cannot see a reset that left the blobs
        #    marked processed and billing's energy rows deleted — that is check-rebill's
        #    job, against the destination.
        - - name: assert-bills-processed
            templateRef:
              { name: step-energy-assert-bills-processed, template: assert }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: external-account-number,
                    value: "{{steps.select-gentrack.outputs.parameters.result}}",
                  }
                - {
                    name: gentrack-bill-numbers,
                    value: "{{inputs.parameters.gentrack-bill-numbers}}",
                  }
                - {
                    name: bill-period,
                    value: "{{steps.check-rebill.outputs.parameters.blob-period}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.assert-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.assert-namespace}}",
                  }

        # 8) SET-INVOICE-NUMBER: plan the number, then write it to both mongos (skipped
        #    by dry-run). Emits the plan — applied everywhere before the FWF is built.
        - - name: set-invoice-number
            templateRef:
              { name: step-billing-set-invoice-number, template: set }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-numbers,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - { name: dry-run, value: "{{inputs.parameters.dry-run}}" }
                - {
                    name: customer-billing-cluster-name,
                    value: "{{inputs.parameters.customer-billing-cluster-name}}",
                  }
                - {
                    name: customer-billing-namespace,
                    value: "{{inputs.parameters.customer-billing-namespace}}",
                  }
                - {
                    name: billing-cluster-name,
                    value: "{{inputs.parameters.billing-cluster-name}}",
                  }
                - {
                    name: billing-namespace,
                    value: "{{inputs.parameters.billing-namespace}}",
                  }

        - - name: pause-before-produce-fwf
            templateRef: { name: step-pause, template: pause }
            arguments:
              parameters:
                - name: message
                  value: >-
                    BEFORE FABRICATE + UPLOAD — nothing is in the bill-extracts
                    bucket yet, so the number below is still reusable.
                    APPLIED PLAN (account / invoice number / state):
                    {{steps.set-invoice-number.outputs.parameters.plan}}
                    — `changed` = a new number was claimed, `unchanged` = the
                    account's existing one was kept. Re-running from here reuses
                    this number while no bill exists for it. Resuming fabricates
                    the FWF and, unless dry-run, uploads it; fabricate/validate/
                    upload share one Job, so this is the last boundary before
                    the bucket.

        # 9) PRODUCE-FWF: fabricate + validate, then upload unless dry-run. The plan is
        #    the only input — it names the UW customer accounts (not the gentrack
        #    numbers, which are only for the assert above) and the number each was
        #    assigned, and is fabricate's input verbatim.
        #
        #    bill-period comes from check-rebill, not the input: the same resolved month
        #    the reset check was made against.
        - - name: produce-fwf
            templateRef: { name: step-billing-produce-fwf, template: produce }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: invoice-map,
                    value: "{{steps.set-invoice-number.outputs.parameters.plan}}",
                  }
                - {
                    name: bill-period,
                    value: "{{steps.check-rebill.outputs.parameters.bill-period}}",
                  }
                - {
                    name: engineer-visit,
                    value: "{{inputs.parameters.engineer-visit}}",
                  }
                - { name: dry-run, value: "{{inputs.parameters.dry-run}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.billing-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.billing-namespace}}",
                  }

        - - name: pause-before-register
            templateRef: { name: step-pause, template: pause }
            arguments:
              parameters:
                - name: message
                  value: >-
                    AFTER UPLOAD, BEFORE REGISTER — the FWF is in the bucket but
                    the s3-uploader has not been told about it, so no segment
                    exists yet. Check the produce-fwf node: `filename` is the
                    minted segment name, and its validate container passed with no
                    MISMATCH / MISSING / UNEXPECTED / DUPLICATE lines. Then check
                    the billing-bill-extracts-s3-uploader pod logs in
                    dev-merit/billing for the upload success signal. Resuming
                    registers the file, which is what makes it real to billing.

        # ── DRY RUN STOPS HERE: register + bill-run only run for a real bill ──

        # 10) REGISTER: tell the s3-uploader about the uploaded FWF (POST {"file": "<name>.snappy"})
        - - name: register
            when: "{{inputs.parameters.dry-run}} != true"
            templateRef: { name: step-billing-graphql-call, template: call }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: op-name, value: register-fwf }
                - name: payload
                  value: '{"file":"{{steps.produce-fwf.outputs.parameters.filename}}.snappy"}'
                - { name: assert, value: "response.ok == true" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.billing-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.billing-namespace}}",
                  }
                - {
                    name: endpoint,
                    value: "{{inputs.parameters.uploader-endpoint}}",
                  }

        - - name: pause-before-bill-run
            templateRef: { name: step-pause, template: pause }
            arguments:
              parameters:
                - name: message
                  value: >-
                    AFTER REGISTER, BEFORE BILL-RUN — the segment now exists and is
                    known to billing, but nothing has been billed. Check the
                    register node returned ok, then check the bill-adapter pod logs
                    in dev-merit/billing for the success signals. Resuming starts
                    Create → Bill → Commit → Export → Fulfil; bill-run pauses again
                    before the irreversible Commit when validation-mode is attended.

        # 11) BILL-RUN: Create → Bill → Commit → Export → Fulfil (segment = FWF name)
        - - name: bill-run
            when: "{{inputs.parameters.dry-run}} != true"
            templateRef: { name: step-billing-bill-run, template: main }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-number,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - {
                    name: segment-name,
                    value: "{{steps.produce-fwf.outputs.parameters.filename}}",
                  }
                - {
                    name: segment-ids,
                    value: "{{steps.produce-fwf.outputs.parameters.filename}}",
                  }
                - { name: verify, value: "{{inputs.parameters.verify}}" }
                # What bill-run's ledger snapshots and BigQuery lookup key on.
                - {
                    name: account-ids,
                    value: "{{steps.resolve-account.outputs.parameters.account-id}}",
                  }
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: validation-mode,
                    value: "{{inputs.parameters.validation-mode}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.billing-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.billing-namespace}}",
                  }
                - {
                    name: ledgers-namespace,
                    value: "{{inputs.parameters.ledgers-namespace}}",
                  }
                - {
                    name: endpoint,
                    value: "{{inputs.parameters.billing-graphql-endpoint}}",
                  }

    # -------------------------------------------------------------------------
    # select — mount an ndjson artifact at /tmp/in.ndjson, run an expr over `rows`,
    # emit the result to stdout and to /tmp/out (captured as the `result` param).
    # Same executor + pattern as flow-account-select. select-image is pinned.
    # -------------------------------------------------------------------------
    - name: select
      inputs:
        artifacts:
          - { name: input, path: /tmp/in.ndjson }
        parameters:
          - {
              name: select-image,
              value: "registry.uw.systems/dev-enablement/select:main",
            }
          - { name: expr }
          - { name: format, value: ndjson }
          - { name: output-format, value: json }
          - { name: log-level, value: info }
      container:
        image: "{{inputs.parameters.select-image}}"
        env:
          - { name: INPUT, value: /tmp/in.ndjson }
          - { name: FORMAT, value: "{{inputs.parameters.format}}" }
          - { name: SELECT, value: "{{inputs.parameters.expr}}" }
          - { name: OUTPUT, value: /tmp/out }
          - {
              name: OUTPUT_FORMAT,
              value: "{{inputs.parameters.output-format}}",
            }
          - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }
      outputs:
        parameters:
          - name: result
            valueFrom:
              path: /tmp/out
              default: ""
