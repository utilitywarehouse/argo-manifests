# =============================================================================
# bill-run — segment lifecycle via the bill-run CLI
# =============================================================================
# Automates the billing-operations-frontend segment flow. Each stage asks
# billing-orchestrator for an -ING state and returns once its consumer has
# settled the group on the matching -ED state:
#
#   Bill     PENDING   --progress --to STATE_BILLING-->    settles BILLED    (+produced/reported==total)
#   Commit   BILLED    --progress --to STATE_COMMITTING--> settles COMMITTED
#   Export   COMMITTED --progress --to STATE_EXPORTING-->  settles EXPORTED  (+produced/reported==total)
#   Fulfil   EXPORTED  --schedule, then --to STATE_FULFILLING--> settles FULFILLED
#
# NO POLLING STEPS. `progress` owns both gates: it waits for the stage before it
# to settle, refuses to write unless the group is in the one state the
# transition is legal from, and returns only once its own state has settled. Any
# other state — cancelled, on hold, a dry run, another stage's — fails the step
# immediately. A group already past the stage is left alone, so a retry is safe.
#
# `schedule` DERIVES the delivery schedule: it reads fido's per-invoice counts
# for the segment and schedules every delivery of each kind it finds.
#
# WHAT COMMIT DID, in the stores rather than in the segment — `verify` only, and
# skipped when account-ids is empty (a hand-submitted bill-run):
#
#   after BILLED      ledger-snapshot-before, transaction-log-before
#   ── COMMIT ──
#   after COMMITTED   ledger-snapshot-after, transaction-log-after
#   after EXPORTED    export-file-snapshot
#
# Each pair is one template called twice, `phase` apart. None assert — they
# print rows for a person to judge and go red only on a connection, credentials
# or unreadable-volume error. The before-snapshots run ahead of
# pause-before-commit so they can be read while suspended; the after ones wait
# `verify-wait` for their store to catch up, a delay rather than a gate.
#
# The waits key on {{workflow.creationTimestamp.RFC3339}} — later than any
# previous bill, earlier than this Commit. Without it a re-bill stops waiting
# immediately, satisfied by the rows the LAST run wrote.
#
# SCOPE: starts from an uploaded AND registered FWF. `generate-bill.yaml` is the
# account-number entrypoint that produces the FWF and hands off here.
#
# SEGMENT NAME vs ID. name = free text label (segment_groups.name). id = the
# extract file's S3 object key, suffix included (segments.id). `segment-ids` is
# the minted base name WITHOUT suffix, used as a PREFIX — the suffix is
# data-dependent (.snappy / .migrated.snappy) and resolved at run time; more
# than one match fails rather than picking one.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-billing-bill-run
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Segment lifecycle (Bill → Commit → Export → Fulfil) via the bill-run CLI
      against billing-orchestrator, each stage waiting for its state to settle
      before the next is asked for.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: standalone
    data.uw.systems/system: billing
    data.uw.systems/capability: bill-run
spec:
  entrypoint: main
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: account-number } # for labels/traceability
      - { name: segment-name } # free text label for the group; also resolves the group id
      - { name: segment-ids } # FWF base name, no suffix; a PREFIX matched against the ungrouped ids
      - name: verify # true => also observe the ledger, BigQuery and the finance export
        value: "false"
        enum: ["true", "false"]
      - { name: account-ids, value: "" } # account-platform UUID(s), comma-joined; the ledger and tx log key on them. Empty => no observing, whatever verify says
      # attended => pause before the irreversible Commit; unattended => straight
      # through (the state gates still hold every stage)
      - name: validation-mode
        value: "attended"
        enum: ["attended", "unattended"]
      - name: log-level
        value: "info"
        enum: ["info", "debug"]

  templates:
    - name: main
      inputs:
        parameters:
          - { name: account-number }
          - { name: segment-name }
          - { name: segment-ids }
          - { name: verify, value: "false" }
          - { name: account-ids, value: "" }
          - { name: validation-mode, value: attended }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - { name: ledgers-namespace, value: ledgers }
          - { name: author, value: "argo/{{workflow.name}}" }
          # How long each after-snapshot waits for its store to catch up with
          # Commit before dumping anyway. None fail when it runs out.
          - { name: verify-wait, value: 10m }
          - { name: stage-timeout, value: 30m }
          - { name: call-timeout, value: 10m }
          - { name: log-level, value: info }
      steps:
        # ---- Resolve the segment FILE id -----------------------------------
        # The id is the S3 key with a data-dependent suffix, so read it back
        # rather than build it. Only UNGROUPED ids count, which also gates on the
        # parser having ingested the file; more than one match stops the run.
        - - name: resolve-segment-file
            template: cli
            arguments:
              parameters:
                - { name: op-name, value: resolve-segment-file }
                - name: args
                  value: "resolve --prefix {{inputs.parameters.segment-ids}}"
                - { name: capture-result, value: "true" }
                - { name: timeout, value: "{{inputs.parameters.call-timeout}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

        # ---- Create segment ------------------------------------------------
        # Returns the group id every later stage is addressed by. A group that
        # already has this name is returned as-is rather than duplicated.
        - - name: create-segment
            template: cli
            arguments:
              parameters:
                - { name: op-name, value: create-segment }
                - name: args
                  value: >-
                    create --name '{{inputs.parameters.segment-name}}'
                    --members {{steps.resolve-segment-file.outputs.parameters.result}}
                - { name: capture-result, value: "true" }
                - { name: timeout, value: "{{inputs.parameters.call-timeout}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

        # ---- Bill:   PENDING -> STATE_BILLING -> settles BILLED -------------
        # `progress` holds both the wait for BILLED and the produced/reported
        # gate Commit needs.
        - - name: bill
            template: cli
            arguments:
              parameters:
                - { name: op-name, value: bill }
                - name: args
                  value: >-
                    progress --id {{steps.create-segment.outputs.parameters.result}}
                    --to STATE_BILLING
                - {
                    name: timeout,
                    value: "{{inputs.parameters.stage-timeout}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

        # ---- The stores as Commit finds them -------------------------------
        # Ahead of the pause on purpose: on an attended run these are in the graph
        # to read while suspended, and the after-snapshots diff against them. Two
        # namespaces, no shared data, so one parallel group. No waits.
        - - name: ledger-snapshot-before
            when: '"{{inputs.parameters.account-ids}}" != "" && {{inputs.parameters.verify}} == true'
            templateRef:
              { name: step-ledgers-ledger-snapshot, template: snapshot }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-ids,
                    value: "{{inputs.parameters.account-ids}}",
                  }
                - { name: phase, value: before }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.ledgers-namespace}}",
                  }

          - name: transaction-log-before
            when: '"{{inputs.parameters.account-ids}}" != "" && {{inputs.parameters.verify}} == true'
            templateRef:
              {
                name: step-billing-transaction-log-snapshot,
                template: snapshot,
              }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-ids,
                    value: "{{inputs.parameters.account-ids}}",
                  }
                - { name: phase, value: before }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }

        # ---- Human validation gate (attended only) -------------------------
        - - name: pause-before-commit
            templateRef: { name: step-pause, template: pause }
            arguments:
              parameters:
                - name: active
                  value: "{{inputs.parameters.validation-mode}}"
                - name: message
                  value: >-
                    BEFORE COMMIT — the segment is BILLED and Commit is
                    irreversible. Validate the bill totals and VAT against
                    Gentrack, and check the bill-adapter pod logs in
                    dev-merit/billing for the success signals. The
                    ledger-snapshot-before and transaction-log-before nodes hold
                    those two stores as they stand now — the after-snapshots below
                    Commit run the same queries again, so each pair diffs.
                    Resuming moves the segment to STATE_COMMITTING and on through
                    Export and Fulfil.

        # ---- Commit: BILLED -> STATE_COMMITTING -> settles COMMITTED --------
        - - name: commit
            template: cli
            arguments:
              parameters:
                - { name: op-name, value: commit }
                - name: args
                  value: >-
                    progress --id {{steps.create-segment.outputs.parameters.result}}
                    --to STATE_COMMITTING
                - {
                    name: timeout,
                    value: "{{inputs.parameters.stage-timeout}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

        - - name: ledger-snapshot-after
            when: '"{{inputs.parameters.account-ids}}" != "" && {{inputs.parameters.verify}} == true'
            templateRef:
              { name: step-ledgers-ledger-snapshot, template: snapshot }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-ids,
                    value: "{{inputs.parameters.account-ids}}",
                  }
                - { name: phase, value: after }
                # A delay, not a gate: let the ledger catch up with Commit.
                - {
                    name: wait-for-entry,
                    value: "{{inputs.parameters.verify-wait}}",
                  }
                - {
                    name: since,
                    value: "{{workflow.creationTimestamp.RFC3339}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.ledgers-namespace}}",
                  }

          - name: transaction-log-after
            when: '"{{inputs.parameters.account-ids}}" != "" && {{inputs.parameters.verify}} == true'
            templateRef:
              {
                name: step-billing-transaction-log-snapshot,
                template: snapshot,
              }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-ids,
                    value: "{{inputs.parameters.account-ids}}",
                  }
                - { name: phase, value: after }
                # A delay, not a gate — same as the ledger's.
                - {
                    name: wait-for-row,
                    value: "{{inputs.parameters.verify-wait}}",
                  }
                - {
                    name: since,
                    value: "{{workflow.creationTimestamp.RFC3339}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }

        # ---- Export: COMMITTED -> STATE_EXPORTING -> settles EXPORTED -------
        - - name: export
            template: cli
            arguments:
              parameters:
                - { name: op-name, value: export }
                - name: args
                  value: >-
                    progress --id {{steps.create-segment.outputs.parameters.result}}
                    --to STATE_EXPORTING
                - {
                    name: timeout,
                    value: "{{inputs.parameters.stage-timeout}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

        - - name: export-file-snapshot
            when: '"{{inputs.parameters.account-ids}}" != "" && {{inputs.parameters.verify}} == true'
            templateRef:
              { name: step-billing-export-file-snapshot, template: snapshot }
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: match, value: "{{inputs.parameters.account-number}}" }
                - {
                    name: wait-for-record,
                    value: "{{inputs.parameters.verify-wait}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }

        # ---- Fulfil: schedule the deliveries, then EXPORTED -> FULFILLING ---
        # Order matters: the schedule must exist before the deliveries it
        # describes are asked for. Kinds and counts come from fido.
        - - name: schedule-deliveries
            template: cli
            arguments:
              parameters:
                - { name: op-name, value: schedule-deliveries }
                - name: args
                  value: "schedule --id {{steps.create-segment.outputs.parameters.result}}"
                - { name: timeout, value: "{{inputs.parameters.call-timeout}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

        - - name: fulfil
            template: cli
            arguments:
              parameters:
                - { name: op-name, value: fulfil }
                - name: args
                  value: >-
                    progress --id {{steps.create-segment.outputs.parameters.result}}
                    --to STATE_FULFILLING
                - {
                    name: timeout,
                    value: "{{inputs.parameters.stage-timeout}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

    # -------------------------------------------------------------------------
    # cli — one bill-run invocation, dispatched as a Job into the billing
    # namespace: the Argo controller cannot reach billing-orchestrator. fido is
    # in another cluster, reached through its mirrored service.
    #
    # The Job pod carries `policy.semaphore.uw.io/name`. fido sits behind a
    # default-deny ingress in the aws cluster; semaphore-policy only mints a
    # GlobalNetworkSet for a merit pod that has this label, and the calico policy
    # guarding invoice-delivery-orchestrator matches on the labels it puts there.
    # Without it the 8090 dial is silently dropped — i/o timeout, not refused.
    #
    # `capture-result` surfaces the command's stdout (a segment file id, a group
    # id) as this template's `result`; logs go to stderr, so it stays clean.
    # -------------------------------------------------------------------------
    - name: cli
      inputs:
        parameters:
          - { name: op-name } # e.g. bill, commit, schedule-deliveries
          - { name: args } # bill-run's subcommand and flags
          - { name: capture-result, value: "false" }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - { name: address, value: "billing-orchestrator:8090" }
          - {
              name: fido-address,
              value: "invoice-delivery-orchestrator.customer-billing.svc.cluster.aws:8090",
            }
          - { name: author, value: "argo/{{workflow.name}}" }
          - {
              name: bill-run-image,
              value: "registry.uw.systems/billing/bill-run:main",
            }
          - { name: runner-sa, value: default }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: log-level, value: info }
          - { name: timeout, value: 10m } # deadline for the command, waiting included
          - { name: poll-interval, value: 15s } # gap between state checks while waiting
          - { name: job-ttl, value: 24h } # keep finished Job for debug, then GC
      outputs:
        parameters:
          - name: result
            valueFrom:
              parameter: "{{steps.billing.outputs.parameters.result}}"
      steps:
        - - name: billing
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: job-name,
                    value: "billing-bill-run-{{inputs.parameters.op-name}}",
                  }
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['timeout']).Seconds()) + 120}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        metadata:
                          labels:
                            policy.semaphore.uw.io/name: bill-run
                        spec:
                          serviceAccountName: {{inputs.parameters.runner-sa}}
                          imagePullSecrets:
                            - name: {{inputs.parameters.image-pull-secret}}
                          restartPolicy: Never
                          containers:
                            - name: bill-run
                              image: {{inputs.parameters.bill-run-image}}
                              imagePullPolicy: Always
                              command: [sh, -c]
                              args:
                                - |
                                  set -eu
                                  # Diagnostics go to stderr, the captured value to stdout.
                                  out=$(/svc {{inputs.parameters.args}})
                                  if [ "{{inputs.parameters.capture-result}}" = "true" ]; then
                                    echo "ARGO_RESULT_OUTPUT=${out}"
                                  fi
                              env:
                                - { name: BO_ADDRESS, value: "{{inputs.parameters.address}}" }
                                - { name: FIDO_ADDRESS, value: "{{inputs.parameters.fido-address}}" }
                                - { name: AUTHOR, value: "{{inputs.parameters.author}}" }
                                - { name: TIMEOUT, value: "{{inputs.parameters.timeout}}" }
                                - { name: POLL_INTERVAL, value: "{{inputs.parameters.poll-interval}}" }
                                - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }
