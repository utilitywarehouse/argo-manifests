# =============================================================================
# bill-run — segment lifecycle via billing-graphql (mirrors the UI)
# =============================================================================
# Automates the billing-operations-frontend segment flow. Each action triggers a
# state transition via update_segment (setting the -ING state), then we poll
# read_segments until the segment reaches the -ED state — exactly how the UI
# enables the next action's button. The transitions and gates are taken from the
# frontend (getNextState + shouldAllow*Action):
#
#   Bill     PENDING   --update_segment(STATE_BILLING)--->    await BILLED  (+produced/reported==total)
#   Commit   BILLED    --update_segment(STATE_COMMITTING)-->  await COMMITTED
#   Export   COMMITTED --update_segment(STATE_EXPORTING)--->  await EXPORTED (+produced/reported==total)
#   Fulfil   EXPORTED  --set_segment_delivery_schedule + update_segment(STATE_FULFILLING)--> await FULFILLED
#
# WHAT COMMIT DID, in the stores rather than in the segment — `verify` only, and
# skipped entirely when account-ids is empty (a hand-submitted bill-run):
#
#   after BILLED      ledger-snapshot-before, transaction-log-before
#   ── COMMIT ──
#   after COMMITTED   ledger-snapshot-after, transaction-log-after
#   after EXPORTED    export-file-snapshot
#
# Each pair is one template called twice, `phase` apart. None of them assert —
# they print rows for a person to judge and go red only on a connection,
# credentials or unreadable-volume error. The before-snapshots run ahead of
# pause-before-commit so they are there to read while suspended; the after ones
# wait `verify-wait` for their store to catch up, which is a delay, not a gate.
#
# The waits key on {{workflow.creationTimestamp.RFC3339}} — later than any
# previous bill, earlier than this Commit. Without it a re-bill stops waiting
# immediately, satisfied by the rows the LAST run wrote.
#
# SCOPE: starts from an uploaded AND registered FWF. `generate-bill.yaml` is the
# account-number entrypoint that produces the FWF and hands off here. This
# template stays individually usable for re-running the pipeline.
#
# SEGMENT NAME vs ID. name = free text label (segment_groups.name). id = the
# extract file's S3 object key, suffix included (segments.id). `segment-ids` is
# the minted base name WITHOUT suffix, used as a PREFIX — the suffix is
# data-dependent (.snappy / .migrated.snappy) and resolved at run time.
#
#   argo submit --from workflowtemplate/step-billing-bill-run \
#     -p segment-name=UWCDATA1_D181225_T114259.052 \
#     -p segment-ids=UWCDATA1_D181225_T114259.052 -p token=<bearer>
#
# AUTH: `token` is a short-lived bearer token the submitter supplies (any
# engineer can generate one). It is intentionally a parameter, not a Secret.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-billing-bill-run
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Segment lifecycle (Bill → Commit → Export → Fulfil) against billing-graphql,
      mirroring the billing-operations-frontend flow with a state-poll gate after
      each transition.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: standalone
    data.uw.systems/system: billing
    data.uw.systems/capability: bill-run
spec:
  entrypoint: main
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: account-number } # for labels/traceability
      - { name: segment-name } # free text label for the group; also resolves the group id
      - { name: segment-ids } # minted FWF base name, no suffix; a PREFIX matched against list_segments
      - { name: verify, value: "false" } # true => also observe the ledger, BigQuery and the finance export
      - { name: account-ids, value: "" } # account-platform UUID(s), comma-joined; the ledger and tx log key on them. Empty => no observing whatever verify says
      - { name: token, value: "" } # short-lived bearer token supplied by the submitter
      # attended -> pause for human validation before the irreversible Commit;
      # unattended -> run straight through (state polls still gate every stage)
      - { name: validation-mode, value: attended }

  templates:
    - name: main
      inputs:
        parameters:
          - { name: account-number }
          - { name: segment-name }
          - { name: segment-ids }
          - { name: verify, value: "false" }
          - { name: account-ids, value: "" }
          - { name: token, value: "" }
          - { name: validation-mode, value: attended }
          - { name: delivery-type, value: "0" }
          - {
              name: schedule-entries,
              value: '[{"id":"0","total":1,"date":"{{workflow.creationTimestamp.RFC3339}}"}]',
            }
          - { name: state-pending, value: STATE_PENDING }
          - { name: state-billed, value: STATE_BILLED }
          - { name: state-committed, value: STATE_COMMITTED }
          - { name: state-exported, value: STATE_EXPORTED }
          - { name: state-fulfilled, value: STATE_FULFILLED }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - { name: ledgers-namespace, value: ledgers }
          # How long each after-snapshot waits for its store to catch up with
          # Commit before dumping anyway. None fail when it runs out.
          - { name: verify-wait, value: 10m }
          - { name: endpoint, value: "http://billing-graphql:8080/graphql" }
      steps:
        # ---- Resolve the segment FILE id -----------------------------------
        # The id is the S3 key with a data-dependent suffix, so read it back
        # rather than build it. list_segments returns UNGROUPED ids, so this
        # also gates on the parser having ingested the file; `== 1` stops on
        # ambiguity rather than grouping the wrong variant.
        - - name: resolve-segment-file
            templateRef: { name: step-billing-graphql-call, template: call }
            arguments:
              parameters:
                - { name: op-name, value: resolve-segment-file }
                - {
                    name: payload,
                    value: '{"query":"{ list_segments { ids } }"}',
                  }
                - name: success-expr
                  value: >-
                    len(filter(response.body.data.list_segments.ids,
                    {hasPrefix(#, "{{inputs.parameters.segment-ids}}")})) == 1
                - { name: failure-expr, value: "response.body.errors != nil" }
                - name: result-expr
                  value: >-
                    filter(response.body.data.list_segments.ids,
                    {hasPrefix(#, "{{inputs.parameters.segment-ids}}")})[0]
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }

        # ---- Create segment ------------------------------------------------
        # create_segment returns emptypb.Empty — `success` is always null.
        - - name: create-segment
            templateRef: { name: step-billing-graphql-call, template: call }
            arguments:
              parameters:
                - { name: op-name, value: create-segment }
                - name: payload
                  value: >-
                    {"query":"mutation($n:String,$ids:String){ create_segment(name:$n, segment_ids:$ids){ success error_message } }",
                    "variables":{"n":"{{inputs.parameters.segment-name}}","ids":"{{steps.resolve-segment-file.outputs.parameters.result}}"}}
                - { name: assert, value: "response.body.errors == nil" }
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }

        # ---- Resolve id + precondition: poll until the segment is PENDING ----
        - - name: resolve-segment
            templateRef: { name: step-billing-graphql-call, template: call }
            arguments:
              parameters:
                - { name: op-name, value: resolve-segment }
                - name: payload
                  value: '{"query":"{ read_segments { segments { id name state } } }"}'
                - name: success-expr
                  value: >-
                    any(response.body.data.read_segments.segments,
                    {.name == "{{inputs.parameters.segment-name}}" && .state == "{{inputs.parameters.state-pending}}"})
                - { name: failure-expr, value: "response.body.errors != nil" }
                - name: result-expr
                  value: >-
                    filter(response.body.data.read_segments.segments,
                    {.name == "{{inputs.parameters.segment-name}}"})[0].id
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }

        # ---- Bill:   PENDING -> STATE_BILLING -> await BILLED --------------
        - - name: bill
            templateRef: { name: step-billing-graphql-call, template: call }
            arguments:
              parameters:
                - { name: op-name, value: bill }
                - name: payload
                  value: >-
                    {"query":"mutation($id:String,$s:String){ update_segment(id:$id, state:$s){ success error_message } }",
                    "variables":{"id":"{{steps.resolve-segment.outputs.parameters.result}}","s":"STATE_BILLING"}}
                - {
                    name: assert,
                    value: "response.body.data.update_segment.success == true",
                  }
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }
        - - name: await-billed
            templateRef:
              { name: step-billing-await-segment-state, template: await }
            arguments:
              parameters:
                - {
                    name: segment-id,
                    value: "{{steps.resolve-segment.outputs.parameters.result}}",
                  }
                - {
                    name: target-state,
                    value: "{{inputs.parameters.state-billed}}",
                  }
                - { name: op-name, value: await-billed }
                # Commit is gated on full production, same as the UI
                # total > 0: an empty segment satisfies produced == total == 0
                - {
                    name: extra-expr,
                    value: ".stats.total > 0 && .stats.produced == .stats.total && .stats.reported == .stats.total",
                  }
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }

        # ---- The stores as Commit finds them -------------------------------
        # Ahead of the pause on purpose: on an attended run these are already in
        # the graph to read while the workflow is suspended, and they are what the
        # after-snapshots get compared against. Two namespaces, no shared data, so
        # one parallel group. No waits — nothing is in flight yet.
        - - name: ledger-snapshot-before
            when: '"{{inputs.parameters.account-ids}}" != "" && {{inputs.parameters.verify}} == true'
            templateRef:
              { name: step-ledgers-ledger-snapshot, template: snapshot }
            arguments:
              parameters:
                - {
                    name: account-ids,
                    value: "{{inputs.parameters.account-ids}}",
                  }
                - { name: phase, value: before }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.ledgers-namespace}}",
                  }

          - name: transaction-log-before
            when: '"{{inputs.parameters.account-ids}}" != "" && {{inputs.parameters.verify}} == true'
            templateRef:
              {
                name: step-billing-transaction-log-snapshot,
                template: snapshot,
              }
            arguments:
              parameters:
                - {
                    name: account-ids,
                    value: "{{inputs.parameters.account-ids}}",
                  }
                - { name: phase, value: before }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }

        # ---- Human validation gate (attended only) -------------------------
        - - name: pause-before-commit
            templateRef: { name: step-pause, template: pause }
            when: "{{inputs.parameters.validation-mode}} == attended"
            arguments:
              parameters:
                - name: message
                  value: >-
                    BEFORE COMMIT — the segment is BILLED and Commit is
                    irreversible. Validate the bill totals and VAT against
                    Gentrack, and check the bill-adapter pod logs in
                    dev-merit/billing for the success signals. The
                    ledger-snapshot-before and transaction-log-before nodes hold
                    those two stores as they stand now — the after-snapshots below
                    Commit run the same queries again, so each pair diffs.
                    Resuming moves the segment to STATE_COMMITTING and on through
                    Export and Fulfil.

        # ---- Commit: BILLED -> STATE_COMMITTING -> await COMMITTED ---------
        - - name: commit
            templateRef: { name: step-billing-graphql-call, template: call }
            arguments:
              parameters:
                - { name: op-name, value: commit }
                - name: payload
                  value: >-
                    {"query":"mutation($id:String,$s:String){ update_segment(id:$id, state:$s){ success error_message } }",
                    "variables":{"id":"{{steps.resolve-segment.outputs.parameters.result}}","s":"STATE_COMMITTING"}}
                - {
                    name: assert,
                    value: "response.body.data.update_segment.success == true",
                  }
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }
        - - name: await-committed
            templateRef:
              { name: step-billing-await-segment-state, template: await }
            arguments:
              parameters:
                - {
                    name: segment-id,
                    value: "{{steps.resolve-segment.outputs.parameters.result}}",
                  }
                - {
                    name: target-state,
                    value: "{{inputs.parameters.state-committed}}",
                  }
                - { name: op-name, value: await-committed }
                - { name: extra-expr, value: ".stats.total > 0" }
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }

        - - name: ledger-snapshot-after
            when: '"{{inputs.parameters.account-ids}}" != "" && {{inputs.parameters.verify}} == true'
            templateRef:
              { name: step-ledgers-ledger-snapshot, template: snapshot }
            arguments:
              parameters:
                - {
                    name: account-ids,
                    value: "{{inputs.parameters.account-ids}}",
                  }
                - { name: phase, value: after }
                # A delay, not a gate: give the ledger a chance to catch up with
                # Commit so the dump is about this run rather than about the lag.
                - {
                    name: wait-for-entry,
                    value: "{{inputs.parameters.verify-wait}}",
                  }
                - {
                    name: since,
                    value: "{{workflow.creationTimestamp.RFC3339}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.ledgers-namespace}}",
                  }

          - name: transaction-log-after
            when: '"{{inputs.parameters.account-ids}}" != "" && {{inputs.parameters.verify}} == true'
            templateRef:
              {
                name: step-billing-transaction-log-snapshot,
                template: snapshot,
              }
            arguments:
              parameters:
                - {
                    name: account-ids,
                    value: "{{inputs.parameters.account-ids}}",
                  }
                - { name: phase, value: after }
                # Same bargain as the ledger's: a delay so the dump is about this
                # run, not a gate on it having happened.
                - {
                    name: wait-for-row,
                    value: "{{inputs.parameters.verify-wait}}",
                  }
                - {
                    name: since,
                    value: "{{workflow.creationTimestamp.RFC3339}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }

        # ---- Export: COMMITTED -> STATE_EXPORTING -> await EXPORTED --------
        - - name: export
            templateRef: { name: step-billing-graphql-call, template: call }
            arguments:
              parameters:
                - { name: op-name, value: export }
                - name: payload
                  value: >-
                    {"query":"mutation($id:String,$s:String){ update_segment(id:$id, state:$s){ success error_message } }",
                    "variables":{"id":"{{steps.resolve-segment.outputs.parameters.result}}","s":"STATE_EXPORTING"}}
                - {
                    name: assert,
                    value: "response.body.data.update_segment.success == true",
                  }
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }
        - - name: await-exported
            templateRef:
              { name: step-billing-await-segment-state, template: await }
            arguments:
              parameters:
                - {
                    name: segment-id,
                    value: "{{steps.resolve-segment.outputs.parameters.result}}",
                  }
                - {
                    name: target-state,
                    value: "{{inputs.parameters.state-exported}}",
                  }
                - { name: op-name, value: await-exported }
                # Fulfil/Schedule is gated on full production, same as the UI
                # total > 0: an empty segment satisfies produced == total == 0
                - {
                    name: extra-expr,
                    value: ".stats.total > 0 && .stats.produced == .stats.total && .stats.reported == .stats.total",
                  }
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }

        - - name: export-file-snapshot
            when: '"{{inputs.parameters.account-ids}}" != "" && {{inputs.parameters.verify}} == true'
            templateRef:
              { name: step-billing-export-file-snapshot, template: snapshot }
            arguments:
              parameters:
                - { name: match, value: "{{inputs.parameters.account-number}}" }
                - {
                    name: wait-for-record,
                    value: "{{inputs.parameters.verify-wait}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }

        # ---- Fulfil: EXPORTED -> schedule + STATE_FULFILLING -> await FULFILLED
        # One mutation, as the UI does it: set the delivery schedule AND move the
        # segment to STATE_FULFILLING; the scheduled dispatch drives it to FULFILLED.
        - - name: fulfil
            templateRef: { name: step-billing-graphql-call, template: call }
            arguments:
              parameters:
                - { name: op-name, value: fulfil }
                - name: payload
                  value: >-
                    {"query":"mutation($id:String!,$t:Int,$e:[schedule_entry_input!]!,$s:String){ set_segment_delivery_schedule(segment_id:$id, type:$t, entries:$e){ success error_message } update_segment(id:$id, state:$s){ success error_message } }",
                    "variables":{"id":"{{steps.resolve-segment.outputs.parameters.result}}","t":{{inputs.parameters.delivery-type}},"e":{{inputs.parameters.schedule-entries}},"s":"STATE_FULFILLING"}}
                - name: assert
                  value: "response.body.data.set_segment_delivery_schedule.success == true && response.body.data.update_segment.success == true"
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }
        - - name: await-fulfilled
            templateRef:
              { name: step-billing-await-segment-state, template: await }
            arguments:
              parameters:
                - {
                    name: segment-id,
                    value: "{{steps.resolve-segment.outputs.parameters.result}}",
                  }
                - {
                    name: target-state,
                    value: "{{inputs.parameters.state-fulfilled}}",
                  }
                - { name: op-name, value: await-fulfilled }
                - { name: extra-expr, value: ".stats.total > 0" }
                - { name: token, value: "{{inputs.parameters.token}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: endpoint, value: "{{inputs.parameters.endpoint}}" }
                - { name: timeout, value: 15m } # scheduled dispatch can lag; poll longer

