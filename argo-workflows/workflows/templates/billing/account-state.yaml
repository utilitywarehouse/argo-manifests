# =============================================================================
# account-state — what billing holds for an account, and what follows from it
# =============================================================================
# Read-only, one connection to billing-rds `bills`. `check` logs the energy rows
# a run is about to disturb, then decides what the destructive half of the
# pipeline has to do — so billing an account does not require the operator to
# know what state it is in.
#
# THE QUESTION IS ABOUT THE DESTINATION. The only evidence that matters is
# whether public.energy_platform_services holds rows for the period being billed:
# that is what a bill is built from. Their presence implies the blobs were
# processed; their absence means a bill built now carries no energy lines,
# whatever processed_at / processing_issues / validation_issues say. So this
# template never reads billing_period_accounts — that is the source side, and it
# belongs to reprocess-bills' own await and to step-energy-assert-bills-processed.
#
#   committed bill for the period?  energy rows for it?  reset  reprocess
#   no                              yes                  no     no
#   no                              no                   no     YES
#   yes                             yes                  YES    YES
#   yes                             no                   YES    YES
#
# do-reset is a committed bill and nothing else, ever. Committing sets
# `available = false`, after which prevent_unavailable_bill_number_delete refuses
# to delete the row, and a reset is the only way past it. Reset is also NOT
# period-aware — it deletes every bill the account has — so nothing weaker may
# trigger it. An uncommitted number needs no reset: set-invoice-number replaces
# it in place.
#
# do-reprocess is do-reset OR the energy rows being absent. do-reset is a term in
# its own right because at decision time the rows may still be there and the
# reset is about to delete them. The second term is the one nothing else covers: a
# half-finished earlier run leaves the energy rows deleted and the blobs still
# marked processed, so nothing re-sends them and the assert passes anyway —
# "processed" being exactly what it checks, in another database.
#
# gentrack-bill-numbers is SCOPE, never a trigger. It answers which blobs get
# re-opened once a re-send is happening, never whether one happens. It is taken
# here only to warn about the one dangerous pairing: an account-wide reset with a
# narrowed re-send.
#
# rebill: auto applies the table, force forces both, off fails if either is due —
# which makes off a read-only preflight that reports what a run would do and why.
#
# Periods. `bill-period` is the bill-run month M; the bill covers [M-1, M),
# because the composition engine subtracts a month from the bill-run date. Both
# resolve here, in the same query as the counts, so they cannot drift apart:
#
#   bill-period  M      → produce-fwf (every date in the FWF derives from it)
#   blob-period  M - 1  → the bill's own period, the blobs to re-send, and both
#                         counts below
#
# An empty bill-period resolves to the current month in the same query. When that
# rolling derivation does not fit a run, name the bill numbers instead.
#
# One result channel: exec-kube returns a single `result` parameter, so the four
# values travel as one JSON object and the outputs below read it back by field.
# It is emitted AFTER the rebill=force override, not by the query — exec-kube
# honours the first ARGO_RESULT_OUTPUT= line it sees. The energy rows ride back
# separately in the `logs` artifact, being printed rather than captured.
#
# Connection. billing-rds, password auth: a password-free DSN plus PGPASSWORD, as
# step-billing-reset does it — the URL leaves the field the Secret fills.
#
# Reference-only: consumed by step-billing-bill-account via templateRef.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-billing-account-state
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI. Read-only, against billing-rds. Logs the
      account's energy_platform_services rows, then reports whether a committed
      bill blocks the period (reset) and whether billing holds the period's energy
      data (reprocess). Consumed via templateRef.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: reference-only
    data.uw.systems/system: billing
spec:
  entrypoint: check
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: account-numbers } # UW customer account number(s), comma-separated
      - { name: account-ids } # account-platform UUID(s), comma-joined; energy_platform_services keys on them
      - { name: bill-period, value: "" } # YYYY-MM bill-RUN month; empty => current month
      - { name: rebill, value: auto } # auto | force | off
      - { name: gentrack-bill-numbers, value: "" } # diagnostic only here — scope for the re-send, never a trigger
  templates:
    - name: check
      inputs:
        parameters:
          - { name: account-numbers }
          - { name: account-ids }
          - { name: bill-period, value: "" }
          - { name: rebill, value: auto }
          # Gates nothing here. Taken so the warning below can fire; see the header.
          - { name: gentrack-bill-numbers, value: "" }
          - {
              name: pg-url,
              value: "postgres://uw_admin@billing-rds.c4jv4shioc7c.eu-west-1.rds.amazonaws.com:5432/bills?sslmode=require",
            }
          - { name: pg-secret, value: uw-billing-secrets }
          - { name: pg-password-key, value: uwadmin.password }
          - { name: db-type, value: postgres }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - {
              name: query-pg-image,
              value: "registry.uw.systems/dev-enablement/query-pg:main",
            }
          - { name: runner-sa, value: default }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: log-level, value: info }
          - { name: timeout, value: 5m }
          - { name: job-active-deadline, value: 7m }
          - { name: job-ttl, value: 24h }
      outputs:
        artifacts:
          # The Job's whole log stream, which carries the energy rows printed
          # below — exec-kube strips only the ARGO_RESULT_ line from it.
          - name: logs
            from: "{{steps.billing.outputs.artifacts.logs}}"
        parameters:
          - name: do-reset
            valueFrom:
              expression: "sprig.fromJson(steps.billing.outputs.parameters.result).do_reset"
          - name: do-reprocess
            valueFrom:
              expression: "sprig.fromJson(steps.billing.outputs.parameters.result).do_reprocess"
          - name: bill-period
            valueFrom:
              expression: "sprig.fromJson(steps.billing.outputs.parameters.result).bill_period"
          - name: blob-period
            valueFrom:
              expression: "sprig.fromJson(steps.billing.outputs.parameters.result).blob_period"
      steps:
        - - name: billing
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: job-name, value: check-rebill }
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['job-active-deadline']).Seconds())}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          serviceAccountName: {{inputs.parameters.runner-sa}}
                          imagePullSecrets:
                            - name: {{inputs.parameters.image-pull-secret}}
                          restartPolicy: Never
                          containers:
                            - name: check
                              image: {{inputs.parameters.query-pg-image}}
                              imagePullPolicy: Always
                              command: [sh, -c]
                              args:
                                - |
                                  set -eu
                                  ACCTS="{{inputs.parameters.account-numbers}}"
                                  IDS="{{inputs.parameters.account-ids}}"
                                  PERIOD="{{inputs.parameters.bill-period}}"
                                  MODE="{{inputs.parameters.rebill}}"
                                  BILL_NUMBERS="{{inputs.parameters.gentrack-bill-numbers}}"

                                  # An empty list would make btrim('')::uuid raise; filtering it out
                                  # instead would read as "no energy data" and buy a reprocess that
                                  # takes the better part of an hour. Fail on the input.
                                  [ -n "$IDS" ] || { echo "account-ids is empty; the energy check cannot run"; exit 1; }

                                  # What a reset would destroy, every period rather than just the one
                                  # being billed: reset is not period-aware. Printed, not captured —
                                  # these rows ride back in the `logs` artifact, while
                                  # ARGO_RESULT_OUTPUT below keeps the decision on the result channel.
                                  /app/executor --format ndjson --output /tmp/eps.ndjson --query "
                                    SELECT * FROM public.energy_platform_services
                                    WHERE account_id IN (SELECT btrim(x)::uuid::text FROM unnest(string_to_array('$IDS', ',')) AS t(x))
                                    ORDER BY billing_period_start DESC, account_id"
                                  echo "-- energy_platform_services for [$IDS], all periods --"
                                  if [ -s /tmp/eps.ndjson ]; then
                                    cat /tmp/eps.ndjson
                                    echo "rows: $(wc -l < /tmp/eps.ndjson | tr -d ' ')"
                                  else
                                    echo "(no rows — this account has no energy data in billing at all)"
                                  fi
                                  echo

                                  # Both periods, both counts and both decisions in one query.
                                  # Aggregate-only CTEs return a row even when nothing matches, so
                                  # "no bills" and "no energy" are counts of 0 rather than absent
                                  # rows — hence no outer join and no GROUP BY. The decisions are
                                  # pure functions of those counts, so they belong here: running this
                                  # query by hand is an exact preview of what a run will decide.
                                  # --result-path, NOT --result-marker: rebill=force overrides the
                                  # decision below, and exec-kube honours the FIRST
                                  # ARGO_RESULT_OUTPUT= line, so the executor must not emit one.
                                  /app/executor --format csv --output /tmp/out.csv \
                                    --result-expr 'row' --result-path /tmp/state.json \
                                    --query "
                                    WITH p AS (
                                      SELECT CASE WHEN '$PERIOD' = '' THEN date_trunc('month', now())::date
                                                  ELSE to_date('$PERIOD', 'YYYY-MM') END AS bill_run
                                    ),
                                    a AS (
                                      SELECT count(DISTINCT btrim(x)::uuid::text)     AS accounts,
                                             array_agg(DISTINCT btrim(x)::uuid::text) AS ids
                                      FROM unnest(string_to_array('$IDS', ',')) AS t(x)
                                    ),
                                    n AS (
                                      SELECT count(*) FILTER (WHERE b.available = false) AS committed,
                                             count(*)                                    AS existing
                                      FROM p, public.bill_number b
                                      WHERE b.account_number IN (SELECT btrim(x) FROM unnest(string_to_array('$ACCTS', ',')) AS t(x))
                                        AND b.billing_period_start >= (p.bill_run - interval '1 month')
                                        AND b.billing_period_start <  p.bill_run
                                    ),
                                    e AS (
                                      SELECT count(DISTINCT s.account_id) FILTER (
                                               WHERE s.billing_period_start >= (p.bill_run - interval '1 month')
                                                 AND s.billing_period_start <  p.bill_run)  AS eps_accounts,
                                             count(*)                                       AS eps_any
                                      FROM p, a, public.energy_platform_services s
                                      WHERE s.account_id = ANY(a.ids)
                                    )
                                    SELECT
                                      CASE WHEN n.committed > 0 THEN 'true' ELSE 'false' END AS do_reset,
                                      CASE WHEN n.committed > 0 OR e.eps_accounts < a.accounts
                                           THEN 'true' ELSE 'false' END                      AS do_reprocess,
                                      to_char(p.bill_run, 'YYYY-MM')                         AS bill_period,
                                      to_char(p.bill_run - interval '1 month', 'YYYY-MM')    AS blob_period,
                                      CASE WHEN e.eps_accounts < a.accounts THEN 'true' ELSE 'false' END AS energy_gap,
                                      n.committed, n.existing, e.eps_accounts, e.eps_any, a.accounts
                                    FROM p, a, n, e"
                                  cat /tmp/out.csv

                                  # By name, not position: the executor writes the row as a JSON
                                  # object, so a column moving cannot swap two values.
                                  read_field() { jq -r --arg k "$1" '.[$k]' /tmp/state.json; }
                                  do_reset=$(read_field do_reset)
                                  do_reprocess=$(read_field do_reprocess)
                                  bill_period=$(read_field bill_period)
                                  blob_period=$(read_field blob_period)
                                  energy_gap=$(read_field energy_gap)
                                  committed=$(read_field committed)
                                  existing=$(read_field existing)
                                  eps_accounts=$(read_field eps_accounts)
                                  eps_any=$(read_field eps_any)
                                  accounts=$(read_field accounts)

                                  case "$do_reset,$do_reprocess" in
                                    true,true|true,false|false,true|false,false) ;;
                                    *) echo "could not read the decision from the query above (got [$do_reset,$do_reprocess]) — refusing to guess at reset/reprocess"; exit 1 ;;
                                  esac

                                  echo "accounts [$ACCTS]: bill run $bill_period, billing the period $blob_period"
                                  echo "bill_number for $blob_period: $existing row(s), $committed committed"
                                  echo "energy_platform_services for $blob_period: $eps_accounts of $accounts account(s) have rows ($eps_any across all periods)"

                                  # The query already decided; this only names the term that fired.
                                  if [ "$do_reset" = true ]; then
                                    why="a committed bill for $blob_period forces a reset, which deletes the energy data"
                                  elif [ "$energy_gap" = true ]; then
                                    why="billing holds no energy data for $blob_period"
                                  else
                                    why="a bill for $blob_period can be built from what billing already holds"
                                  fi

                                  # Rows for other periods but none for this one is also what a wrong
                                  # period convention would look like.
                                  if [ "$energy_gap" = true ] && [ "$eps_any" != "0" ]; then
                                    echo "note: energy rows exist for other periods but not $blob_period — confirm that is missing data, not a period-convention mismatch"
                                  fi
                                  # Reset is account-wide, a named scope is not: every other period
                                  # the reset deletes stays deleted unless its numbers are named too.
                                  if [ "$do_reset" = true ] && [ -n "$BILL_NUMBERS" ]; then
                                    echo "warning: reset deletes EVERY bill this account has, but the re-send is narrowed to [$BILL_NUMBERS] — name the numbers of any other period that matters"
                                  fi

                                  case "$MODE" in
                                    force)
                                      do_reset=true
                                      do_reprocess=true
                                      echo "rebill=force: overriding the state above"
                                      ;;
                                    auto)
                                      echo "$why"
                                      ;;
                                    off)
                                      if [ "$do_reset" = true ]; then
                                        echo "a committed bill holds $blob_period; its number can be neither reused nor deleted, so this account cannot be billed for that period again without a reset"
                                        echo "re-run with rebill=force — note reset is NOT period-aware and deletes EVERY bill the account has, not just $blob_period's"
                                        exit 1
                                      fi
                                      if [ "$do_reprocess" = true ]; then
                                        echo "rebill=off, but a re-send is due: $why"
                                        echo "re-run with rebill=auto — that re-sends energy data only, and deletes nothing"
                                        exit 1
                                      fi
                                      echo "rebill=off: $why"
                                      ;;
                                    *)
                                      echo "unknown rebill mode '$MODE'; want auto, force or off"
                                      exit 1
                                      ;;
                                  esac

                                  # The decision as it stands after `force`, as JSON — the outputs
                                  # read it back by field with sprig.fromJson.
                                  printf 'ARGO_RESULT_OUTPUT=%s\n' "$(jq -nc \
                                    --arg reset "$do_reset" --arg reprocess "$do_reprocess" \
                                    --arg bill "$bill_period" --arg blob "$blob_period" \
                                    '{do_reset:$reset,do_reprocess:$reprocess,bill_period:$bill,blob_period:$blob}')"
                              env:
                                - { name: DB_TYPE, value: {{inputs.parameters.db-type}} }
                                - { name: LOG_LEVEL, value: {{inputs.parameters.log-level}} }
                                - { name: CONNECTION_STRING, value: "{{inputs.parameters.pg-url}}" }
                                # The password the DSN leaves out; pgx reads PGPASSWORD when the
                                # DSN carries none.
                                - name: PGPASSWORD
                                  valueFrom:
                                    secretKeyRef:
                                      name: {{inputs.parameters.pg-secret}}
                                      key: {{inputs.parameters.pg-password-key}}
