# =============================================================================
# reset-bills-for-account — clear billing's records so accounts can be re-billed
# =============================================================================
# An account can only be billed once per period. Clear what the previous run left
# behind and the pipeline runs as if for the first time. Three stores, three Jobs
# in parallel — they share no data — all dispatched into dev-merit/billing:
#
#   ...-rds              billing-rds (postgres): bills, bill numbers, summaries,
#                        transactions, energy-platform services + their rows
#   ...-crdb             billing crdb (pg wire): accounts, segments,
#                        segment_group_history, segment_groups
#   ...-payment-details  finance-customer-payment-details mongo: the account's
#                        payment document
#
# ⚠️ PAYMENT DETAILS is what makes invoice reporting reliable. That api consumes
# bill extracts, so each run moves the account's document forward (later
# collectiondate, new etag). Re-bill the same period against a stale document and
# the api crashes, taking invoice-due-date-api with it: the bill never leaves
# billed for committing, so the invoice is produced but never reported — a run
# that looks half-finished rather than one that failed. Deleting the document puts
# the account back to never-billed; the next extract writes it again.
#
# INPUT. Account NUMBERS only, comma-separated. Each command derives its own store
# key from the number (the frozen UUIDv5 account-platform mints), so no id list is
# passed around and they cannot drift apart.
#
# IDEMPOTENT. Ids that resolve to nothing skip their tables — a run against clean
# accounts deletes nothing and exits 0. No "should we reset?" branch on purpose:
# running it unconditionally has fewer failure modes than deciding first.
#
# DRY RUN. `dry-run=true` (the default) logs the row count each delete WOULD
# affect and deletes nothing. A safety gate, not a decision point — counts go to
# stderr, exit code is 0 either way, nothing downstream can branch on them.
#
# ⚠️ NOT PERIOD-AWARE. `bills` resolves invoice numbers from public.bill_number by
# account_number with NO period filter: it deletes EVERY bill the account has.
# Right for a test account being re-billed, wrong where earlier periods matter.
#
# DNS. Go fires the A and AAAA queries in parallel out of one socket, and
# conntrack's DNAT race drops one of them — the lookup then stalls 10s and reports
# the trailing search suffix's NXDOMAIN, so lost packets read as `no such host`
# against a Service that is perfectly healthy. `single-request-reopen` serialises
# the two so they cannot collide; the rest keeps a retry aimed at the right suffix.
# STOPGAP: belongs in exec-kube, which is the only thing that sees every Job.
#
# Reference-only: consumed by step-billing-bill-account via templateRef.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-billing-reset
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI. DESTRUCTIVE — delete the accounts' bills
      (billing-rds), segments (billing crdb) and payment details
      (finance-customer-payment-details mongo) so they can be billed again.
      Defaults to dry-run. Consumed by step-billing-bill-account via templateRef.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: reference-only
    data.uw.systems/system: billing
spec:
  serviceAccountName: workflow-step-executor
  templates:
    # -------------------------------------------------------------------------
    # reset-bills-for-account — all three stores, in parallel. The template callers
    # want; the three below are its parts, and still render as their own nodes in
    # the UI.
    # -------------------------------------------------------------------------
    - name: reset-bills-for-account
      inputs:
        parameters:
          - { name: account-numbers } # UW customer account number(s), comma-separated
          - { name: dry-run, value: "true" } # true => report row counts, delete nothing
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - {
              name: pg-url,
              value: "postgres://uw_admin@billing-rds.c4jv4shioc7c.eu-west-1.rds.amazonaws.com:5432/bills?sslmode=require",
            }
          - {
              name: crdb-dsn,
              value: "postgresql://root@cockroachdb-proxy:26257/bo?sslmode=verify-full",
            }
          - {
              name: payment-details-mongo-address,
              value: "mongodb://finance-customer-payment-details-mongodb.billing.svc.cluster.local:27017",
            }
          - { name: log-level, value: info }
      steps:
        - - name: reset-bills-for-account-rds
            template: reset-bills-for-account-rds
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-numbers,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - { name: dry-run, value: "{{inputs.parameters.dry-run}}" }
                - { name: pg-url, value: "{{inputs.parameters.pg-url}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }

          # parallel with the rds child: same namespace, different store
          - name: reset-bills-for-account-crdb
            template: reset-bills-for-account-crdb
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-numbers,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - { name: dry-run, value: "{{inputs.parameters.dry-run}}" }
                - { name: crdb-dsn, value: "{{inputs.parameters.crdb-dsn}}" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }

          # parallel with both: same namespace, a third store
          - name: reset-bills-for-account-payment-details
            template: reset-bills-for-account-payment-details
            arguments:
              parameters:
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: account-numbers,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - { name: dry-run, value: "{{inputs.parameters.dry-run}}" }
                - {
                    name: payment-details-mongo-address,
                    value: "{{inputs.parameters.payment-details-mongo-address}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }

    # -------------------------------------------------------------------------
    # reset-bills-for-account-rds — delete the accounts' rows in billing-rds,
    # from dev-merit/billing.
    #
    # The two tables guarded by a delete trigger (bills, bill_number) go last,
    # each inside a transaction that disables the trigger, deletes and re-enables
    # it, so a failure leaves the guard in place.
    #
    # CONNECTION. PG_URL carries everything but the password, which arrives on its
    # own as PGPASSWORD; pgx merges env settings underneath the DSN's, so the
    # field the URL leaves empty is the one the Secret fills.
    # -------------------------------------------------------------------------
    - name: reset-bills-for-account-rds
      inputs:
        parameters:
          - { name: account-numbers }
          - { name: dry-run, value: "true" }
          # Password-free by design — it is supplied separately, see CONNECTION.
          - {
              name: pg-url,
              value: "postgres://uw_admin@billing-rds.c4jv4shioc7c.eu-west-1.rds.amazonaws.com:5432/bills?sslmode=require",
            }
          # uw_admin's password, taken from the one workload that still connects as
          # it.
          - { name: pg-secret, value: uw-billing-secrets }
          - { name: pg-password-key, value: uwadmin.password }
          - { name: rds-use-password-auth, value: "true" }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - {
              name: reset-image,
              value: "registry.uw.systems/billing/reset:main",
            }
          - { name: runner-sa, value: default }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: log-level, value: info }
          - { name: timeout, value: 10m }
          - { name: job-active-deadline, value: 12m }
          - { name: job-ttl, value: 24h }
      steps:
        - - name: billing-rds
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: job-name, value: reset-bills-for-account-rds }
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['job-active-deadline']).Seconds())}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          serviceAccountName: {{inputs.parameters.runner-sa}}
                          imagePullSecrets:
                            - name: {{inputs.parameters.image-pull-secret}}
                          restartPolicy: Never
                          # See DNS at the top of this file.
                          dnsConfig:
                            options:
                              - { name: single-request-reopen }
                              - { name: ndots, value: "1" }
                              - { name: timeout, value: "2" }
                              - { name: attempts, value: "3" }
                          containers:
                            - name: reset-bills-for-account-rds
                              image: {{inputs.parameters.reset-image}}
                              imagePullPolicy: Always
                              command: [sh, -c]
                              args:
                                - |
                                  set -eu
                                  # Account numbers only; reset derives every id it needs from them.
                                  printf '%s' "{{inputs.parameters.account-numbers}}" | tr ',' '\n' > /tmp/accounts.txt
                                  /svc bills --input /tmp/accounts.txt --dry-run={{inputs.parameters.dry-run}}
                              env:
                                - { name: INPUT, value: /tmp/accounts.txt }
                                - { name: PG_URL, value: "{{inputs.parameters.pg-url}}" }
                                # The password the DSN leaves out. PGPASSWORD is what pgx reads;
                                - name: PGPASSWORD
                                  valueFrom:
                                    secretKeyRef:
                                      name: {{inputs.parameters.pg-secret}}
                                      key: {{inputs.parameters.pg-password-key}}
                                - { name: RDS_USE_PASSWORD_AUTH, value: "{{inputs.parameters.rds-use-password-auth}}" }
                                - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }

    # -------------------------------------------------------------------------
    # reset-bills-for-account-crdb — dev-merit/billing: delete the accounts'
    # segments in billing crdb.
    #
    # CONNECTION. Cockroach cert auth is the same three-variable contract as the
    # other crdb queriers (step-account-resolve-account,
    # step-energy-resolve-service-identifiers): CA_AUTH_KEY from a Secret,
    # CA_PROFILE + CA_ADDRESS naming the CA to fetch a client cert from. uwos-go's
    # pgx wrapper does the fetch at startup when the DSN says sslmode=verify-full,
    # so there are no cert files and no volume mounts to wire.
    #
    # billing follows account-platform's naming (Secret `ca-auth-key` / `auth.key`)
    # with the profile and endpoint read from the `ca.config` ConfigMap. The
    # CLIENT profile is the right one here — this is a SQL client connection, not a
    # node joining the cluster. (energy-platform passes ca.node.profile; node certs
    # usually carry client auth too, which is why it works there.)
    #
    # ⚠️ The DSN's username has to be one the CA will issue a client cert for.
    # `root` is what the other dev crdb queriers use; confirm it against
    # dev-merit/billing before a real run.
    # -------------------------------------------------------------------------
    - name: reset-bills-for-account-crdb
      inputs:
        parameters:
          - { name: account-numbers }
          - { name: dry-run, value: "true" }
          - {
              name: crdb-dsn,
              value: "postgresql://root@cockroachdb-proxy:26257/bo?sslmode=verify-full",
            }
          - { name: ca-secret, value: ca-auth-key } # → CA_AUTH_KEY
          - { name: ca-auth-key, value: auth.key } # key within ca-secret
          - { name: ca-config, value: ca.config } # CA profile + endpoint
          - { name: ca-profile-key, value: ca.client.profile } # → CA_PROFILE
          - { name: ca-address-key, value: ca.endpoint } # → CA_ADDRESS
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - {
              name: reset-image,
              value: "registry.uw.systems/billing/reset:main",
            }
          - { name: runner-sa, value: default }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: log-level, value: info }
          - { name: timeout, value: 10m }
          - { name: job-active-deadline, value: 12m }
          - { name: job-ttl, value: 24h }
      steps:
        - - name: billing-crdb # dispatches into billing; -crdb keeps it distinct from its rds sibling
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                # Runs in parallel with the rds sibling in the SAME dev-merit/billing.
                - { name: job-name, value: reset-bills-for-account-crdb }
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['job-active-deadline']).Seconds())}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          serviceAccountName: {{inputs.parameters.runner-sa}}
                          imagePullSecrets:
                            - name: {{inputs.parameters.image-pull-secret}}
                          restartPolicy: Never
                          # See DNS at the top of this file.
                          dnsConfig:
                            options:
                              - { name: single-request-reopen }
                              - { name: ndots, value: "1" }
                              - { name: timeout, value: "2" }
                              - { name: attempts, value: "3" }
                          containers:
                            - name: reset-bills-for-account-crdb
                              image: {{inputs.parameters.reset-image}}
                              imagePullPolicy: Always
                              command: [sh, -c]
                              args:
                                - |
                                  set -eu
                                  printf '%s' "{{inputs.parameters.account-numbers}}" | tr ',' '\n' > /tmp/accounts.txt
                                  /svc segments --input /tmp/accounts.txt --dry-run={{inputs.parameters.dry-run}}
                              env:
                                - { name: INPUT, value: /tmp/accounts.txt }
                                - { name: CRDB_DSN, value: "{{inputs.parameters.crdb-dsn}}" }
                                - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }
                                - name: CA_AUTH_KEY
                                  valueFrom:
                                    secretKeyRef:
                                      name: {{inputs.parameters.ca-secret}}
                                      key: {{inputs.parameters.ca-auth-key}}
                                - name: CA_PROFILE
                                  valueFrom:
                                    configMapKeyRef:
                                      name: {{inputs.parameters.ca-config}}
                                      key: {{inputs.parameters.ca-profile-key}}
                                - name: CA_ADDRESS
                                  valueFrom:
                                    configMapKeyRef:
                                      name: {{inputs.parameters.ca-config}}
                                      key: {{inputs.parameters.ca-address-key}}

    # -------------------------------------------------------------------------
    # reset-bills-for-account-payment-details — dev-merit/billing: delete the
    # accounts' documents in finance-customer-payment-details mongo. See WHY
    # PAYMENT DETAILS above for what the leftover document breaks.
    #
    # CONNECTION. The same four values finance-customer-payment-details-api itself
    # is given — address, db, username, password — because the reset has to be the
    # user the documents were written as. The password is applied via SetAuth
    # rather than embedded in the URI, so it needs no URL-encoding and never
    # appears in a parameter. db is the first half of the api's STORE_NAME
    # ("app/payment" in dev-merit, "customer/payment" in prod) and doubles as the
    # auth source.
    #
    # The mongo is a 3-node replica set behind a headless Service; the address is
    # that Service, exactly as the api has it, and the driver discovers the members.
    # -------------------------------------------------------------------------
    - name: reset-bills-for-account-payment-details
      inputs:
        parameters:
          - { name: account-numbers }
          - { name: dry-run, value: "true" }
          - {
              name: payment-details-mongo-address,
              value: "mongodb://finance-customer-payment-details-mongodb.billing.svc.cluster.local:27017",
            }
          - { name: payment-details-mongo-db, value: app }
          - { name: payment-details-mongo-username, value: app }
          - {
              name: payment-details-mongo-secret,
              value: finance-customer-payment-details-mongodb,
            }
          - { name: payment-details-mongo-password-key, value: app.password }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - {
              name: reset-image,
              value: "registry.uw.systems/billing/reset:main",
            }
          - { name: runner-sa, value: default }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: log-level, value: info }
          - { name: timeout, value: 10m }
          - { name: job-active-deadline, value: 12m }
          - { name: job-ttl, value: 24h }
      steps:
        - - name: billing-payment-details
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - {
                    name: job-name,
                    value: reset-bills-for-account-payment-details,
                  }
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['job-active-deadline']).Seconds())}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          serviceAccountName: {{inputs.parameters.runner-sa}}
                          imagePullSecrets:
                            - name: {{inputs.parameters.image-pull-secret}}
                          restartPolicy: Never
                          # See DNS at the top of this file.
                          dnsConfig:
                            options:
                              - { name: single-request-reopen }
                              - { name: ndots, value: "1" }
                              - { name: timeout, value: "2" }
                              - { name: attempts, value: "3" }
                          containers:
                            - name: reset-bills-for-account-payment-details
                              image: {{inputs.parameters.reset-image}}
                              imagePullPolicy: Always
                              command: [sh, -c]
                              args:
                                - |
                                  set -eu
                                  printf '%s' "{{inputs.parameters.account-numbers}}" | tr ',' '\n' > /tmp/accounts.txt
                                  /svc payment-details --input /tmp/accounts.txt --dry-run={{inputs.parameters.dry-run}}
                              env:
                                - { name: INPUT, value: /tmp/accounts.txt }
                                - { name: MONGO_ADDRESS, value: "{{inputs.parameters.payment-details-mongo-address}}" }
                                - { name: MONGO_DB, value: "{{inputs.parameters.payment-details-mongo-db}}" }
                                - { name: MONGO_USERNAME, value: "{{inputs.parameters.payment-details-mongo-username}}" }
                                - name: MONGO_PASSWORD
                                  valueFrom:
                                    secretKeyRef:
                                      name: {{inputs.parameters.payment-details-mongo-secret}}
                                      key: {{inputs.parameters.payment-details-mongo-password-key}}
                                - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }
