# =============================================================================
# produce-fwf — fabricate a FWF for an account, upload it, emit its filename
# =============================================================================
# One dispatched Job in the billing namespace does two things in sequence:
#
#   initContainer  fabricate   fabricate-migrated-fwf (/svc) writes ONE
#                              UWCDATA1_D…_T….NNN.snappy into a shared emptyDir.
#                              The name is minted by the tool, never by us.
#   container      upload      upload-s3 pushes that .snappy to the bill-extracts
#                              bucket (SSE=AES256, mandatory), then emits the
#                              minted segment name as the step result.
#
# WHY ONE JOB (fused). upload-s3 reads the `billing-bill-extracts` Secret, which
# only exists in the billing namespace, so the upload must run there. exec-kube
# dispatches a Job and captures only its OUTPUT — it cannot inject a file INTO a
# separately-dispatched Job — so fabricate and upload share one pod's emptyDir
# rather than trying to hand a file between two Jobs.
#
# DRY RUN. `dry-run=true` fabricates the FWF for real but SKIPS the S3 upload
# (the segment name is still emitted). This is the safe "produce the FWF without
# uploading" path — nothing lands in the bucket, so no segment is ever created.
#
# OUTPUT. `filename` — the minted segment name WITHOUT the `.snappy` suffix (the
# authoritative segment name/id for bill-run). The uploaded object key and the
# s3-uploader register call use `<filename>.snappy`.
#
# INVOICE NUMBER. `invoice-number` is effectively required here: with it unset,
# /svc calls invoice-preferences-api (localhost:8090), which is not reachable
# from this Job — supply a free number (see PLAN.md open item #2).
#
# Reference-only: consumed by step-billing-bill-account via templateRef.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-billing-produce-fwf
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI. Fabricate a FWF for accounts and upload it
      (skipped when dry-run=true); emits the segment name. Consumed by
      step-billing-bill-account via templateRef.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: reference-only
    data.uw.systems/system: billing
spec:
  entrypoint: produce
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: account-numbers } # UW customer account number(s), comma-separated; all fabricated into ONE FWF
      - { name: invoice-number, value: "" } # see INVOICE NUMBER note — used only when invoice-map is empty
      - { name: invoice-map, value: "" } # 'accountNumber<TAB>invoiceNumber' line(s) from set-invoice-number; when set, used verbatim as fabricate's input (per-account numbers) and takes precedence over account-numbers/invoice-number
      - { name: bill-period, value: "" } # YYYY-MM; empty => current month
      - { name: engineer-visit, value: "false" }
      - { name: dry-run, value: "false" } # true => fabricate only, skip the S3 upload
  templates:
    - name: produce
      inputs:
        parameters:
          - { name: account-numbers }
          - { name: invoice-number, value: "" }
          - { name: invoice-map, value: "" }
          - { name: bill-period, value: "" }
          - { name: engineer-visit, value: "false" }
          - { name: dry-run, value: "false" }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - {
              name: fwf-image,
              value: "registry.uw.systems/billing/fabricate-migrated-fwf:main",
            }
          - {
              name: upload-s3-image,
              value: "registry.uw.systems/dev-enablement/upload-s3:main",
            }
          - { name: bucket, value: billing-bill-extracts-dev }
          - { name: s3-secret, value: billing-bill-extracts }
          - { name: sse, value: AES256 }
          - { name: runner-sa, value: default }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: aws-region, value: eu-west-1 }
          - { name: log-level, value: info }
          - { name: timeout, value: 10m }
          - { name: job-active-deadline, value: 12m }
          - { name: job-ttl, value: 24h }
      outputs:
        parameters:
          - name: filename # segment name, WITHOUT the .snappy suffix
            valueFrom:
              parameter: "{{steps.billing.outputs.parameters.result}}"
      steps:
        - - name: billing
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    metadata:
                      generateName: produce-fwf-
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['job-active-deadline']).Seconds())}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          serviceAccountName: {{inputs.parameters.runner-sa}}
                          imagePullSecrets:
                            - name: {{inputs.parameters.image-pull-secret}}
                          restartPolicy: Never
                          volumes:
                            - name: work
                              emptyDir: {}
                          # fabricate runs to completion first, leaving the minted
                          # .snappy (and its name) in the shared /work volume.
                          initContainers:
                            - name: fabricate
                              image: {{inputs.parameters.fwf-image}}
                              imagePullPolicy: Always
                              command: [sh, -c]
                              args:
                                - |
                                  set -eu
                                  # Prefer the per-account map from set-invoice-number (accountNumber<TAB>invoiceNumber,
                                  # extra columns ignored); else one bare account per line + INVOICE_NUMBER/API.
                                  # FIXME: invoice-map is inlined as a parameter, so it holds ONE account —
                                  # a multi-line map breaks this manifest's YAML. Wants an input artifact
                                  # mounted as a file; see the FIXME in step-executor-remote-namespace.
                                  if [ -n "{{inputs.parameters.invoice-map}}" ]; then
                                    printf '%s\n' "{{inputs.parameters.invoice-map}}" > /work/accounts.txt
                                  else
                                    printf '%s' "{{inputs.parameters.account-numbers}}" | tr ',' '\n' > /work/accounts.txt
                                  fi
                                  cd /work
                                  /svc
                                  # capture the single minted filename for the upload container
                                  basename "$(ls -1 /work/*.snappy | head -n 1)" > /work/name
                                  echo "fabricated $(cat /work/name)"
                              env:
                                - { name: INPUT, value: /work/accounts.txt }
                                - { name: INVOICE_NUMBER, value: "{{inputs.parameters.invoice-number}}" }
                                - { name: BILL_PERIOD, value: "{{inputs.parameters.bill-period}}" }
                                - { name: ENGINEER_VISIT, value: "{{inputs.parameters.engineer-visit}}" }
                                - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }
                              volumeMounts:
                                - { name: work, mountPath: /work }
                          containers:
                            - name: upload
                              image: {{inputs.parameters.upload-s3-image}}
                              imagePullPolicy: Always
                              command: [sh, -c]
                              args:
                                - |
                                  set -eu
                                  name=$(cat /work/name)
                                  segment=${name%.snappy}
                                  if [ "{{inputs.parameters.dry-run}}" = "true" ]; then
                                    echo "dry-run: fabricated $name, skipping S3 upload"
                                  else
                                    FILE="/work/$name" KEY="$name" /app/executor
                                  fi
                                  # emit the segment name (no .snappy) as the step result
                                  echo "ARGO_RESULT_OUTPUT=$segment"
                              env:
                                - { name: BUCKET, value: "{{inputs.parameters.bucket}}" }
                                - { name: SSE, value: "{{inputs.parameters.sse}}" }
                                - { name: AWS_REGION, value: "{{inputs.parameters.aws-region}}" }
                                - { name: TIMEOUT, value: "{{inputs.parameters.timeout}}" }
                                - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }
                                # billing-bill-extracts stores the pair under aws.accessKey /
                                # aws.secretKey — remap to the SDK's standard names.
                                - name: AWS_ACCESS_KEY_ID
                                  valueFrom:
                                    secretKeyRef:
                                      name: {{inputs.parameters.s3-secret}}
                                      key: aws.accessKey
                                - name: AWS_SECRET_ACCESS_KEY
                                  valueFrom:
                                    secretKeyRef:
                                      name: {{inputs.parameters.s3-secret}}
                                      key: aws.secretKey
                              volumeMounts:
                                - { name: work, mountPath: /work }
