# transaction-log-snapshot — dump the accounts' rows from BigQuery's committed
# transaction log for review. Asserts nothing; only a credentials or query error
# turns it red. Called either side of Commit, `phase` apart (it names the Job).
#
# One query for ALL accounts: every BigQuery query is billed, so this is not
# worth paying N times for. `_account` anchor rows come from the id list rather
# than the table, so an account with no rows is counted rather than invisible.
#
# ⚠️ `row` is an escaped JSON STRING here, where the Postgres snapshots return a
# nested object — TO_JSON_STRING has no jsonb to return.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-billing-transaction-log-snapshot
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI. Read-only. Dumps the accounts' rows from
      BigQuery's billing.committed_transaction_log for review — it asserts
      nothing and fails only on a credentials or query error. Called either side
      of Commit by step-billing-bill-run.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: reference-only
    data.uw.systems/system: billing
    data.uw.systems/capability: bill-run
spec:
  entrypoint: snapshot
  serviceAccountName: workflow-step-executor
  templates:
    - name: snapshot
      inputs:
        parameters:
          - { name: account-ids } # account-platform UUID(s), comma-joined; the log keys on them
          - { name: phase, value: manual } # before | after; only names the remote Job
          - { name: wait-for-row, value: 0s } # wait this long for a row newer than `since`, then dump regardless
          - { name: since, value: "1970-01-01T00:00:00Z" } # what "newer" means for the wait above
          - { name: gcp-project-id, value: uw-finance-dev }
          - {
              name: table,
              value: "uw-finance-dev.billing.committed_transaction_log",
            }
          - { name: gcp-secret, value: billing-finance-dev-bigquery-secrets }
          - { name: gcp-secret-key, value: billing-dataset_gcp_service_account }
          # query-bq's own default path; keep the mount and this in step.
          - { name: gcp-secret-path, value: /app/secrets }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - { name: runner-sa, value: default }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: log-level, value: info }
          - { name: poll-interval, value: "60" } # seconds between polls; each one is a billed query
          # Every account asked for holds a row created at or after `since`.
          - name: fresh-expr
            value: "len(uniq(map(filter(rows, .fresh), .account_id))) == len(filter(rows, ._table == '_account'))"
          - { name: heartbeat, value: "60" } # seconds between "still waiting" lines; 0 silences them
          # The Job's deadline is the wait plus this buffer, so widening the wait
          # cannot outlive it.
          - { name: job-buffer, value: 5m }
          - { name: job-ttl, value: 24h }
      steps:
        - - name: billing
            templateRef: { name: step-query, template: bq }
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - {
                    name: job-name,
                    value: "transaction-log-{{inputs.parameters.phase}}",
                  }
                - {
                    name: gcp-project-id,
                    value: "{{inputs.parameters.gcp-project-id}}",
                  }
                - {
                    name: gcp-secret,
                    value: "{{inputs.parameters.gcp-secret}}",
                  }
                - {
                    name: gcp-secret-key,
                    value: "{{inputs.parameters.gcp-secret-key}}",
                  }
                - {
                    name: gcp-secret-path,
                    value: "{{inputs.parameters.gcp-secret-path}}",
                  }
                - { name: runner-sa, value: "{{inputs.parameters.runner-sa}}" }
                - {
                    name: image-pull-secret,
                    value: "{{inputs.parameters.image-pull-secret}}",
                  }
                - { name: format, value: ndjson }
                - { name: output, value: /tmp/txlog.ndjson }
                - { name: result-expr, value: "rows" }
                # Only a non-zero wait polls; a zero timeout would expire before
                # the first query, so both follow wait-for-row. Every poll is a
                # billed scan, hence the 60s interval.
                - name: success-expr
                  value: "{{=inputs.parameters['wait-for-row'] == '0s' ? '' : inputs.parameters['fresh-expr']}}"
                - {
                    name: poll-interval,
                    value: "{{inputs.parameters.poll-interval}}",
                  }
                - { name: heartbeat, value: "{{inputs.parameters.heartbeat}}" }
                - name: timeout
                  value: "{{=inputs.parameters['wait-for-row'] == '0s' ? '5m' : inputs.parameters['wait-for-row']}}"
                - name: job-active-deadline
                  value: "{{=string(duration(inputs.parameters['wait-for-row'] == '0s' ? '5m' : inputs.parameters['wait-for-row']) + duration(inputs.parameters['job-buffer']))}}"
                - { name: job-ttl, value: "{{inputs.parameters.job-ttl}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - name: query
                  value: >-
                    SELECT '_account' AS _table, account_id, false AS fresh,
                    TO_JSON_STRING(STRUCT(account_id)) AS row
                    FROM UNNEST(SPLIT('{{inputs.parameters.account-ids}}', ',')) AS account_id
                    UNION ALL
                    SELECT 'committed_transaction_log', t.account_id,
                    t.created_time >= TIMESTAMP('{{inputs.parameters.since}}'),
                    TO_JSON_STRING(t)
                    FROM `{{inputs.parameters.table}}` t
                    WHERE t.account_id IN UNNEST(SPLIT('{{inputs.parameters.account-ids}}', ','))
                    ORDER BY 2, 1
