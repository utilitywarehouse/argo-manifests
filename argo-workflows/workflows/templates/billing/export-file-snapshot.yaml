# export-file-snapshot — dump the bill's line in the finance one-liner export
# for review. Asserts nothing; only an unreadable volume turns it red.
#
# /mnt/cypher is PVC oneliner-batch-nfs, ReadWriteMany, so this mounts the same
# volume the generator writes to instead of needing pods/exec.
#
# Post-export check, the file does not exist until Export writes it.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: step-billing-export-file-snapshot
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Do NOT submit from the UI. Read-only. Mounts the finance one-liner NFS
      volume and dumps the account's record for review — it asserts nothing and
      fails only if the volume cannot be read. Consumed by step-billing-bill-run
      via templateRef.
  labels:
    app.kubernetes.io/component: step
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: reference-only
    data.uw.systems/system: billing
    data.uw.systems/capability: bill-run
spec:
  entrypoint: snapshot
  serviceAccountName: workflow-step-executor
  templates:
    - name: snapshot
      inputs:
        parameters:
          - { name: match } # what to grep for, comma-separated — normally the account number(s), one section each
          - { name: wait-for-record, value: 0s } # wait this long for a match, then report regardless
          - { name: file-glob, value: "*.csv" } # narrow to a date prefix when you know it
          - { name: export-path, value: /mnt/cypher }
          - { name: export-pvc, value: oneliner-batch-nfs }
          - { name: cluster-name, value: dev-merit }
          - { name: target-namespace, value: billing }
          - { name: shell-image, value: "alpine:3.21" }
          - { name: runner-sa, value: default }
          - { name: image-pull-secret, value: dockerhub-key }
          - { name: log-level, value: info }
          - { name: poll-interval, value: "20" } # seconds between checks while waiting
          # The Job's deadline and exec-kube's timeout are both composed from the
          # wait above plus this buffer, so widening the wait cannot outlive them.
          - { name: job-buffer, value: 5m }
          - { name: job-ttl, value: 24h }
      steps:
        - - name: billing
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                # exec-kube must outlive the wait, or it stops managing the Job.
                - {
                    name: timeout,
                    value: "{{=string(duration(inputs.parameters['wait-for-record']) + duration(inputs.parameters['job-buffer']))}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: job-name, value: export-file-snapshot }
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int((duration(inputs.parameters['wait-for-record']) + duration(inputs.parameters['job-buffer'])).Seconds())}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          serviceAccountName: {{inputs.parameters.runner-sa}}
                          imagePullSecrets:
                            - name: {{inputs.parameters.image-pull-secret}}
                          restartPolicy: Never
                          volumes:
                            # The same volume finance-one-liner-file-generator writes to.
                            # RWX, so both mounts coexist; this one never writes.
                            - name: export
                              persistentVolumeClaim:
                                claimName: {{inputs.parameters.export-pvc}}
                                readOnly: true
                          containers:
                            - name: snapshot
                              image: {{inputs.parameters.shell-image}}
                              imagePullPolicy: IfNotPresent
                              volumeMounts:
                                - name: export
                                  mountPath: {{inputs.parameters.export-path}}
                                  readOnly: true
                              command: [sh, -c]
                              args:
                                - |
                                  set -eu
                                  mkdir -p /tmp/snap
                                  DIR="{{inputs.parameters.export-path}}"
                                  GLOB="{{inputs.parameters.file-glob}}"
                                  MATCHES="{{inputs.parameters.match}}"
                                  WAIT={{=int(duration(inputs.parameters['wait-for-record']).Seconds())}}
                                  echo "finance one-liner export snapshot: $DIR/$GLOB containing any of [$MATCHES]"

                                  field() {
                                    # $1 = record, $2 = key. One pair per line, then the value.
                                    echo "$1" | tr '|' '\n' | grep "^$2:" | head -n 1 | cut -d: -f2
                                  }

                                  # $1 = key to grep for, $2 = per-account file suffix. grep exits
                                  # 1 on no match and find propagates it; empty is a state to
                                  # report, not a failure.
                                  collect() {
                                    find "$DIR" -name "$GLOB" -exec grep -lF "$1" {} + 2>/dev/null > "/tmp/snap/files.$2.txt" || true
                                    find "$DIR" -name "$GLOB" -exec grep -hF "$1" {} + 2>/dev/null > "/tmp/snap/records.$2.txt" || true
                                  }

                                  collect_all() {
                                    n=0
                                    for m in $(echo "$MATCHES" | tr ',' ' '); do
                                      n=$(( n + 1 ))
                                      collect "$m" "$n"
                                    done
                                  }

                                  # Every account has a record, or the wait has not paid off yet.
                                  any_missing() {
                                    n=0
                                    for m in $(echo "$MATCHES" | tr ',' ' '); do
                                      n=$(( n + 1 ))
                                      [ -s "/tmp/snap/records.$n.txt" ] || return 0
                                    done
                                    return 1
                                  }

                                  # A delay, not a gate. Waits for the LAST account, not the first.
                                  collect_all
                                  if [ "$WAIT" -gt 0 ] && any_missing; then
                                    echo "waiting up to ${WAIT}s for a record for every account"
                                    deadline=$(( $(date +%s) + WAIT ))
                                    while :; do
                                      any_missing || break
                                      if [ $(date +%s) -ge $deadline ]; then
                                        echo "  nothing more arrived within ${WAIT}s — reporting what is there"
                                        break
                                      fi
                                      sleep {{inputs.parameters.poll-interval}}
                                      collect_all
                                    done
                                  fi

                                  n=0
                                  for m in $(echo "$MATCHES" | tr ',' ' '); do
                                    n=$(( n + 1 ))
                                    echo
                                    echo "=============================================================="
                                    echo "account $m"
                                    echo "=============================================================="

                                    echo "-- files matched --"
                                    if [ -s "/tmp/snap/files.$n.txt" ]; then cat "/tmp/snap/files.$n.txt"; else echo "(none)"; fi

                                    echo
                                    echo "-- records --"
                                    if [ -s "/tmp/snap/records.$n.txt" ]; then
                                      cat "/tmp/snap/records.$n.txt"
                                      echo
                                      echo "-- key fields --"
                                      while IFS= read -r rec; do
                                        [ -n "$rec" ] || continue
                                        echo "BillNumber=$(field "$rec" BillNumber) BillTotal=$(field "$rec" BillTotal) BillComplete=$(field "$rec" BillComplete)"
                                      done < "/tmp/snap/records.$n.txt"
                                      echo "(BillComplete D = complete; compare BillTotal against this account's ledger entry total_amount)"
                                    else
                                      echo "(no record for [$m])"
                                    fi
                                  done

                                  if any_missing; then
                                    echo
                                    echo "-- files searched --"
                                    find "$DIR" -name "$GLOB" 2>/dev/null | head -n 20 || true
                                    echo "if files are listed above, the export ran and the missing key(s) are wrong — check AccountNo in one of those records and re-run with a corrected match parameter"
                                  fi

                                  # exec-kube captures this block as `result`, stripping it from
                                  # the logs. Own directory, not a /tmp glob.
                                  echo
                                  echo ARGO_RESULT_BEGIN
                                  cat /tmp/snap/records.*.txt
                                  echo ARGO_RESULT_END
                              env:
                                - { name: LOG_LEVEL, value: {{inputs.parameters.log-level}} }
