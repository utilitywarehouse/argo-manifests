# legacy-account data export — the legacy account store, 3.9M rows from one table.
#
# Holds the accounts account_api does not, plus columns account_api has no
# equivalent for: psr_flag (priority services register), billing_group,
# referrer_type, creation_reason. is_staff / is_business / join_date exist in
# both, but are far better populated in account_api.
#
# SCOPE: `legacy_account` only. account_ids and platform_customer (2.23M each)
# are id mappings the account store already covers — it carries both account_id
# and account_number — and two more tables are empty.
#
# ⚠️ CARRIES A `password` COLUMN — 1.75M rows have one, 0-14 chars across 15
# distinct lengths, which is not the shape of any hash. Also payment_details,
# date_of_birth_1/2, psr_flag and free-text comments. A SQL source has no column
# allow-list, so the table goes whole: whoever can read the bucket can read those
# columns. dev-aws data is fabricated; prod would not be.
#
# CONNECTION. Same cluster, user and CA as data-export-account-api — only the
# database in the DSN differs. One adapter DSN means one database, hence a
# separate workflow.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: data-export-legacy-account
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      legacy-account account store export from account-platform

  labels:
    workflows.argoproj.io/creator: qe
    data.uw.systems/system: legacy-account
    data.uw.systems/capability: data-export
spec:
  schedules:
    - "0 3 * * *" # an hour after account-api: same source cluster, don't stack them
  timezone: Europe/London
  suspend: true # manual-only until a schedule is intentionally enabled
  concurrencyPolicy: Forbid
  workflowSpec:
    serviceAccountName: workflow-step-executor
    workflowMetadata:
      labels:
        data.uw.systems/system: legacy-account
        data.uw.systems/capability: data-export
    workflowTemplateRef:
      name: step-data-orchestrator-runner
    arguments:
      parameters:
        - { name: mode, value: export }
        - { name: run-type, value: RUN_TYPE_EXPORT }
        - { name: system-key, value: legacy_account }
        - { name: label, value: legacy-account-export }
        - { name: adapter-driver, value: cockroachdb }
        - name: adapter-dsn
          value: "postgresql://accounts@cockroachdb-proxy:26257/legacy_account?sslmode=verify-full"
        - { name: ca-secret, value: ca-auth-key }

        - { name: image-pull-secret, value: dockerhub-key-fg5t2k8k7t }

        - { name: entities, value: "legacy_account" }

        # 3.9M rows, chunked on the primary key `rowid` at the 100k default.
        - { name: timeout, value: 90m }
        - { name: job-active-deadline, value: 100m }
