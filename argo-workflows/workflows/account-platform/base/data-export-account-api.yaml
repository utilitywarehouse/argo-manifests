# account-api data export — the account store, 3.5M rows from one table.
#
# SCOPE: `accounts` only. persons (4.2M) and its join table account_persons
# (4.3M) carry name, date of birth, email, phone and address; business_details
# and sic_codes are lookups. A SQL source has no column allow-list — `fields`
# narrows only the document-store drivers — so a table comes whole or not at all.
#
# ⚠️ NOT EVERY ACCOUNT. legacy_account holds the accounts this one does not, plus
# psr_flag and the other legacy-only columns. Separate database, separate DSN,
# separate workflow: data-export-legacy-account.
#
# ⚠️ PICK THE DATABASE CAREFULLY. The cluster also carries account_api_temp and
# account_api_20250214, a snapshot frozen 2025-02-20 and hundreds of thousands of
# rows behind. All three answer the same queries, so the wrong one exports
# quietly and wrongly.
#
# CONNECTION. Client-cert auth, as step-account-resolve-account does it: the DSN
# names the `accounts` user and carries no password, and the adapter mints a
# client cert from the in-cluster CA using ca-auth-key. The runner's ca-address /
# ca-profile defaults match this namespace, so only the secret needs naming.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: data-export-account-api
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      account-api account store export from account-platform

  labels:
    workflows.argoproj.io/creator: qe
    data.uw.systems/system: account-api
    data.uw.systems/capability: data-export
spec:
  schedules:
    - "0 2 * * *"
  timezone: Europe/London
  suspend: true # manual-only until a schedule is intentionally enabled
  concurrencyPolicy: Forbid
  workflowSpec:
    serviceAccountName: workflow-step-executor
    workflowMetadata:
      labels:
        data.uw.systems/system: account-api
        data.uw.systems/capability: data-export
    workflowTemplateRef:
      name: step-data-orchestrator-runner
    arguments:
      parameters:
        - { name: mode, value: export }
        - { name: run-type, value: RUN_TYPE_EXPORT }
        - { name: system-key, value: account_api }
        - { name: label, value: account-api-export }
        - { name: adapter-driver, value: cockroachdb }
        - name: adapter-dsn
          value: "postgresql://accounts@cockroachdb-proxy:26257/account_api?sslmode=verify-full"
        - { name: ca-secret, value: ca-auth-key }

        # ⚠️ HASHED NAME — account-platform generates its pull secret with a
        # kustomize secretGenerator, so the suffix changes when the docker
        # credential rotates and this goes ImagePullBackOff. The `default` SA
        # tracks it; `data-orchestrator`, which the Job runs as for the vault AWS
        # role, does not.
        - { name: image-pull-secret, value: dockerhub-key-fg5t2k8k7t }

        # Named, not discovered: discovery lists every BASE TABLE, including the
        # schema_migrations / schema_lock bookkeeping.
        - { name: entities, value: "accounts" }

        # 3.5M rows, chunked on the `accounts` primary key `id` at the 100k
        # default. Past the 30m default, comfortably inside this.
        - { name: timeout, value: 90m }
        - { name: job-active-deadline, value: 100m }
