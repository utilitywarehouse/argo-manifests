# =============================================================================
# flow-gentrack-account-map — gentrack account number → uw account id and number
# =============================================================================
#   in : source                    which system's view of the accounts to use
#        gentrack-account-numbers  comma-separated; empty takes the whole source
#        with-bills                also report which of them have a bill
#        output                    shape of the `mapped` parameter
#   out: mapped            (parameter) the uw account numbers, shaped by output
#        billed            (parameter) gentrack numbers that have a bill; empty
#                                      unless with-bills is true
#        gentrack-accounts (artifact)  JSON array, one entry per account
#
# SOURCES. Both are real, correlated views of the same population, measured on
# dev-merit: service_snapshot holds 111,870 gentrack numbers, the migration
# table 111,463, and 499 of a 500-number sample appear in both. Pick either;
# they do not meaningfully differ.
#
#   service-snapshot  energy-platform CockroachDB. Carries customer_account_id,
#                     which IS the uw_account_id.
#   migration         gentrack-migration Postgres. Carries uw_account_number
#                     directly, alongside the migration statuses.
#
# Each source has one identifier and not the other, which is why the
# account-platform hop stays: it fills in whichever is missing, keyed by id for
# service-snapshot and by account number for migration.
#
# NOT A SOURCE: energy-billing. `account_services` holds 131,178 gentrack
# numbers, but roughly a fifth have an account_id that does not exist in
# account-platform at all — dev seed data with no real account behind it. It is
# a fact to check against, which is what `with-bills` does, not a place to take
# accounts from.
#
# BATCHING. Comma-joining ~111k ids is far past what a parameter can carry, and
# step-query hands its statement to the remote Job as an env var. There is no
# query-file input, so the ids must be inline in the SQL and an artifact cannot
# carry them. Hop 1 tags each row with a bucket, hop 2 folds those into
# fixed-size lists (1,000 ids ≈ 37KB measured), later hops fan out. A short
# pasted list is one chunk.
#
# A remote Job returns only its captured result — the `output` file stays in the
# pod — so hop 1's result-expr is `rows` and that capture is the population.
# max-capture-rows must therefore clear it, and the 10,000 default will not.
#
# EXPECT FEWER RESULTS THAN INPUTS. An id with no row in account-platform is
# dropped rather than failing the run, so `mapped` can be shorter than the
# source. Compare it against the gentrack-accounts artifact.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: flow-gentrack-account-map
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Read-only. Maps gentrack account numbers to uw account ids and numbers,
      from energy's service_snapshot or the gentrack migration table. Paste a
      list to resolve a few, or leave it empty for the whole population. Turn on
      with-bills to also report which of them energy-billing holds a bill for.
  labels:
    app.kubernetes.io/component: flow
    workflows.argoproj.io/creator: qe
    workflows.argoproj.io/invocation: standalone
    data.uw.systems/system: energy-platform
spec:
  entrypoint: resolve
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - name: source
        value: service-snapshot
        enum: [service-snapshot, migration]
        description: >-
          Which system's accounts to map. service-snapshot = energy-platform's
          view, carries the uw account id. migration = the gentrack migration
          table, carries the uw account number. They cover the same population.
      - name: gentrack-account-numbers
        value: ""
        description: >-
          Comma-separated, no spaces or quotes, e.g.
          J20000022403,J20000022430 — leave empty to take the whole source.
      - name: with-bills
        value: "false"
        enum: ["false", "true"]
        description: >-
          Also ask energy-billing which of the accounts have a bill, reported in
          the `billed` output. Off by default because it is an extra pass.
      - name: output
        value: quoted-csv
        enum: [quoted-csv, csv, lines, id-and-number]
        description: >-
          Shape of the `mapped` output. quoted-csv gives '123','456' to drop
          into an IN (...); csv gives 123,456; lines gives one per line;
          id-and-number gives uuid=123 pairs.
      - name: log-level
        value: info
        enum: [trace, debug, info, warn, error]
        description: Verbosity of the remote query Jobs.
      - { name: timeout, value: 5m }
      - { name: teardown, value: "true" }
  templates:
    - name: resolve
      inputs:
        parameters:
          - name: source
            value: service-snapshot
            enum: [service-snapshot, migration]
          - { name: gentrack-account-numbers, value: "" }
          - name: with-bills
            value: "false"
            enum: ["false", "true"]
          - name: output
            value: quoted-csv
            enum: [quoted-csv, csv, lines, id-and-number]

          # Not workflow arguments: mechanics, not choices. The output exprs are
          # named here so `output` can stay an enum — a free-text expr is an
          # easy way to break a run.
          - name: expr-quoted-csv
            value: >-
              join(map(rows, "'" + .uw_account_number + "'"), ",")
          - name: expr-csv
            value: >-
              join(map(rows, .uw_account_number), ",")
          - name: expr-lines
            value: >-
              join(map(rows, .uw_account_number), "\n")
          - name: expr-id-and-number
            value: >-
              join(map(rows, .uw_account_id + "=" + .uw_account_number), ",")

          # Ids per chunk, not number of chunks — a fixed count would grow the
          # chunks with the population and blow the parameter limit again.
          # 1,000 ids is ~37KB. Keep it under max-capture-rows below.
          - { name: chunk-size, value: "1000" }
          # Rows held to evaluate assert/result-expr. Setting either triggers
          # the capture whatever the expression needs, so this must clear the
          # whole source: ~111k on dev-merit. The 10,000 default fails the run.
          - { name: max-capture-rows, value: "500000" }

          # --- service-snapshot (energy-platform CockroachDB) ---------------
          # Deliberately no energy_billing_platform filter: only 5,082 of the
          # 111,870 rows carrying a gentrack number are flagged GENTRACK, so
          # filtering on it discards 95% of the population. A service can hold a
          # gentrack number before its billing platform flips.
          - { name: energy-cluster-name, value: dev-merit }
          - { name: energy-namespace, value: energy-platform }
          - {
              name: energy-connection-string,
              value: "postgres://root@cockroachdb-proxy-moist.energy-platform.svc:26257/services?sslmode=verify-full",
            }
          - { name: energy-runner-sa, value: default }
          - { name: energy-ca-secret, value: ca.auth.keys.energy-platform }
          - { name: energy-ca-auth-key, value: moist.auth.key }
          - { name: energy-ca-config, value: ca.config.energy-platform }
          - { name: energy-ca-profile-key, value: ca.node.profile }
          - { name: energy-ca-address-key, value: ca.endpoint }
          - name: energy-query
            value: >-
              SELECT uw_account_id, '' AS uw_account_number, gentrack_account_number,
              floor((row_number() OVER (ORDER BY uw_account_id) - 1)
              / {{inputs.parameters.chunk-size}}.0)::int AS bucket
              FROM (
              SELECT DISTINCT s.customer_account_id::string AS uw_account_id,
              s.gentrack_account_number
              FROM service_snapshot s
              WHERE s.gentrack_account_number IS NOT NULL
              AND s.customer_account_id IS NOT NULL
              AND ('{{inputs.parameters.gentrack-account-numbers}}' = ''
              OR s.gentrack_account_number IN
              (SELECT unnest(string_to_array('{{inputs.parameters.gentrack-account-numbers}}', ','))))
              ) t

          # --- migration (gentrack-migration Postgres) ----------------------
          # One row per meterpoint, hence the DISTINCT.
          - { name: migration-cluster-name, value: dev-merit }
          - { name: migration-namespace, value: energy-platform }
          # The whole DSN comes from the namespace's own secret rather than
          # being restated here — connection-string is left empty so dsn-secret
          # wins.
          - { name: migration-dsn-secret, value: gentrack-migration-secrets }
          - { name: migration-dsn-key, value: dsn }
          - { name: migration-runner-sa, value: default }
          - name: migration-query
            value: >-
              SELECT '' AS uw_account_id, uw_account_number, gentrack_account_number,
              floor((row_number() OVER (ORDER BY uw_account_number) - 1)
              / {{inputs.parameters.chunk-size}}.0)::int AS bucket
              FROM (
              SELECT DISTINCT m.uw_account_number, m.gentrack_account_number
              FROM customer_gentrack_migration_status m
              WHERE NULLIF(m.gentrack_account_number, '') IS NOT NULL
              AND NULLIF(m.uw_account_number, '') IS NOT NULL
              AND ('{{inputs.parameters.gentrack-account-numbers}}' = ''
              OR m.gentrack_account_number IN
              (SELECT unnest(string_to_array('{{inputs.parameters.gentrack-account-numbers}}', ','))))
              ) t

          # --- account-platform: fills in the identifier the source lacks ----
          - { name: account-cluster-name, value: dev-aws }
          - { name: account-namespace, value: account-platform }
          - {
              name: account-connection-string,
              value: "postgresql://accounts@cockroachdb-proxy:26257/account_api_20250214?sslmode=verify-full",
            }
          - { name: account-ca-secret, value: ca-auth-key }

          # --- energy-billing: the bills check only -------------------------
          - { name: billing-cluster-name, value: dev-merit }
          - { name: billing-namespace, value: energy-billing }
          - {
              name: billing-connection-string,
              value: "postgres://billing_adapter_role@energy-rds.c4jv4shioc7c.eu-west-1.rds.amazonaws.com:5432/billing_adapter_db?sslmode=require",
            }
          - { name: billing-runner-sa, value: billing-adapter-rds-user }

          - {
              name: select-image,
              value: "registry.uw.systems/dev-enablement/select:main",
            }
          - name: log-level
            value: info
            enum: [trace, debug, info, warn, error]
          - { name: timeout, value: 5m }
          - { name: teardown, value: "true" }
      outputs:
        artifacts:
          # JSON array of {uw_account_id, uw_account_number,
          # gentrack_account_number, bucket} as the source knew them — one of
          # the two identifiers is blank until the account-platform hop.
          - name: gentrack-accounts
            from: "{{steps.resolve-gentrack.outputs.artifacts.result}}"
        parameters:
          # The output expr applied per chunk, then concatenated. The fan-out
          # aggregates as ["'1','2'","'3'"], so stripping the brackets and the
          # double quotes delimiting each element joins them — which is why no
          # output option quotes with ".
          - name: mapped
            valueFrom:
              expression: >-
                sprig.replace("\"", "",
                  sprig.replace("]", "",
                    sprig.replace("[", "",
                      steps['resolve-account-numbers'].outputs.parameters.result)))
          - name: mapped-chunked
            valueFrom:
              parameter: "{{steps.resolve-account-numbers.outputs.parameters.result}}"
          # Empty unless with-bills ran.
          - name: billed
            valueFrom:
              expression: >-
                sprig.replace("\"", "",
                  sprig.replace("]", "",
                    sprig.replace("[", "",
                      steps['check-bills'].outputs.parameters.result)))
              default: ""
      steps:
        # 1) gentrack → whichever uw identifier the source holds. One step: the
        #    source only changes where the query runs and what it says, so
        #    everything downstream is source-agnostic.
        - - name: resolve-gentrack
            templateRef: { name: step-query, template: pg }
            arguments:
              parameters:
                - name: cluster-name
                  value: "{{=inputs.parameters.source == 'migration' ? inputs.parameters['migration-cluster-name'] : inputs.parameters['energy-cluster-name']}}"
                - name: target-namespace
                  value: "{{=inputs.parameters.source == 'migration' ? inputs.parameters['migration-namespace'] : inputs.parameters['energy-namespace']}}"
                - { name: job-name, value: resolve-gentrack }
                - name: query
                  value: "{{=inputs.parameters.source == 'migration' ? inputs.parameters['migration-query'] : inputs.parameters['energy-query']}}"
                - name: db-type
                  value: "{{=inputs.parameters.source == 'migration' ? 'postgres' : 'cockroachdb'}}"
                - name: connection-string
                  value: "{{=inputs.parameters.source == 'migration' ? '' : inputs.parameters['energy-connection-string']}}"
                - name: dsn-secret
                  value: "{{=inputs.parameters.source == 'migration' ? inputs.parameters['migration-dsn-secret'] : ''}}"
                - {
                    name: dsn-key,
                    value: "{{inputs.parameters.migration-dsn-key}}",
                  }
                - name: runner-sa
                  value: "{{=inputs.parameters.source == 'migration' ? inputs.parameters['migration-runner-sa'] : inputs.parameters['energy-runner-sa']}}"
                # CockroachDB authenticates with a client cert; an empty
                # ca-secret leaves that wiring off for the Postgres source.
                - name: ca-secret
                  value: "{{=inputs.parameters.source == 'migration' ? '' : inputs.parameters['energy-ca-secret']}}"
                - {
                    name: ca-auth-key,
                    value: "{{inputs.parameters.energy-ca-auth-key}}",
                  }
                - {
                    name: ca-config,
                    value: "{{inputs.parameters.energy-ca-config}}",
                  }
                - {
                    name: ca-profile-key,
                    value: "{{inputs.parameters.energy-ca-profile-key}}",
                  }
                - {
                    name: ca-address-key,
                    value: "{{inputs.parameters.energy-ca-address-key}}",
                  }
                - { name: format, value: json }
                - { name: output, value: /tmp/gentrack-accounts.json }
                - { name: assert, value: "!empty" }
                - name: assert-message
                  value: "flow-gentrack-account-map: source={{inputs.parameters.source}} resolved nothing for gentrack-account-numbers='{{inputs.parameters.gentrack-account-numbers}}'"
                # `rows`, not a count: the remote Job only returns its captured
                # result, so this expression IS how the population gets out.
                - { name: result-expr, value: "rows" }
                - {
                    name: max-capture-rows,
                    value: "{{inputs.parameters.max-capture-rows}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: teardown, value: "{{inputs.parameters.teardown}}" }

        # 2) Fold the buckets into per-chunk lists. Reads the artifact, so it
        #    neither cares which source produced it nor re-queries.
        #
        #    `keys` is whichever identifier the source supplied — account ids
        #    from service-snapshot, account numbers from migration — and drives
        #    the account-platform lookup. `gentracks` rides along for the bills
        #    check.
        - - name: chunk-keys
            template: select
            arguments:
              artifacts:
                - {
                    name: input,
                    from: "{{steps.resolve-gentrack.outputs.artifacts.result}}",
                  }
              parameters:
                - {
                    name: select-image,
                    value: "{{inputs.parameters.select-image}}",
                  }
                # json, because the artifact is hop 1's captured `rows`.
                - { name: format, value: json }
                # Objects, not bare strings: the fan-out needs {{item.index}}
                # for a unique job-name — execute-job's uid suffix is the same
                # for every step of a run, so a shared name collides.
                #
                # The map literal needs its own parens or expr rejects the ':'.
                # groupBy/values, not filter: in `map(uniq(map(rows, .bucket)),
                # join(map(filter(rows, .bucket == #), ...), ","))` the inner #
                # shadows the outer one and every element comes back empty, with
                # no error. sortBy because values() over a map is unordered.
                - name: expr
                  value: >-
                    sortBy(map(values(groupBy(rows, .bucket)), ({index:
                    #[0].bucket, keys: join(map(#, .uw_account_id != "" ?
                    .uw_account_id : .uw_account_number), ","), gentracks:
                    join(map(#, .gentrack_account_number), ",")})), .index)
                - { name: output-format, value: json }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

        # 3) account-platform fills in the identifier the source lacked, keyed
        #    by whichever one it had. One Job per chunk.
        - - name: resolve-account-numbers
            templateRef: { name: step-query, template: pg }
            withParam: "{{steps.chunk-keys.outputs.parameters.result}}"
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.account-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.account-namespace}}",
                  }
                - { name: job-name, value: "resolve-numbers-{{item.index}}" }
                - name: query
                  value: >-
                    SELECT id::string AS uw_account_id,
                    account_number AS uw_account_number
                    FROM accounts
                    WHERE {{=inputs.parameters.source == 'migration' ? 'account_number' : 'id'}}
                    IN (SELECT unnest(string_to_array('{{item.keys}}', ','))
                    {{=inputs.parameters.source == 'migration' ? '' : '::uuid'}})
                - { name: format, value: json }
                - { name: output, value: /tmp/numbers.json }
                - name: result-expr
                  value: "{{=inputs.parameters.output == 'csv' ? inputs.parameters['expr-csv'] : inputs.parameters.output == 'lines' ? inputs.parameters['expr-lines'] : inputs.parameters.output == 'id-and-number' ? inputs.parameters['expr-id-and-number'] : inputs.parameters['expr-quoted-csv']}}"
                - {
                    name: max-capture-rows,
                    value: "{{inputs.parameters.max-capture-rows}}",
                  }
                - { name: db-type, value: cockroachdb }
                - {
                    name: connection-string,
                    value: "{{inputs.parameters.account-connection-string}}",
                  }
                - {
                    name: ca-secret,
                    value: "{{inputs.parameters.account-ca-secret}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: teardown, value: "{{inputs.parameters.teardown}}" }

        # 4) Optional: which of them energy-billing holds a bill for. Reported
        #    rather than filtered — the answer lives in a third database, and
        #    intersecting it with `mapped` would need a join this framework has
        #    no step for. Both come back as comma lists.
        - - name: check-bills
            templateRef: { name: step-query, template: pg }
            when: "{{inputs.parameters.with-bills}} == true"
            withParam: "{{steps.chunk-keys.outputs.parameters.result}}"
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.billing-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.billing-namespace}}",
                  }
                - { name: job-name, value: "check-bills-{{item.index}}" }
                - name: query
                  value: >-
                    SELECT DISTINCT external_account_number AS gentrack_account_number
                    FROM public.billing_period_accounts
                    WHERE external_account_number IN
                    (SELECT unnest(string_to_array('{{item.gentracks}}', ',')))
                - { name: format, value: json }
                - { name: output, value: /tmp/billed.json }
                - {
                    name: result-expr,
                    value: 'join(map(rows, .gentrack_account_number), ",")',
                  }
                - {
                    name: max-capture-rows,
                    value: "{{inputs.parameters.max-capture-rows}}",
                  }
                - { name: db-type, value: postgres }
                - {
                    name: connection-string,
                    value: "{{inputs.parameters.billing-connection-string}}",
                  }
                # RDS IAM: no password in the DSN. The sidecar and the SA's
                # aws-role mint the token.
                - { name: vault-sidecar, value: "true" }
                - {
                    name: runner-sa,
                    value: "{{inputs.parameters.billing-runner-sa}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: teardown, value: "{{inputs.parameters.teardown}}" }

    - name: select
      inputs:
        artifacts:
          - { name: input, path: /tmp/in.ndjson }
        parameters:
          - {
              name: select-image,
              value: "registry.uw.systems/dev-enablement/select:main",
            }
          - { name: expr }
          - { name: format, value: ndjson }
          - { name: output-format, value: json }
          - { name: log-level, value: info }
      container:
        image: "{{inputs.parameters.select-image}}"
        env:
          - { name: INPUT, value: /tmp/in.ndjson }
          - { name: FORMAT, value: "{{inputs.parameters.format}}" }
          - { name: SELECT, value: "{{inputs.parameters.expr}}" }
          - { name: OUTPUT, value: /tmp/out }
          - {
              name: OUTPUT_FORMAT,
              value: "{{inputs.parameters.output-format}}",
            }
          - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }
      outputs:
        parameters:
          - name: result
            valueFrom:
              path: /tmp/out
              default: ""
