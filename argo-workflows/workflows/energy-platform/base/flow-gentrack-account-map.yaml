# =============================================================================
# flow-gentrack-account-map — gentrack account number → account_id → uw account
# number
# =============================================================================
#   in : source                    where the gentrack identifiers come from
#        gentrack-account-numbers  comma-separated; required for `manual`
#        output                    shape of the `mapped` parameter
#   out: mapped            (parameter) the uw account numbers, shaped by output
#        gentrack-accounts (artifact)  JSON array, one entry per account:
#                                      {uw_account_id, gentrack_account_number}
#
# SOURCES. Only the first hop changes; resolving to account_id and then to the
# uw account number is the same whichever you pick.
#
#   manual          the numbers you paste, resolved against energy-platform
#   energy-billing  accounts with a bill, from account_services in
#                   billing_adapter_db (RDS) — 16,081 on dev-merit
#   energy-platform gentrack identifiers known to energy, from service_snapshot
#                   in the energy-platform CockroachDB — 5,105 on dev-merit
#
# The two do not nest: energy-billing currently holds three times more than
# energy-platform, so neither is a superset. Pick by the question you are
# asking, and expect different answers.
#
# Both sources already carry the account id next to the gentrack number, so a
# run against one has nothing to gain from also querying the other. Richer
# per-service fields belong in the BigQuery lookup this feeds.
#
# BATCHING. ~16k account ids comma-joined is ~590KB, and step-query hands its
# statement to the remote Job as an env var, past the per-variable limit. There
# is no query-file input, so the ids must be inline in the SQL and an artifact
# cannot carry them. Hop 1 tags each row with a bucket, hop 2 folds those into
# fixed-size id strings (1,000 ids ≈ 37KB measured), hop 3 fans out. A short
# manual list is one chunk.
#
# The alternative — dump `accounts` whole and join client-side — was measured
# and rejected: 3,051,799 rows on dev-aws, so a ~200MB artifact and a full scan
# of a shared CockroachDB on every run. The batched lookup is a primary key
# lookup join (accounts@accounts_pkey), which is why 1,000 ids per chunk is
# cheap. Do not "simplify" this into one big query.
#
# A remote Job returns only its captured result — the `output` file stays in the
# pod — so hop 1's result-expr is `rows` and that capture is the population.
# max-capture-rows must therefore clear it, and the 10,000 default will not.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: flow-gentrack-account-map
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Read-only. Maps gentrack account numbers to uw account ids and numbers.
      Source them from a list you paste (`manual`), from every account that has
      a bill (`energy-billing`), or from every gentrack identifier there is
      (`energy-platform`). `output` shapes the result — quoted, comma-separated
      account numbers by default, ready to paste into a query.
  labels:
    app.kubernetes.io/component: flow
    workflows.argoproj.io/creator: qe
    workflows.argoproj.io/invocation: standalone
    data.uw.systems/system: energy-billing
spec:
  entrypoint: resolve
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - name: source
        value: energy-billing
        enum: [manual, energy-billing, energy-platform]
        description: >-
          Where the gentrack account numbers come from. manual = the list you
          paste below. energy-billing = every account that has a bill.
          energy-platform = every gentrack identifier energy knows about.
      - name: gentrack-account-numbers
        value: ""
        description: >-
          Comma-separated, no spaces or quotes, e.g.
          J20000000201,J20000000202 — required when source is manual, and
          narrows the other two sources when set. Leave empty to take the whole
          population.
      - name: output
        value: quoted-csv
        enum: [quoted-csv, csv, lines, id-and-number]
        description: >-
          Shape of the `mapped` output. quoted-csv gives '123','456' to drop
          into an IN (...); csv gives 123,456; lines gives one per line;
          id-and-number gives uuid=123 pairs. The full mapping including the
          gentrack number is in the gentrack-accounts artifact.
      - name: log-level
        value: info
        enum: [trace, debug, info, warn, error]
        description: Verbosity of the remote query Jobs.
      - { name: timeout, value: 5m }
      - { name: teardown, value: "true" }
  templates:
    - name: resolve
      inputs:
        parameters:
          - name: source
            value: energy-billing
            enum: [manual, energy-billing, energy-platform]
          - { name: gentrack-account-numbers, value: "" }
          - name: output
            value: quoted-csv
            enum: [quoted-csv, csv, lines, id-and-number]

          # Not workflow arguments: mechanics, not choices. The output exprs are
          # named here so `output` can stay an enum — a free-text expr is an
          # easy way to break a run.
          - name: expr-quoted-csv
            value: >-
              join(map(rows, "'" + .uw_account_number + "'"), ",")
          - name: expr-csv
            value: >-
              join(map(rows, .uw_account_number), ",")
          - name: expr-lines
            value: >-
              join(map(rows, .uw_account_number), "\n")
          - name: expr-id-and-number
            value: >-
              join(map(rows, .uw_account_id + "=" + .uw_account_number), ",")

          # Ids per chunk, not number of chunks — a fixed count would grow the
          # chunks with the population and blow the parameter limit again.
          # 1,000 ids is ~37KB. Keep it under max-capture-rows below.
          - { name: chunk-size, value: "1000" }
          # Rows held to evaluate assert/result-expr. Setting either triggers
          # the capture whatever the expression needs, so this must clear the
          # whole population: 16,081 for energy-billing and 5,105 for
          # energy-platform on dev-merit. The 10,000 default fails the run.
          - { name: max-capture-rows, value: "200000" }

          # --- energy-billing ---------------------------------------------
          - { name: billing-cluster-name, value: dev-merit }
          - { name: billing-namespace, value: energy-billing }
          - {
              name: billing-connection-string,
              value: "postgres://billing_adapter_role@energy-rds.c4jv4shioc7c.eu-west-1.rds.amazonaws.com:5432/billing_adapter_db?sslmode=require",
            }
          - { name: billing-runner-sa, value: billing-adapter-rds-user }
          # EXISTS, not a join: billing_period_accounts is one row per account
          # per bill period. The bucket sits outside the DISTINCT because a
          # window function is evaluated before it.
          - name: billing-query
            value: >-
              SELECT uw_account_id, gentrack_account_number,
              floor((row_number() OVER (ORDER BY uw_account_id) - 1)
              / {{inputs.parameters.chunk-size}}.0)::int AS bucket
              FROM (
              SELECT DISTINCT a.account_id AS uw_account_id,
              a.external_account_number AS gentrack_account_number
              FROM public.account_services a
              WHERE NULLIF(a.account_id, '') IS NOT NULL
              AND EXISTS (SELECT 1 FROM public.billing_period_accounts bpa
              WHERE bpa.external_account_number = a.external_account_number)
              AND ('{{inputs.parameters.gentrack-account-numbers}}' = ''
              OR a.external_account_number IN
              (SELECT unnest(string_to_array('{{inputs.parameters.gentrack-account-numbers}}', ','))))
              ) t

          # --- energy-platform --------------------------------------------
          - { name: energy-cluster-name, value: dev-merit }
          - { name: energy-namespace, value: energy-platform }
          - {
              name: energy-connection-string,
              value: "postgres://root@cockroachdb-proxy-moist.energy-platform.svc:26257/services?sslmode=verify-full",
            }
          - { name: energy-runner-sa, value: default }
          - { name: energy-ca-secret, value: ca.auth.keys.energy-platform }
          - { name: energy-ca-auth-key, value: moist.auth.key }
          - { name: energy-ca-config, value: ca.config.energy-platform }
          - { name: energy-ca-profile-key, value: ca.node.profile }
          - { name: energy-ca-address-key, value: ca.endpoint }
          - { name: billing-platform, value: ENERGY_BILLING_PLATFORM_GENTRACK }
          # The `source <> manual OR numbers <> ''` term stops a manual run with
          # an empty list falling into the empty-means-everything branch and
          # returning the whole table; it yields no rows and the assert fires.
          - name: energy-query
            value: >-
              SELECT uw_account_id, gentrack_account_number,
              floor((row_number() OVER (ORDER BY uw_account_id) - 1)
              / {{inputs.parameters.chunk-size}}.0)::int AS bucket
              FROM (
              SELECT DISTINCT s.customer_account_id::string AS uw_account_id,
              s.gentrack_account_number
              FROM service_snapshot s
              WHERE s.gentrack_account_number IS NOT NULL
              AND s.customer_account_id IS NOT NULL
              AND s.energy_billing_platform = '{{inputs.parameters.billing-platform}}'
              AND ('{{inputs.parameters.source}}' <> 'manual'
              OR '{{inputs.parameters.gentrack-account-numbers}}' <> '')
              AND ('{{inputs.parameters.gentrack-account-numbers}}' = ''
              OR s.gentrack_account_number IN
              (SELECT unnest(string_to_array('{{inputs.parameters.gentrack-account-numbers}}', ','))))
              ) t

          # --- account-platform -------------------------------------------
          - { name: account-cluster-name, value: dev-aws }
          - { name: account-namespace, value: account-platform }
          - {
              name: account-connection-string,
              value: "postgresql://accounts@cockroachdb-proxy:26257/account_api_20250214?sslmode=verify-full",
            }
          - { name: account-ca-secret, value: ca-auth-key }

          - {
              name: select-image,
              value: "registry.uw.systems/dev-enablement/select:main",
            }
          - name: log-level
            value: info
            enum: [trace, debug, info, warn, error]
          - { name: timeout, value: 5m }
          - { name: teardown, value: "true" }
      outputs:
        artifacts:
          # JSON array of {uw_account_id, gentrack_account_number, bucket}.
          # `jq -c '.[]'` if you need ndjson for a BigQuery load.
          - name: gentrack-accounts
            from: "{{steps.resolve-gentrack.outputs.artifacts.result}}"
        parameters:
          # The output expr applied per chunk, then concatenated. The fan-out
          # aggregates as ["'1','2'","'3'"], so stripping the brackets and the
          # double quotes delimiting each element joins them — which is why no
          # output option quotes with ".
          - name: mapped
            valueFrom:
              expression: >-
                sprig.replace("\"", "",
                  sprig.replace("]", "",
                    sprig.replace("[", "",
                      steps['resolve-account-numbers'].outputs.parameters.result)))
          # The raw per-chunk array, if the expression above ever misbehaves.
          - name: mapped-chunked
            valueFrom:
              parameter: "{{steps.resolve-account-numbers.outputs.parameters.result}}"
      steps:
        # 1) gentrack → account_id, from the chosen source. One step: the source
        #    only changes where the query runs and what it says, so everything
        #    downstream is source-agnostic.
        - - name: resolve-gentrack
            templateRef: { name: step-query, template: pg }
            arguments:
              parameters:
                - name: cluster-name
                  value: "{{=inputs.parameters.source == 'energy-billing' ? inputs.parameters['billing-cluster-name'] : inputs.parameters['energy-cluster-name']}}"
                - name: target-namespace
                  value: "{{=inputs.parameters.source == 'energy-billing' ? inputs.parameters['billing-namespace'] : inputs.parameters['energy-namespace']}}"
                - { name: job-name, value: resolve-gentrack }
                - name: query
                  value: "{{=inputs.parameters.source == 'energy-billing' ? inputs.parameters['billing-query'] : inputs.parameters['energy-query']}}"
                - name: db-type
                  value: "{{=inputs.parameters.source == 'energy-billing' ? 'postgres' : 'cockroachdb'}}"
                - name: connection-string
                  value: "{{=inputs.parameters.source == 'energy-billing' ? inputs.parameters['billing-connection-string'] : inputs.parameters['energy-connection-string']}}"
                - name: runner-sa
                  value: "{{=inputs.parameters.source == 'energy-billing' ? inputs.parameters['billing-runner-sa'] : inputs.parameters['energy-runner-sa']}}"
                # RDS IAM for billing; CockroachDB uses a client cert, and an
                # empty ca-secret leaves that wiring off.
                - name: vault-sidecar
                  value: "{{=inputs.parameters.source == 'energy-billing' ? 'true' : 'false'}}"
                - name: ca-secret
                  value: "{{=inputs.parameters.source == 'energy-billing' ? '' : inputs.parameters['energy-ca-secret']}}"
                - {
                    name: ca-auth-key,
                    value: "{{inputs.parameters.energy-ca-auth-key}}",
                  }
                - {
                    name: ca-config,
                    value: "{{inputs.parameters.energy-ca-config}}",
                  }
                - {
                    name: ca-profile-key,
                    value: "{{inputs.parameters.energy-ca-profile-key}}",
                  }
                - {
                    name: ca-address-key,
                    value: "{{inputs.parameters.energy-ca-address-key}}",
                  }
                - { name: format, value: json }
                - { name: output, value: /tmp/gentrack-accounts.json }
                - { name: assert, value: "!empty" }
                - name: assert-message
                  value: "flow-gentrack-account-map: source={{inputs.parameters.source}} resolved nothing for gentrack-account-numbers='{{inputs.parameters.gentrack-account-numbers}}' (source=manual requires a non-empty list)"
                # `rows`, not rowCount: the remote Job only returns its captured
                # result, so this expression IS how the population gets out. The
                # `output` file above stays in the pod.
                - { name: result-expr, value: "rows" }
                - {
                    name: max-capture-rows,
                    value: "{{inputs.parameters.max-capture-rows}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: teardown, value: "{{inputs.parameters.teardown}}" }

        # 2) Fold the buckets into comma-joined id lists. Reads the artifact, so
        #    it neither cares which source produced it nor re-queries.
        - - name: chunk-account-ids
            template: select
            arguments:
              artifacts:
                - {
                    name: input,
                    from: "{{steps.resolve-gentrack.outputs.artifacts.result}}",
                  }
              parameters:
                - {
                    name: select-image,
                    value: "{{inputs.parameters.select-image}}",
                  }
                # json, because the artifact is hop 1's captured `rows` — a
                # JSON array — not its output file.
                - { name: format, value: json }
                # Objects, not bare strings: the fan-out needs {{item.index}}
                # for a unique job-name — execute-job's uid suffix is the same
                # for every step of a run, so a shared name collides.
                #
                # The map literal needs its own parens or expr rejects the ':'.
                # groupBy/values, not filter: in `map(uniq(map(rows, .bucket)),
                # join(map(filter(rows, .bucket == #), ...), ","))` the inner #
                # shadows the outer one and every element comes back empty, with
                # no error. sortBy because values() over a map is unordered.
                - name: expr
                  value: >-
                    sortBy(map(values(groupBy(rows, .bucket)), ({index:
                    #[0].bucket, ids: join(map(#, .uw_account_id), ",")})),
                    .index)
                - { name: output-format, value: json }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

        # 3) account_id → uw account number, one Job per chunk. An id with no row
        #    is dropped rather than failing the chunk; compare the output
        #    against the gentrack-accounts artifact if the count matters.
        - - name: resolve-account-numbers
            templateRef: { name: step-query, template: pg }
            withParam: "{{steps.chunk-account-ids.outputs.parameters.result}}"
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.account-cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.account-namespace}}",
                  }
                - { name: job-name, value: "resolve-numbers-{{item.index}}" }
                # Both identifiers, so any output option can be built.
                - name: query
                  value: >-
                    SELECT id::string AS uw_account_id,
                    account_number AS uw_account_number
                    FROM accounts
                    WHERE id IN (SELECT unnest(string_to_array('{{item.ids}}', ','))::uuid)
                - { name: format, value: json } # a `rows` expr needs json
                - { name: output, value: /tmp/numbers.json }
                - name: result-expr
                  value: "{{=inputs.parameters.output == 'csv' ? inputs.parameters['expr-csv'] : inputs.parameters.output == 'lines' ? inputs.parameters['expr-lines'] : inputs.parameters.output == 'id-and-number' ? inputs.parameters['expr-id-and-number'] : inputs.parameters['expr-quoted-csv']}}"

                - { name: db-type, value: cockroachdb }
                - {
                    name: connection-string,
                    value: "{{inputs.parameters.account-connection-string}}",
                  }
                - {
                    name: ca-secret,
                    value: "{{inputs.parameters.account-ca-secret}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: teardown, value: "{{inputs.parameters.teardown}}" }

    - name: select
      inputs:
        artifacts:
          - { name: input, path: /tmp/in.ndjson }
        parameters:
          - {
              name: select-image,
              value: "registry.uw.systems/dev-enablement/select:main",
            }
          - { name: expr }
          - { name: format, value: ndjson }
          - { name: output-format, value: json }
          - { name: log-level, value: info }
      container:
        image: "{{inputs.parameters.select-image}}"
        env:
          - { name: INPUT, value: /tmp/in.ndjson }
          - { name: FORMAT, value: "{{inputs.parameters.format}}" }
          - { name: SELECT, value: "{{inputs.parameters.expr}}" }
          - { name: OUTPUT, value: /tmp/out }
          - {
              name: OUTPUT_FORMAT,
              value: "{{inputs.parameters.output-format}}",
            }
          - { name: LOG_LEVEL, value: "{{inputs.parameters.log-level}}" }
      outputs:
        parameters:
          - name: result
            valueFrom:
              path: /tmp/out
              default: ""
