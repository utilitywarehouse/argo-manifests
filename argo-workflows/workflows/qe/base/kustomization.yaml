apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - test-data-rebuild.yaml

# ---------------------------------------------------------------------------
# Image pins for this package. Same shape as shared/: a local-config ConfigMap
# and replacements onto template INPUT parameters, which kustomize's `images:`
# transformer cannot reach because they are Argo expressions inside a Job
# heredoc rather than resolvable image fields.
# ---------------------------------------------------------------------------
# The two pins move independently: CI builds only what a change reaches, so an
# executor untouched by a merge has no image at that SHA.
configMapGenerator:
  - name: qe-image-versions
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
    literals:
      - query-duckdb=registry.uw.systems/dev-enablement/query-duckdb:05a70b1210d310e4c897c2be167553c4bc8d53e7
      - load-es=registry.uw.systems/dev-enablement/load-es:9f2df62cbd0d56be40934b3bb952b2cdf4dd15c5
generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      { kind: ConfigMap, name: qe-image-versions, fieldPath: data.query-duckdb }
    targets:
      - select: { kind: WorkflowTemplate, name: flow-test-data-rebuild }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=query-duckdb-image].value
        options: { create: false }
  - source:
      { kind: ConfigMap, name: qe-image-versions, fieldPath: data.load-es }
    targets:
      - select: { kind: WorkflowTemplate, name: flow-test-data-rebuild }
        fieldPaths:
          - spec.templates.*.inputs.parameters.[name=load-es-image].value
        options: { create: false }
