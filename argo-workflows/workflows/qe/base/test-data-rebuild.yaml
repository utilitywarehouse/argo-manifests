# =============================================================================
# flow-test-data-rebuild — compose the account documents, then index them
# =============================================================================
# Both steps run as Jobs in dev-aws/qe. Loading has to: Elasticsearch is a
# headless service this cluster cannot reach. Composing does not have to, but
# runs there anyway so the S3 credentials live in one namespace — the one that
# already holds the data — and this one orchestrates without holding any.
#
# Nothing here knows what the document contains. The composition SQL is
# published by test-data-ui and names its inputs as variables; the caller
# resolves them and passes them in `vars`.
#
# Needs, in dev-aws/qe:
#   secret/duckdb-s3      key id + secret for the qe-dev-duckdb user. A static
#                         key because DuckDB reads credentials from the
#                         environment and has no container provider, so the
#                         vault sidecar cannot serve it.
#   the job-executor bundle, and its token harvested here as dev-aws-qe.
#   config/test-data/manifest.json published from the app. Its `mapping`
#                         block is the loader's policy — see mapping-policy.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: flow-test-data-rebuild
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Compose the test-account documents from the latest exports and index them.
      Submitted by test-data-ui, which resolves the exports and supplies `vars`.
  labels:
    app.kubernetes.io/component: flow
    workflows.argoproj.io/creator: qe
    workflows.argoproj.io/invocation: standalone
    data.uw.systems/system: test-data
    data.uw.systems/capability: test-accounts
spec:
  entrypoint: rebuild
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      # One JSON object: a source name to its read pattern, plus `limit`.
      # Resolved by the caller, because only it knows which export is newest.
      - name: vars
      - {
          name: query,
          value: "s3://uw-dev-qe-test-data/config/test-data/compose.sql",
        }
      - { name: composed, value: "s3://uw-dev-qe-test-data/composite.ndjson" }
      - { name: alias, value: test-accounts }
      # The composition puts identifiers under _meta, not at the root.
      - { name: id-field, value: _meta.identifiers.account_id }
      # How these documents are mapped, read from the `mapping` block of the
      # manifest the app publishes — one artefact for everything decided about
      # them, rather than a second file with no publisher.
      #
      # Without it the mapping is wholly derived, which indexes CRM's inner
      # [{label, value}] arrays as nested. Measured on a real build: 21.1
      # Lucene documents per account against 5.0, for arrays nothing queries
      # correlated.
      #
      # The object must exist — a missing one fails the load rather than
      # falling back. A manifest with no `mapping` block is fine.
      - {
          name: mapping-policy,
          value: "s3://uw-dev-qe-test-data/config/test-data/manifest.json",
        }
      - { name: mapping-policy-key, value: mapping }
      # The ETag the manifest had when this run was submitted. The app sends it;
      # empty reads the object as it stands, which is what a manual submit does.
      - { name: mapping-policy-version, value: "" }
      - { name: shards, value: "3" }
      - { name: replicas, value: "1" }
      # Parameters because the size of a rebuild is chosen at submit time: a
      # 500-account preview and every account are the same query three orders
      # of magnitude apart. memory-limit is where DuckDB spills and must stay
      # below compose-memory, or the kernel kills it instead — raise together.
      - { name: compose-cpu, value: "2" }
      - { name: compose-memory, value: 8Gi }
      - { name: memory-limit, value: 5GB }
      # temp-limit is how much of the volume the spill may take. DuckDB
      # measures the node's disk behind the emptyDir, and writing past the
      # volume evicts the pod rather than failing the query.
      # Sized against a pass, not the collection: each pass is uploaded as it
      # finishes, so the joined result never lands here. What the volume holds
      # is one pass plus DuckDB's spill, which compose-partitions divides.
      - { name: compose-scratch, value: 50Gi }
      - { name: temp-limit, value: 30GB }
      # How many passes the compose takes, each over a disjoint slice of the
      # accounts. DuckDB spills a sort or a join, but not the service records an
      # aggregate collects into a list per account, so memory follows how many
      # accounts a pass holds rather than how much scratch there is. Costs a
      # re-read of the extracts per pass, which is why the compose timeout is
      # hours rather than minutes.
      - { name: compose-partitions, value: "8" }
      # The loader streams its input twice rather than staging it, so neither
      # of these follows the size of the composed set.
      # The loader decodes every document to derive the field catalogue, which
      # is the pass it spends its time in and scales with cores: 84 MB/s on one,
      # 154 on two. Two is also the largest that schedules dependably here.
      - { name: load-cpu, value: "2" }
      - { name: load-memory, value: 4Gi }
      - { name: load-scratch, value: 4Gi }
      - { name: compose-timeout, value: 4h }
      - { name: load-timeout, value: 2h }
      - { name: job-active-deadline, value: 6h }
      - { name: job-ttl, value: 24h }
      - { name: cluster-name, value: dev-aws }
      - { name: target-namespace, value: qe }
      - { name: aws-secret, value: duckdb-s3 }
      - { name: log-level, value: info }
      - { name: image-pull-secret, value: dockerhub-key }

  templates:
    - name: rebuild
      steps:
        - - name: compose
            template: compose
            arguments:
              parameters:
                - {
                    name: timeout,
                    value: "{{workflow.parameters.compose-timeout}}",
                  }
                - {
                    name: job-active-deadline,
                    value: "{{workflow.parameters.job-active-deadline}}",
                  }
                - { name: job-ttl, value: "{{workflow.parameters.job-ttl}}" }
        - - name: load
            template: load
            arguments:
              parameters:
                - {
                    name: job-active-deadline,
                    value: "{{workflow.parameters.job-active-deadline}}",
                  }
                - { name: job-ttl, value: "{{workflow.parameters.job-ttl}}" }

    - name: compose
      inputs:
        parameters:
          # Pinned by kustomize; see the replacements in this package.
          - {
              name: query-duckdb-image,
              value: "registry.uw.systems/dev-enablement/query-duckdb:main",
            }
          - name: job-active-deadline
          - name: job-ttl
          - name: timeout
      steps:
        - - name: compose
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{workflow.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{workflow.parameters.target-namespace}}",
                  }
                # Unique across every execute-job this workflow makes.
                - { name: job-name, value: test-data-compose-accounts }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - {
                    name: log-level,
                    value: "{{workflow.parameters.log-level}}",
                  }
                # Every substituted value is a block scalar. Argo substitutes raw
                # text with no escaping, so `vars` — a JSON object full of quotes
                # and braces — would close a flow mapping early and the Job
                # manifest would stop parsing, in a remote cluster mid-run.
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['job-active-deadline']).Seconds())}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          restartPolicy: Never
                          imagePullSecrets:
                            - name: {{workflow.parameters.image-pull-secret}}
                          containers:
                            - name: compose
                              image: {{inputs.parameters.query-duckdb-image}}
                              imagePullPolicy: Always
                              env:
                                - name: QUERY
                                  value: |-
                                    {{workflow.parameters.query}}
                                - name: VARS
                                  value: |-
                                    {{workflow.parameters.vars}}
                                - name: OUTPUT
                                  value: |-
                                    {{workflow.parameters.composed}}
                                - name: FORMAT
                                  value: "ndjson"
                                - name: WORK_DIR
                                  value: "/scratch"
                                - name: DUCKDB_MEMORY_LIMIT
                                  value: |-
                                    {{workflow.parameters.memory-limit}}
                                # Left to itself DuckDB takes the node's core
                                # count and budgets gigabytes a thread, so a
                                # big query is killed before the memory limit.
                                - name: DUCKDB_THREADS
                                  value: |-
                                    {{workflow.parameters.compose-cpu}}
                                - name: DUCKDB_TEMP_LIMIT
                                  value: |-
                                    {{workflow.parameters.temp-limit}}
                                - name: PARTITIONS
                                  value: |-
                                    {{workflow.parameters.compose-partitions}}
                                - {
                                    name: TIMEOUT,
                                    value: "{{=int(duration(inputs.parameters['timeout']).Seconds())}}",
                                  }
                                - name: LOG_LEVEL
                                  value: |-
                                    {{workflow.parameters.log-level}}
                                - name: AWS_ACCESS_KEY_ID
                                  valueFrom: { secretKeyRef: { name: {{workflow.parameters.aws-secret}}, key: AWS_ACCESS_KEY_ID } }
                                - name: AWS_SECRET_ACCESS_KEY
                                  valueFrom: { secretKeyRef: { name: {{workflow.parameters.aws-secret}}, key: AWS_SECRET_ACCESS_KEY } }
                                - name: AWS_REGION
                                  value: "eu-west-1"
                              resources:
                                requests:
                                  {
                                    cpu: "{{workflow.parameters.compose-cpu}}",
                                    memory: "{{workflow.parameters.compose-memory}}",
                                    ephemeral-storage: "{{workflow.parameters.compose-scratch}}",
                                  }
                                limits:
                                  {
                                    cpu: "{{workflow.parameters.compose-cpu}}",
                                    memory: "{{workflow.parameters.compose-memory}}",
                                    ephemeral-storage: "{{workflow.parameters.compose-scratch}}",
                                  }
                              volumeMounts:
                                - { name: scratch, mountPath: /scratch }
                          volumes:
                            # DuckDB's spill and staging: a join across the
                            # exports does not fit in memory. Sized with the
                            # container's ephemeral-storage limit, which the
                            # namespace LimitRange otherwise defaults to 1Gi —
                            # an eviction, not a slowdown.
                            - name: scratch
                              emptyDir:
                                { sizeLimit: "{{workflow.parameters.compose-scratch}}" }

    - name: load
      inputs:
        parameters:
          - {
              name: load-es-image,
              value: "registry.uw.systems/dev-enablement/load-es:main",
            }
          - name: job-active-deadline
          - name: job-ttl
      steps:
        - - name: load
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{workflow.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{workflow.parameters.target-namespace}}",
                  }
                - { name: job-name, value: test-data-index-accounts }
                - {
                    name: timeout,
                    value: "{{workflow.parameters.load-timeout}}",
                  }
                - {
                    name: log-level,
                    value: "{{workflow.parameters.log-level}}",
                  }
                # Every substituted value is a block scalar. Argo substitutes raw
                # text with no escaping, so `vars` — a JSON object full of quotes
                # and braces — would close a flow mapping early and the Job
                # manifest would stop parsing, in a remote cluster mid-run.
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['job-active-deadline']).Seconds())}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          restartPolicy: Never
                          imagePullSecrets:
                            - name: {{workflow.parameters.image-pull-secret}}
                          containers:
                            - name: load
                              image: {{inputs.parameters.load-es-image}}
                              imagePullPolicy: Always
                              env:
                                - name: INPUT
                                  value: |-
                                    {{workflow.parameters.composed}}
                                - name: HOST
                                  value: "http://elasticsearch:9200"
                                - name: ALIAS
                                  value: |-
                                    {{workflow.parameters.alias}}
                                - name: ID_FIELD
                                  value: |-
                                    {{workflow.parameters.id-field}}
                                - name: MAPPING_POLICY
                                  value: |-
                                    {{workflow.parameters.mapping-policy}}
                                - name: MAPPING_POLICY_KEY
                                  value: |-
                                    {{workflow.parameters.mapping-policy-key}}
                                - name: MAPPING_POLICY_VERSION
                                  value: |-
                                    {{workflow.parameters.mapping-policy-version}}
                                - name: INDEX_SHARDS
                                  value: |-
                                    {{workflow.parameters.shards}}
                                - name: INDEX_REPLICAS
                                  value: |-
                                    {{workflow.parameters.replicas}}
                                - name: TIMEOUT
                                  value: |-
                                    {{workflow.parameters.load-timeout}}
                                - name: LOG_LEVEL
                                  value: |-
                                    {{workflow.parameters.log-level}}
                                - name: AWS_ACCESS_KEY_ID
                                  valueFrom: { secretKeyRef: { name: {{workflow.parameters.aws-secret}}, key: AWS_ACCESS_KEY_ID } }
                                - name: AWS_SECRET_ACCESS_KEY
                                  valueFrom: { secretKeyRef: { name: {{workflow.parameters.aws-secret}}, key: AWS_SECRET_ACCESS_KEY } }
                                - name: AWS_REGION
                                  value: "eu-west-1"
                              resources:
                                requests:
                                  {
                                    cpu: "{{workflow.parameters.load-cpu}}",
                                    memory: "{{workflow.parameters.load-memory}}",
                                    ephemeral-storage: "{{workflow.parameters.load-scratch}}",
                                  }
                                limits:
                                  {
                                    cpu: "2",
                                    memory: "{{workflow.parameters.load-memory}}",
                                    ephemeral-storage: "{{workflow.parameters.load-scratch}}",
                                  }
                              volumeMounts:
                                - { name: scratch, mountPath: /scratch }
                          volumes:
                            # The composed documents are cached here: fetched
                            # once, read twice, so this holds the whole file.
                            - name: scratch
                              emptyDir:
                                { sizeLimit: "{{workflow.parameters.load-scratch}}" }
