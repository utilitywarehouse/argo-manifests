# =============================================================================
# derive-meter-state — fold the meterpoint event log into the meters table
# =============================================================================
# energy-meter-reads-api dropped its `meters` and `smart_meters` projections
# (#421) and energy-meterpoints, which owns meters now, materialises none of it.
#
# Not in the composition: folding 17.8M events there OOM-killed four of eight
# compose partitions at 8Gi. Here it happens once and compose reads a ~300 MB
# table shaped like the one it replaces.
#
# Resolves its own input from the orchestrator, so it is submittable alone as
# well as referenced by the rebuild. Output goes to one fixed path, replaced
# each run like composed/ is: at 1m43s the fold is cheaper than reasoning about
# whether a kept artifact matches the export compose is actually reading.
#
# 1m43s over all 17.8M events, producing 4,808,770 rows in a 300 MB file.
# Parquet cannot be partitioned, so the aggregate holds every meter at once and
# the pod is sized from measurement rather than headroom — see fold-memory.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: flow-derive-meter-state
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Fold energy_meterpoints/meter_event_log into the shape the dropped
      energy_meters/meters table had. Safe to submit directly.
  labels:
    workflows.argoproj.io/creator: qe
    data.uw.systems/capability: derive
spec:
  entrypoint: derive
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      # Which export to fold. Resolved by asking the orchestrator for the
      # newest, so a caller names the entity rather than a path.
      - { name: source-system-key, value: energy_meterpoints }
      - { name: source-entity, value: meter_event_log }
      - { name: orchestrator-address, value: "data-orchestrator:8090" }
      # Where the folded table lands, replaced each run.
      - {
          name: derived,
          value: "s3://uw-dev-qe-test-data/derived/energy_meters/",
        }
      - { name: cluster-name, value: dev-aws }
      - { name: target-namespace, value: qe }
      - { name: aws-secret, value: duckdb-s3 }
      - { name: image-pull-secret, value: dockerhub-key }
      - { name: log-level, value: info }
      # One pod, one pass: parquet cannot be partitioned, so the aggregate holds
      # every meter at once. Measured over all 17.8M events — 8Gi/6GB is
      # OOM-killed, 12Gi/9GB completes in 1m43s, 16Gi/12GB in 1m51s. Compose
      # has 8Gi for the whole composition, which is why the fold cannot live
      # there whatever the SQL looks like.
      #
      # memory-limit is where DuckDB spills and must stay well under
      # fold-memory: both OOMs hit the container limit with DuckDB's own budget
      # unspent, because its JSON and list allocations are outside it.
      - { name: fold-cpu, value: "2" }
      - { name: fold-memory, value: 12Gi }
      - { name: memory-limit, value: 9GB }
      - { name: fold-scratch, value: 50Gi }
      - { name: temp-limit, value: 30GB }
      # The fold is 1m51s over every event, measured. These are the failure
      # detector, not the budget: backoffLimit does not catch an image that
      # will not pull, so a wrong tag costs exactly this long.
      - { name: timeout, value: 10m }
      - { name: job-active-deadline, value: 12m }
      - { name: job-ttl, value: 1h }
      # One line because Argo substitutes raw text with no re-indenting, so a
      # multi-line value stops the Job manifest parsing. `make check` proves it.
      #
      # Three things not to undo: it keys on the payload's @type, because
      # event_name reads "Event" on 116 rows written 2025-11-13; it has no tpr
      # guard, where GetMeter drops a whole register configuration for a missing
      # tpr and would empty an eighth of the estate; and installed_at is the
      # event's occurred_at, not the old column's Kafka envelope created_at.

  templates:
    - name: derive
      inputs:
        parameters:
          # Literal defaults, not {{workflow.parameters.*}}: under templateRef
          # those resolve against the CALLING workflow, which knows none of
          # them. spec.arguments carries the same values for the submit form.
          - { name: source-system-key, value: "energy_meterpoints" }
          - { name: source-entity, value: "meter_event_log" }
          - { name: orchestrator-address, value: "data-orchestrator:8090" }
          - {
              name: derived,
              value: "s3://uw-dev-qe-test-data/derived/energy_meters/",
            }
          - { name: cluster-name, value: "dev-aws" }
          - { name: target-namespace, value: "qe" }
          - { name: aws-secret, value: "duckdb-s3" }
          - { name: image-pull-secret, value: "dockerhub-key" }
          - { name: log-level, value: "info" }
          - { name: fold-cpu, value: "2" }
          - { name: fold-memory, value: "12Gi" }
          - { name: memory-limit, value: "9GB" }
          - { name: fold-scratch, value: "50Gi" }
          - { name: temp-limit, value: "30GB" }
          - { name: timeout, value: "10m" }
          - { name: job-active-deadline, value: "12m" }
          - { name: job-ttl, value: "1h" }
          - {
              name: query-duckdb-image,
              value: "registry.uw.systems/dev-enablement/query-duckdb:main",
            }
      steps:
        # The orchestrator is asked which export is newest, the same question
        # test-data-ui asks before a rebuild. Both halves of the answer come back
        # in one string because a step captures one value: the run id names the
        # output, the file names the input.
        - - name: resolve
            templateRef: { name: step-grpc-call, template: call }
            arguments:
              parameters:
                - { name: op-name, value: "derive-resolve-export" }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - {
                    name: address,
                    value: "{{inputs.parameters.orchestrator-address}}",
                  }
                - {
                    name: method,
                    value: "uw.platform.data.orchestrator.v1.OrchestratorService/ListExports",
                  }
                - name: payload
                  value: |-
                    {"system_key": "{{inputs.parameters.source-system-key}}", "entity_name": "{{inputs.parameters.source-entity}}", "latest_per_entity": true, "limit": 1}
                # The run id, then the first file. The read pattern is derived
                # from the file rather than assembled from a path convention:
                # the orchestrator's answer is the one thing that cannot drift.
                # destinationUri is the export's directory, so the read
                # pattern is it plus a glob — no reassembling it from a file
                # path. The previous version sliced files[0].uri apart with an
                # expression Argo could not parse, and passed the unevaluated
                # tag through to DuckDB as a literal path.
                - {
                    name: result-expr,
                    value: 'response.body.exports[0].destinationUri + "*.parquet"',
                  }
                - {
                    name: assert,
                    value: 'len(response.body.exports) == 1 and response.body.exports[0].destinationUri != ""',
                  }
                - {
                    name: assert-message,
                    value: "no export with files for {{inputs.parameters.source-system-key}}/{{inputs.parameters.source-entity}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }

        - - name: fold
            template: fold
            arguments:
              parameters:
                # Every chunk: one export is 180 files and the fold needs all
                # of them, because the log is chunked on its uuid primary key so
                # a meter's events are spread across every chunk.
                - name: source
                  value: "{{steps.resolve.outputs.parameters.result}}"
                - {
                    name: query-duckdb-image,
                    value: "{{inputs.parameters.query-duckdb-image}}",
                  }
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - {
                    name: aws-secret,
                    value: "{{inputs.parameters.aws-secret}}",
                  }
                - {
                    name: image-pull-secret,
                    value: "{{inputs.parameters.image-pull-secret}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - { name: derived, value: "{{inputs.parameters.derived}}" }
                - { name: fold-cpu, value: "{{inputs.parameters.fold-cpu}}" }
                - {
                    name: fold-memory,
                    value: "{{inputs.parameters.fold-memory}}",
                  }
                - {
                    name: memory-limit,
                    value: "{{inputs.parameters.memory-limit}}",
                  }
                - {
                    name: fold-scratch,
                    value: "{{inputs.parameters.fold-scratch}}",
                  }
                - {
                    name: temp-limit,
                    value: "{{inputs.parameters.temp-limit}}",
                  }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - {
                    name: job-active-deadline,
                    value: "{{inputs.parameters.job-active-deadline}}",
                  }
                - { name: job-ttl, value: "{{inputs.parameters.job-ttl}}" }
      outputs:
        parameters:
          # What compose reads, for the caller to pass on as a var. Derived from
          # the source run rather than plumbed back out of the Job: the path is
          # decided before the fold runs, which is also what lets a repeat call
          # find the artifact already there.
          - name: meters
            valueFrom:
              expression: "inputs.parameters['derived'] + 'meters.parquet'"

    # One Job, one pass over every event. Mirrors the compose step's shape —
    # same executor, same scratch volume, same bucket credentials — and differs
    # only in writing parquet and taking its SQL inline.
    - name: fold
      inputs:
        parameters:
          - name: source
          - name: query-duckdb-image
          - name: cluster-name
          - name: target-namespace
          - name: aws-secret
          - name: image-pull-secret
          - name: log-level
          - name: derived
          - name: fold-cpu
          - name: fold-memory
          - name: memory-limit
          - name: fold-scratch
          - name: temp-limit
          - name: timeout
          - name: job-active-deadline
          - name: job-ttl
          - name: fold-sql
            value: |-
              WITH ev AS ( SELECT CAST(t.meter_id AS VARCHAR) AS meter_id, CAST(t.mpxn AS VARCHAR) AS mpxn, {s: try_cast(t.saved_at AS TIMESTAMP), u: CAST(t.uuid AS VARCHAR)} AS seq, try_cast(t.occurred_at AS TIMESTAMP) AS occurred_at, regexp_extract(json_extract_string(t.payload, '$."@type"'), '[^.]+$') AS kind, coalesce(json_extract_string(t.payload, '$.meterTypeElec'), json_extract_string(t.payload, '$.meterTypeGas')) AS meter_type, json_extract_string(t.payload, '$.meterSerialNumber') AS serial, json_extract_string(t.payload, '$.meterpointNumber') AS mp_number, json_extract_string(t.payload, '$.measurementSystem') AS system, list_transform(CAST(json_extract(t.payload, '$.configuration.registers') AS JSON[]), lambda r: {dials: coalesce(CAST(json_extract(r, '$.noOfDials') AS INTEGER), 0), label: coalesce(json_extract_string(r, '$.label'), ''), register_id: json_extract_string(r, '$.id'), tpr: coalesce(json_extract_string(r, '$.tpr'), '')}) AS registers FROM read_parquet(getvariable('energy_meterpoints/meter_event_log'), union_by_name=true) t ), folded AS ( SELECT meter_id, any_value(mpxn) AS mpxn, arg_max(meter_type, seq) FILTER (WHERE meter_type IS NOT NULL AND kind IN ('MeterDiscoveredEvent', 'MeterTechnicalDetailsUpdatedEvent', 'MeterTypeCorrectedEvent')) AS meter_type, arg_max(serial, seq) FILTER (WHERE kind IN ('MeterDiscoveredEvent', 'MeterTechnicalDetailsUpdatedEvent')) AS serial, arg_max(mp_number, seq) FILTER (WHERE kind IN ('MeterDiscoveredEvent', 'MeterTechnicalDetailsUpdatedEvent')) AS mp_number, arg_max(system, seq) FILTER (WHERE kind = 'MeterDiscoveredEvent' AND system IS NOT NULL) AS system, arg_max(kind, seq) FILTER (WHERE kind IN ('MeterUninstalledEvent', 'MeterErroneouslyUninstalledEvent', 'MeterInstalledEvent', 'MeterTechnicalDetailsUpdatedEvent')) AS life_kind, arg_max(occurred_at, seq) FILTER (WHERE kind IN ('MeterUninstalledEvent', 'MeterErroneouslyUninstalledEvent', 'MeterInstalledEvent', 'MeterTechnicalDetailsUpdatedEvent')) AS life_at, arg_max(occurred_at, seq) FILTER (WHERE kind IN ('MeterInstalledEvent', 'MeterTechnicalDetailsUpdatedEvent')) AS installed_at, arg_max(registers, seq) FILTER (WHERE len(registers) > 0 AND kind IN ('MeterRegistersDiscoveredEvent', 'MeterRegisterConfigurationChangedEvent', 'MeterTechnicalDetailsUpdatedEvent')) AS registers FROM ev GROUP BY meter_id ) SELECT meter_id, coalesce(serial, '') AS meter_serial_number, coalesce(mp_number, mpxn) AS mpxn, coalesce(meter_type, '') AS meter_type, to_json(registers) AS registers, CASE system WHEN 'MEASUREMENT_SYSTEM_GAS_METRIC' THEN 'UnitOfMeasureMetric' WHEN 'MEASUREMENT_SYSTEM_GAS_IMPERIAL' THEN 'UnitOfMeasureImperial' ELSE '' END AS units_of_measure, CASE WHEN life_kind = 'MeterUninstalledEvent' THEN replace(CAST(life_at AS VARCHAR), ' ', 'T') || 'Z' END AS uninstalled_at, replace(CAST(installed_at AS VARCHAR), ' ', 'T') || 'Z' AS installed_at FROM folded;
      steps:
        - - name: fold
            templateRef:
              name: step-executor-remote-namespace
              template: execute-job
            arguments:
              parameters:
                - {
                    name: cluster-name,
                    value: "{{inputs.parameters.cluster-name}}",
                  }
                - {
                    name: target-namespace,
                    value: "{{inputs.parameters.target-namespace}}",
                  }
                - { name: job-name, value: "derive-meter-state" }
                - { name: timeout, value: "{{inputs.parameters.timeout}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
                - name: job-template
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    spec:
                      backoffLimit: 0
                      activeDeadlineSeconds: {{=int(duration(inputs.parameters['job-active-deadline']).Seconds())}}
                      ttlSecondsAfterFinished: {{=int(duration(inputs.parameters['job-ttl']).Seconds())}}
                      template:
                        spec:
                          restartPolicy: Never
                          imagePullSecrets:
                            - name: {{inputs.parameters.image-pull-secret}}
                          containers:
                            - name: fold
                              image: {{inputs.parameters.query-duckdb-image}}
                              imagePullPolicy: Always
                              env:
                                # The SQL itself, not a location: this Job runs
                                # in another namespace, so a manifest cannot
                                # hand it a file and there is no ConfigMap to
                                # mount.
                                - name: QUERY_SQL
                                  value: |-
                                    {{inputs.parameters.fold-sql}}
                                - name: VARS
                                  value: |-
                                    {"energy_meterpoints/meter_event_log": "{{inputs.parameters.source}}"}
                                - name: OUTPUT
                                  value: |-
                                    {{inputs.parameters.derived}}meters.parquet
                                - name: FORMAT
                                  value: "parquet"
                                - name: WORK_DIR
                                  value: "/scratch"
                                - name: DUCKDB_MEMORY_LIMIT
                                  value: |-
                                    {{inputs.parameters.memory-limit}}
                                - name: DUCKDB_THREADS
                                  value: |-
                                    {{inputs.parameters.fold-cpu}}
                                - name: DUCKDB_TEMP_LIMIT
                                  value: |-
                                    {{inputs.parameters.temp-limit}}
                                - {
                                    name: TIMEOUT,
                                    value: "{{=int(duration(inputs.parameters['timeout']).Seconds())}}",
                                  }
                                - name: LOG_LEVEL
                                  value: |-
                                    {{inputs.parameters.log-level}}
                                - name: AWS_ACCESS_KEY_ID
                                  valueFrom: { secretKeyRef: { name: {{inputs.parameters.aws-secret}}, key: AWS_ACCESS_KEY_ID } }
                                - name: AWS_SECRET_ACCESS_KEY
                                  valueFrom: { secretKeyRef: { name: {{inputs.parameters.aws-secret}}, key: AWS_SECRET_ACCESS_KEY } }
                                - name: AWS_REGION
                                  value: "eu-west-1"
                              resources:
                                requests:
                                  {
                                    cpu: "{{inputs.parameters.fold-cpu}}",
                                    memory: "{{inputs.parameters.fold-memory}}",
                                    ephemeral-storage: "{{inputs.parameters.fold-scratch}}",
                                  }
                                limits:
                                  {
                                    cpu: "{{inputs.parameters.fold-cpu}}",
                                    memory: "{{inputs.parameters.fold-memory}}",
                                    ephemeral-storage: "{{inputs.parameters.fold-scratch}}",
                                  }
                              volumeMounts:
                                - { name: scratch, mountPath: /scratch }
                          volumes:
                            # DuckDB's spill. The aggregate itself cannot spill
                            # — a hash table of every meter is memory — but the
                            # scan and the parquet write can.
                            - name: scratch
                              emptyDir:
                                { sizeLimit: "{{inputs.parameters.fold-scratch}}" }
