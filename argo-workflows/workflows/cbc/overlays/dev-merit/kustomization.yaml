apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/export-format

resources:
  - ../../base

patches:
  - target:
      kind: CronWorkflow
      name: data-export-cbc-customer
    path: data-export-cbc-customer.yaml
  - target:
      kind: CronWorkflow
      name: data-export-cbc-statement
    path: data-export-cbc-statement.yaml
