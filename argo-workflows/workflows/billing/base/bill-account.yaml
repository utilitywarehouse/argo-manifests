apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: flow-billing-bill-account
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Bill one or more accounts by input
    data.uw.systems/action-applies-when: _meta.energy.live:>0
    data.uw.systems/bind.account-numbers: _meta.identifiers.account_number[]
    data.uw.systems/bind.gentrack-bill-numbers: bills.energy_billing_adapter.billing_period_accounts.bill_number[]
  labels:
    app.kubernetes.io/component: flow
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: standalone
    data.uw.systems/actions: "true"
    data.uw.systems/action-scope: account
    data.uw.systems/system: billing
    data.uw.systems/capability: bill-run
spec:
  entrypoint: main
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - name: account-numbers
        description: >-
          UW customer account number(s), comma-separated. The same run bills one
          or many.
      - name: dry-run
        value: "true"
        enum: ["true", "false"]
        description: >-
          true plans, fabricates and validates only: no deletes, Mongo writes,
          upload, register or bill run.
      - name: validation-mode
        value: "attended"
        enum: ["attended", "unattended"]
        description: >-
          attended pauses at each gate before Commit; unattended runs straight
          through.
      - name: bill-period
        value: ""
        description: >-
          YYYY-MM, the bill-run month. The bill covers the month before it.
          Empty means the current month.
      - name: rebill
        value: "auto"
        enum: ["auto", "force", "off"]
        description: >-
          auto resets only if a committed bill blocks the period, and re-sends
          energy data when billing has none for it. force does both regardless;
          off fails if either is due, as a read-only preflight.
      - name: gentrack-bill-numbers
        value: ""
        description: >-
          Gentrack bill number(s) to re-send, comma-separated (e.g.
          J40000010621). Narrows which bills a re-send re-opens and never
          triggers one. Empty means the period being billed.
      - name: engineer-visit
        value: "false"
        enum: ["true", "false"]
        description: >-
          true adds an engineer-visit debit (metering works, £190 including VAT)
          to each account's bill, charged on the 16th of the month before.
      - name: verify
        value: "false"
        enum: ["true", "false"]
        description: >-
          true also observes the ledger, BigQuery and the finance one-liners.
          The bill is the same either way.
      - name: log-level
        value: "info"
        enum: ["info", "debug"]
        description: One level for the whole pipeline.
  templates:
    - name: main
      inputs:
        parameters:
          - { name: account-numbers }
          - { name: dry-run, value: "true" }
          - { name: validation-mode, value: attended }
          - { name: bill-period, value: "" }
          - { name: rebill, value: auto }
          - { name: gentrack-bill-numbers, value: "" }
          - { name: engineer-visit, value: "false" }
          - { name: verify, value: "false" }
          - { name: log-level, value: info }
      steps:
        - - name: bill-account
            templateRef: { name: step-billing-bill-account, template: main }
            arguments:
              parameters:
                - {
                    name: account-numbers,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - { name: dry-run, value: "{{inputs.parameters.dry-run}}" }
                - {
                    name: validation-mode,
                    value: "{{inputs.parameters.validation-mode}}",
                  }
                - {
                    name: bill-period,
                    value: "{{inputs.parameters.bill-period}}",
                  }
                - { name: rebill, value: "{{inputs.parameters.rebill}}" }
                - {
                    name: gentrack-bill-numbers,
                    value: "{{inputs.parameters.gentrack-bill-numbers}}",
                  }
                - {
                    name: engineer-visit,
                    value: "{{inputs.parameters.engineer-visit}}",
                  }
                - { name: verify, value: "{{inputs.parameters.verify}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
