apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: flow-billing-bill-account
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Bill one or more accounts by input
  labels:
    app.kubernetes.io/component: flow
    workflows.argoproj.io/creator: billing
    workflows.argoproj.io/invocation: standalone
    data.uw.systems/system: billing
    data.uw.systems/capability: bill-run
spec:
  entrypoint: main
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - { name: account-numbers } # UW customer account number(s), comma-separated — one or many
      - { name: dry-run, value: "true" } # default safe: plan + fabricate only, no mongo writes/upload/register/bill-run
      - { name: validation-mode, value: attended } # attended pauses before Commit
      - { name: bill-period, value: "" } # bill-run month; bills the month before it. Empty => current month
      - { name: rebill, value: auto } # clear bills + re-send energy data first: auto (only if needed) | force | off
      - { name: gentrack-bill-numbers, value: "" } # which bills to re-open, comma-separated (e.g. J40000010621). Empty => the period being billed
      - { name: engineer-visit, value: "false" }
      - { name: verify, value: "false" } # true => also observe the ledger, BigQuery and the finance export around the bill. Same bill either way
      - { name: log-level, value: info } # info | debug — one level for every step and every tool a step dispatches
  templates:
    - name: main
      inputs:
        parameters:
          - { name: account-numbers }
          - { name: dry-run, value: "true" }
          - { name: validation-mode, value: attended }
          - { name: bill-period, value: "" }
          - { name: rebill, value: auto }
          - { name: gentrack-bill-numbers, value: "" }
          - { name: engineer-visit, value: "false" }
          - { name: verify, value: "false" }
          - { name: log-level, value: info }
      steps:
        - - name: bill-account
            templateRef: { name: step-billing-bill-account, template: main }
            arguments:
              parameters:
                - {
                    name: account-numbers,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - { name: dry-run, value: "{{inputs.parameters.dry-run}}" }
                - {
                    name: validation-mode,
                    value: "{{inputs.parameters.validation-mode}}",
                  }
                - {
                    name: bill-period,
                    value: "{{inputs.parameters.bill-period}}",
                  }
                - { name: rebill, value: "{{inputs.parameters.rebill}}" }
                - {
                    name: gentrack-bill-numbers,
                    value: "{{inputs.parameters.gentrack-bill-numbers}}",
                  }
                - {
                    name: engineer-visit,
                    value: "{{inputs.parameters.engineer-visit}}",
                  }
                - { name: verify, value: "{{inputs.parameters.verify}}" }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
