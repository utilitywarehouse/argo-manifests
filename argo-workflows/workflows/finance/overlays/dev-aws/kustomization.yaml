apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/export-format

resources:
  - ../../base

patches:
  - target:
      kind: WorkflowTemplate
      name: flow-finance-dd-run
    path: labels.yaml
  - target:
      kind: CronWorkflow
      name: data-export-debt-collection
    path: data-export-debt-collection.yaml
