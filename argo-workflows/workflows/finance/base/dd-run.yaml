apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: flow-finance-dd-run
  namespace: qe-argo-workflows
  annotations:
    workflows.argoproj.io/description: >-
      Collect one or more billed accounts by direct debit in dev
    data.uw.systems/action-applies-when: _meta.billed:*
    data.uw.systems/bind.account-numbers: _meta.identifiers.account_number[]
    data.uw.systems/bind.invoice-id: bills.bills_total_api.invoiceid
  labels:
    app.kubernetes.io/component: flow
    workflows.argoproj.io/creator: payments
    workflows.argoproj.io/invocation: standalone
    data.uw.systems/actions: "true"
    data.uw.systems/action-scope: bill
    data.uw.systems/system: finance
    data.uw.systems/capability: dd-run
spec:
  entrypoint: main
  serviceAccountName: workflow-step-executor
  arguments:
    parameters:
      - name: account-numbers
        description: >-
          UW customer account number(s), comma-separated. Accounts that already
          have a bill.
      - name: dry-run
        value: "true"
        enum: ["true", "false"]
        description: >-
          true runs the preflight and fabricates only: no invoice moves, nothing
          uploaded, nothing booked.
      - name: validation-mode
        value: "attended"
        enum: ["attended", "unattended"]
        description: >-
          attended pauses before the bucket and before processing; unattended
          runs straight through.
      - name: invoice-id
        value: ""
        description: >-
          One account only. Needed when it has two invoices due the same day;
          empty takes the account's own invoice.
      - name: amount
        value: ""
        description: >-
          Empty takes each account's own invoice plus adjustments, the usual
          run. An amount here needs no invoice at all.
      - name: type
        value: ""
        enum: ["", "collection", "refund"]
        description: Empty lets the amount's sign decide.
      - name: verify
        value: "false"
        enum: ["true", "false"]
        description: >-
          true also waits for the payment in the ledger and BigQuery's
          transaction log.
      - name: verify-wait
        value: 10m
        description: >-
          How long verify waits for the payment to reach the ledger and the
          transaction log.
      - name: log-level
        value: "info"
        enum: ["info", "debug"]
        description: One level for the whole pipeline.
  templates:
    - name: main
      inputs:
        parameters:
          - { name: account-numbers }
          - { name: dry-run, value: "true" }
          - { name: validation-mode, value: attended }
          - { name: invoice-id, value: "" }
          - { name: amount, value: "" }
          - { name: type, value: "" }
          - { name: verify, value: "false" }
          - { name: verify-wait, value: 10m }
          - { name: log-level, value: info }
      steps:
        - - name: dd-run
            templateRef: { name: step-finance-dd-run, template: main }
            arguments:
              parameters:
                - {
                    name: account-numbers,
                    value: "{{inputs.parameters.account-numbers}}",
                  }
                - { name: dry-run, value: "{{inputs.parameters.dry-run}}" }
                - {
                    name: validation-mode,
                    value: "{{inputs.parameters.validation-mode}}",
                  }
                - {
                    name: invoice-id,
                    value: "{{inputs.parameters.invoice-id}}",
                  }
                - { name: amount, value: "{{inputs.parameters.amount}}" }
                - { name: type, value: "{{inputs.parameters.type}}" }
                - { name: verify, value: "{{inputs.parameters.verify}}" }
                - {
                    name: verify-wait,
                    value: "{{inputs.parameters.verify-wait}}",
                  }
                - { name: log-level, value: "{{inputs.parameters.log-level}}" }
