# https://argo-workflows.readthedocs.io/en/latest/workflow-controller-configmap/
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
data:
  workflowDefaults: |
    spec:
      serviceAccountName: workflow-step-executor
      podMetadata:
        annotations:
          uw.systems/kyverno-inject-sidecar-request: vault-init-container-aws
      ttlStrategy:
        secondsAfterCompletion: 3600
        secondsAfterSuccess: 3600
        secondsAfterFailure: 86400
      podGC:
        strategy: OnWorkflowCompletion
        deleteDelayDuration: 1h
      volumes:
        - name: tmp
          emptyDir: {}
      templateDefaults:
        retryStrategy:
          limit: "3"
          retryPolicy: Always
          backoff:
            duration: 20s
            factor: "2"
          expression: >-
            lastRetry.message matches "vault-credentials" &&
            lastRetry.exitCode == "-1"
        container:
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      imagePullSecrets:
        - name: dockerhub-key

  workflowRestrictions: |
    templateReferencing: Strict

  parallelism: "10"

  resourceRateLimit: |
    limit: 10
    burst: 25

  # Defaults for main containers. These can be overridden by the template.
  mainContainer: |
    imagePullPolicy: Always
    resources:
      requests:
        cpu: 0.1
        memory: 64Mi
      limits:
        cpu: 0.5
        memory: 512Mi

  # executor controls how the init and wait container should be customized
  executor: |
    imagePullPolicy: Always
    env:
      - name: AWS_SHARED_CREDENTIALS_FILE
        value: /etc/aws/credentials
    volumeMounts:
      - name: vault-aws-credentials
        mountPath: /etc/aws
    resources:
      requests:
        cpu: 0.1
        memory: 64Mi
      limits:
        cpu: 0.5
        memory: 512Mi
