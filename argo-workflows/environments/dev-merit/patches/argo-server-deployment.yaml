apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-server
spec:
  template:
    metadata:
      annotations:
        vault.uw.systems/aws-credentials: "sts-http"
    spec:
      serviceAccountName: argo-server
      containers:
        - name: argo-server
          args:
            - server
            - --namespaced
            - --auth-mode=server
            # - --auth-mode=sso
            - --secure=false
          readinessProbe:
            httpGet:
              path: /
              port: 2746
              scheme: HTTP
          livenessProbe:
            httpGet:
              path: /
              port: 2746
              scheme: HTTP
